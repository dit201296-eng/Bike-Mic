          write("app/src/main/java/com/bikemic/app/DeviceHealthMonitor.kt", """
              package com.bikemic.app

              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.os.BatteryManager
              import android.os.Build
              import android.os.PowerManager

              class DeviceHealthMonitor(
                  private val context: Context,
                  private val onUpdate: (batteryPct: Int, isCharging: Boolean, thermal: Int) -> Unit
              ) {
                  companion object {
                      const val THERMAL_NONE = 0
                      const val THERMAL_LIGHT = 1
                      const val THERMAL_MODERATE = 2
                      const val THERMAL_SEVERE = 3
                      const val THERMAL_CRITICAL = 4
                  }

                  @Volatile var batteryPct: Int = 100
                      private set
                  @Volatile var isCharging: Boolean = false
                      private set
                  @Volatile var thermalStatus: Int = THERMAL_NONE
                      private set

                  private var batteryReceiver: BroadcastReceiver? = null
                  private var thermalListener: PowerManager.OnThermalStatusChangedListener? = null
                  private var powerManager: PowerManager? = null

                  fun start() {
                      batteryReceiver = object : BroadcastReceiver() {
                          override fun onReceive(ctx: Context?, intent: Intent?) {
                              intent ?: return
                              val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                              val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                              if (level < 0 || scale <= 0) return
                              batteryPct = (level * 100f / scale).toInt()
                              val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                              isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                           status == BatteryManager.BATTERY_STATUS_FULL
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                      }
                      context.registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                          thermalListener = PowerManager.OnThermalStatusChangedListener { sys ->
                              thermalStatus = mapSysThermal(sys)
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                          powerManager?.addThermalStatusListener(context.mainExecutor, thermalListener!!)
                      }
                  }

                  private fun mapSysThermal(sys: Int): Int = when (sys) {
                      PowerManager.THERMAL_STATUS_NONE -> THERMAL_NONE
                      PowerManager.THERMAL_STATUS_LIGHT -> THERMAL_LIGHT
                      PowerManager.THERMAL_STATUS_MODERATE -> THERMAL_MODERATE
                      PowerManager.THERMAL_STATUS_SEVERE -> THERMAL_SEVERE
                      else -> THERMAL_CRITICAL
                  }

                  fun stop() {
                      runCatching { batteryReceiver?.let { context.unregisterReceiver(it) } }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          runCatching {
                              thermalListener?.let { powerManager?.removeThermalStatusListener(it) }
                          }
                      }
                  }
              }
          """)

          write("app/src/main/java/com/bikemic/app/LeaderElection.kt", """
              package com.bikemic.app

              class LeaderElection(
                  private val selfId: Long,
                  private val minBattery: Int = 25,
                  private val thermalHoldMs: Long = 25_000L
              ) {
                  @Volatile var currentHostId: Long = selfId
                      private set
                  @Volatile var currentEpoch: Long = 0L
                      private set

                  private var thermalHighSinceMs: Long = 0L
                  private var lowBatSinceMs: Long = 0L

                  fun healthScore(bat: Int, chg: Boolean, thermal: Int): Double {
                      var s = bat.toDouble()
                      when (thermal) {
                          DeviceHealthMonitor.THERMAL_CRITICAL -> return -1000.0
                          DeviceHealthMonitor.THERMAL_SEVERE -> s -= 60.0
                          DeviceHealthMonitor.THERMAL_MODERATE -> s -= 30.0
                          DeviceHealthMonitor.THERMAL_LIGHT -> s -= 8.0
                      }
                      if (chg) s += 20.0
                      return s
                  }

                  fun shouldStepDown(bat: Int, chg: Boolean, thermal: Int, nowMs: Long): Boolean {
                      if (currentHostId != selfId) return false
                      if (thermal >= DeviceHealthMonitor.THERMAL_SEVERE) {
                          if (thermalHighSinceMs == 0L) thermalHighSinceMs = nowMs
                          if (nowMs - thermalHighSinceMs >= thermalHoldMs) return true
                      } else {
                          thermalHighSinceMs = 0L
                      }
                      if (bat < minBattery && !chg) {
                          if (lowBatSinceMs == 0L) lowBatSinceMs = nowMs
                          if (nowMs - lowBatSinceMs >= thermalHoldMs) return true
                      } else {
                          lowBatSinceMs = 0L
                      }
                      return false
                  }

                  fun pickBestLeader(selfPeer: PeerInfo, peers: Collection<PeerInfo>, excludeId: Long = -1L): PeerInfo? {
                      val all = ArrayList<PeerInfo>(peers.size + 1)
                      all.add(selfPeer)
                      all.addAll(peers.filter { it.handshakeOk })
                      return all
                          .asSequence()
                          .filter { it.nodeId != excludeId }
                          .filter { it.thermalStatus < DeviceHealthMonitor.THERMAL_CRITICAL }
                          .sortedWith(
                              compareBy<PeerInfo> { it.chainRank }
                                  .thenByDescending { healthScore(it.batteryPct, it.isCharging, it.thermalStatus) }
                                  .thenBy { it.nodeId }
                          )
                          .firstOrNull()
                  }

                  fun acceptHostAnnouncement(hostId: Long, epoch: Long): Boolean {
                      if (epoch > currentEpoch ||
                          (epoch == currentEpoch && hostId < currentHostId)) {
                          currentHostId = hostId
                          currentEpoch = epoch
                          return true
                      }
                      return false
                  }

                  fun declareSelfAsHost(minEpoch: Long = currentEpoch): Pair<Long, Long> {
                      currentHostId = selfId
                      currentEpoch = maxOf(currentEpoch, minEpoch) + 1L
                      return selfId to currentEpoch
                  }
              }
          """)

          write("app/src/main/java/com/bikemic/app/MeshVoiceEngine.kt", """
              package com.bikemic.app

              import android.content.Context
              import android.media.AudioAttributes
              import android.media.AudioFormat
              import android.media.AudioManager
              import android.media.AudioRecord
              import android.media.AudioTrack
              import android.media.MediaRecorder
              import android.media.audiofx.AcousticEchoCanceler
              import android.media.audiofx.NoiseSuppressor
              import android.net.ConnectivityManager
              import android.net.wifi.WifiManager
              import androidx.compose.runtime.mutableIntStateOf
              import androidx.compose.runtime.mutableLongStateOf
              import androidx.compose.runtime.mutableStateOf
              import kotlinx.coroutines.*
              import org.json.JSONArray
              import org.json.JSONObject
              import java.io.BufferedReader
              import java.io.FileReader
              import java.net.DatagramPacket
              import java.net.DatagramSocket
              import java.net.Inet4Address
              import java.net.InetAddress
              import java.net.InetSocketAddress
              import java.net.MulticastSocket
              import java.net.NetworkInterface
              import java.nio.ByteBuffer
              import java.util.Collections
              import java.util.concurrent.ConcurrentHashMap
              import java.util.concurrent.atomic.AtomicInteger
              import kotlin.random.Random

              class MeshVoiceEngine(private val context: Context) {

                  companion object {
                      private const val DISCOVERY_PORT = 50004
                      private const val AUDIO_PORT = 50005
                      private const val MULTICAST_GROUP = "239.255.42.99"
                      private const val SAMPLE_RATE = 16000
                      private const val FRAME_BYTES = 640
                      private const val MAGIC_AUDIO: Byte = 0x42
                      private const val HEADER_SIZE = 15
                  }

                  val selfId: Long = Random.nextLong(100_000L, Long.MAX_VALUE)
                  @Volatile var userName: String = "أبو ناصر"
                  @Volatile var chainRank: Int = 1
                  @Volatile var isPttPressed: Boolean = false
                  @Volatile var isOpenMicOn: Boolean = false
                  @Volatile var selectAllPeers: Boolean = true
                  val allowedPeerIds: MutableSet<Long> = Collections.newSetFromMap(ConcurrentHashMap())

                  @Volatile var batteryPct: Int = 100
                  @Volatile var isCharging: Boolean = false
                  @Volatile var thermalStatus: Int = 0

                  val peersVersion = mutableIntStateOf(0)
                  val connectedCount = mutableIntStateOf(0)
                  val currentHostIdState = mutableLongStateOf(selfId)
                  val currentEpochState = mutableLongStateOf(0L)
                  val statusText = mutableStateOf("جارٍ البحث عن دراجين على الشبكة...")
                  val activeSpeakerName = mutableStateOf<String?>(null)
                  val leaderChangeEvent = mutableStateOf<String?>(null)

                  val debugSentCount = mutableIntStateOf(0)
                  val debugReceivedCount = mutableIntStateOf(0)
                  val debugLastError = mutableStateOf("لا توجد أخطاء")
                  @Volatile private var cachedIfacesInfo: List<Pair<String, String>> = emptyList()
                  @Volatile private var cachedTargetIps: Set<InetAddress> = emptySet()
                  @Volatile private var cachedLocalIps: Set<String> = emptySet()

                  val peersMap = ConcurrentHashMap<Long, PeerInfo>()
                  private val knownHintIps = Collections.newSetFromMap(ConcurrentHashMap<String, Boolean>())

                  private val seenAudio = Collections.synchronizedMap(
                      object : LinkedHashMap<Long, Boolean>(1024, 0.75f, true) {
                          override fun removeEldestEntry(eldest: MutableMap.MutableEntry<Long, Boolean>?) = size > 900
                      }
                  )

                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val seqCounter = AtomicInteger(1)

                  private val election = LeaderElection(selfId)
                  private var multicastLock: WifiManager.MulticastLock? = null
                  private var wifiLock: WifiManager.WifiLock? = null

                  @Volatile private var discoverySocket: DatagramSocket? = null
                  @Volatile private var multicastSocket: MulticastSocket? = null
                  @Volatile private var audioSocket: DatagramSocket? = null

                  fun start() {
                      runCatching {
                          val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          multicastLock = wifi.createMulticastLock("BikeMicMulticast").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                          wifiLock = wifi.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "BikeMicWifi").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }.onFailure { debugLastError.value = "WifiLock: ${it.message}" }

                      runCatching {
                          val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.mode = AudioManager.MODE_IN_COMMUNICATION
                          am.isSpeakerphoneOn = true
                      }

                      scope.launch {
                          refreshNetworkTopology()
                          val sockReady = initDiscoverySockets()
                          if (sockReady) {
                              startDiscoveryReceiver()
                              startMulticastReceiver()
                              startHeartbeatLoop()
                              startElectionLoop()
                          }
                          startAudioEngine()
                      }
                  }

                  fun stop() {
                      scope.cancel()
                      runCatching { discoverySocket?.close() }
                      runCatching { multicastSocket?.close() }
                      runCatching { audioSocket?.close() }
                      runCatching { if (multicastLock?.isHeld == true) multicastLock?.release() }
                      runCatching { if (wifiLock?.isHeld == true) wifiLock?.release() }
                  }

                  fun updateUser(newName: String, newRank: Int) {
                      userName = newName
                      chainRank = newRank
                      peersVersion.intValue += 1
                      scope.launch { sendHeartbeatNow() }
                  }

                  fun updateHealth(bat: Int, chg: Boolean, thermal: Int) {
                      batteryPct = bat
                      isCharging = chg
                      thermalStatus = thermal
                      peersVersion.intValue += 1
                  }

                  fun getDebugInterfaces(): List<Pair<String, String>> = cachedIfacesInfo

                  fun getDebugBroadcasts(): List<String> = cachedTargetIps.mapNotNull { it.hostAddress }.sorted()

                  private fun isIgnoredInterface(name: String): Boolean {
                      val n = name.lowercase()
                      return n.startsWith("rmnet") || n.startsWith("ccmni") ||
                             n.startsWith("pdp") || n.startsWith("dummy") ||
                             n.startsWith("tun") || n.startsWith("ppp") ||
                             n.startsWith("clat") || n.startsWith("v4-") || n.startsWith("lo")
                  }

                  private fun refreshNetworkTopology() {
                      val targets = LinkedHashSet<InetAddress>()
                      val localIps = HashSet<String>()
                      val ifaceList = ArrayList<Pair<String, String>>()

                      runCatching {
                          val ifaces = NetworkInterface.getNetworkInterfaces()
                          while (ifaces != null && ifaces.hasMoreElements()) {
                              val nif = ifaces.nextElement()
                              if (!nif.isUp || nif.isLoopback || isIgnoredInterface(nif.name)) continue

                              for (ia in nif.interfaceAddresses) {
                                  val addr = ia.address
                                  if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                      val ipStr = addr.hostAddress ?: continue
                                      localIps.add(ipStr)
                                      ifaceList.add(nif.name to ipStr)

                                      ia.broadcast?.let { targets.add(it) }

                                      val prefix = ia.networkPrefixLength.toInt()
                                      if (prefix in 8..30) {
                                          val b = addr.address
                                          val ipInt = ((b[0].toInt() and 0xFF) shl 24) or
                                                      ((b[1].toInt() and 0xFF) shl 16) or
                                                      ((b[2].toInt() and 0xFF) shl 8) or
                                                      (b[3].toInt() and 0xFF)
                                          val mask = -1 shl (32 - prefix)
                                          val bcastInt = (ipInt and mask) or mask.inv()
                                          val bcastBytes = byteArrayOf(
                                              (bcastInt ushr 24).toByte(),
                                              (bcastInt ushr 16).toByte(),
                                              (bcastInt ushr 8).toByte(),
                                              bcastInt.toByte()
                                          )
                                          runCatching { targets.add(InetAddress.getByAddress(bcastBytes)) }

                                          val gwBytes = byteArrayOf(b[0], b[1], b[2], 1)
                                          val gwAddr = InetAddress.getByAddress(gwBytes)
                                          if (gwAddr.hostAddress != ipStr) targets.add(gwAddr)
                                      }
                                  }
                              }
                          }
                      }

                      runCatching {
                          val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          for (net in cm.allNetworks) {
                              val lp = cm.getLinkProperties(net) ?: continue
                              val ifName = lp.interfaceName ?: ""
                              if (ifName.isNotEmpty() && isIgnoredInterface(ifName)) continue
                              for (route in lp.routes) {
                                  val gw = route.gateway
                                  if (gw is Inet4Address && !gw.isLoopbackAddress && !gw.isAnyLocalAddress) {
                                      val gwStr = gw.hostAddress ?: ""
                                      if (gwStr !in localIps) targets.add(gw)
                                  }
                              }
                          }
                      }

                      runCatching {
                          val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          @Suppress("DEPRECATION")
                          val dhcp = wifi.dhcpInfo
                          if (dhcp != null && dhcp.gateway != 0) {
                              val g = dhcp.gateway
                              val gwBytes = byteArrayOf(
                                  (g and 0xFF).toByte(),
                                  ((g shr 8) and 0xFF).toByte(),
                                  ((g shr 16) and 0xFF).toByte(),
                                  ((g shr 24) and 0xFF).toByte()
                              )
                              val gwAddr = InetAddress.getByAddress(gwBytes)
                              if (gwAddr.hostAddress !in localIps) targets.add(gwAddr)
                          }
                      }

                      runCatching {
                          BufferedReader(FileReader("/proc/net/arp")).use { br ->
                              var line = br.readLine()
                              while (line != null) {
                                  val parts = line.trim().split(Regex("\\s+"))
                                  if (parts.size >= 6) {
                                      val ip = parts[0]
                                      val dev = parts[5]
                                      if (ip.matches(Regex("\\d+\\.\\d+\\.\\d+\\.\\d+")) &&
                                          ip != "0.0.0.0" && ip !in localIps && !isIgnoredInterface(dev)) {
                                          runCatching { targets.add(InetAddress.getByName(ip)) }
                                      }
                                  }
                                  line = br.readLine()
                              }
                          }
                      }

                      peersMap.values.forEach { p ->
                          if (p.ipAddress.isNotEmpty() && p.ipAddress !in localIps) {
                              runCatching { targets.add(InetAddress.getByName(p.ipAddress)) }
                          }
                      }
                      knownHintIps.forEach { ip ->
                          if (ip !in localIps) {
                              runCatching { targets.add(InetAddress.getByName(ip)) }
                          }
                      }

                      runCatching { targets.add(InetAddress.getByName(MULTICAST_GROUP)) }
                      runCatching { targets.add(InetAddress.getByName("255.255.255.255")) }

                      cachedLocalIps = localIps
                      cachedIfacesInfo = ifaceList
                      cachedTargetIps = targets
                  }

                  private fun initDiscoverySockets(): Boolean {
                      return try {
                          discoverySocket = DatagramSocket(null).apply {
                              reuseAddress = true
                              broadcast = true
                              bind(InetSocketAddress(DISCOVERY_PORT))
                          }
                          runCatching {
                              val group = InetAddress.getByName(MULTICAST_GROUP)
                              val ms = MulticastSocket(DISCOVERY_PORT).apply {
                                  reuseAddress = true
                                  timeToLive = 4
                              }
                              var joinedAny = false
                              val ifaces = NetworkInterface.getNetworkInterfaces()
                              while (ifaces != null && ifaces.hasMoreElements()) {
                                  val nif = ifaces.nextElement()
                                  if (nif.isUp && !nif.isLoopback && nif.supportsMulticast() && !isIgnoredInterface(nif.name)) {
                                      runCatching {
                                          ms.joinGroup(InetSocketAddress(group, DISCOVERY_PORT), nif)
                                          joinedAny = true
                                      }
                                  }
                              }
                              if (!joinedAny) {
                                  @Suppress("DEPRECATION")
                                  runCatching { ms.joinGroup(group) }
                              }
                              multicastSocket = ms
                          }
                          true
                      } catch (e: Exception) {
                          debugLastError.value = "فشل فتح منفذ الشبكة: ${e.message}"
                          false
                      }
                  }

                  private fun sendUnicastJson(obj: JSONObject, targetAddr: InetAddress) {
                      val sock = discoverySocket ?: return
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      runCatching {
                          sock.send(DatagramPacket(data, data.size, targetAddr, DISCOVERY_PORT))
                          debugSentCount.intValue += 1
                      }
                  }

                  private fun sendToAllDiscoveryTargets(obj: JSONObject) {
                      val sock = discoverySocket ?: return
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      for (target in cachedTargetIps) {
                          runCatching {
                              sock.send(DatagramPacket(data, data.size, target, DISCOVERY_PORT))
                              debugSentCount.intValue += 1
                          }
                      }
                  }

                  private fun buildSelfHeartbeatJson(type: String = "HB"): JSONObject {
                      val peersArr = JSONArray()
                      peersMap.values.forEach { p ->
                          if (p.ipAddress.isNotEmpty()) {
                              peersArr.put(JSONObject().apply {
                                  put("id", p.nodeId)
                                  put("ip", p.ipAddress)
                                  put("name", p.name)
                                  put("rank", p.chainRank)
                              })
                          }
                      }
                      return JSONObject().apply {
                          put("t", type)
                          put("id", selfId)
                          put("name", userName)
                          put("rank", chainRank)
                          put("bat", batteryPct)
                          put("chg", isCharging)
                          put("thm", thermalStatus)
                          put("epoch", election.currentEpoch)
                          put("host", election.currentHostId)
                          put("peers", peersArr)
                      }
                  }

                  private fun sendHeartbeatNow() {
                      refreshNetworkTopology()
                      sendToAllDiscoveryTargets(buildSelfHeartbeatJson("HB"))
                  }

                  private fun startDiscoveryReceiver() {
                      scope.launch {
                          val buf = ByteArray(4096)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  discoverySocket?.receive(pkt) ?: break
                                  handleDiscoveryPacket(pkt)
                              } catch (e: Exception) {
                                  if (isActive) delay(200)
                              }
                          }
                      }
                  }

                  private fun startMulticastReceiver() {
                      val ms = multicastSocket ?: return
                      scope.launch {
                          val buf = ByteArray(4096)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  ms.receive(pkt)
                                  handleDiscoveryPacket(pkt)
                              } catch (e: Exception) {
                                  if (isActive) delay(300)
                              }
                          }
                      }
                  }

                  private fun handleDiscoveryPacket(pkt: DatagramPacket) {
                      runCatching {
                          val text = String(pkt.data, 0, pkt.length, Charsets.UTF_8)
                          val msg = JSONObject(text)
                          val senderId = msg.optLong("id", -1L)
                          if (senderId <= 0L || senderId == selfId) return

                          debugReceivedCount.intValue += 1

                          val senderIp = pkt.address.hostAddress ?: ""
                          if (senderIp.isNotEmpty() && senderIp !in cachedLocalIps) {
                              knownHintIps.add(senderIp)
                          }

                          val type = msg.optString("t")
                          when (type) {
                              "HB", "DIRECT_ACK" -> {
                                  val existed = peersMap[senderId]
                                  val peer = PeerInfo(
                                      nodeId = senderId,
                                      name = msg.optString("name", existed?.name ?: "راكب"),
                                      chainRank = msg.optInt("rank", existed?.chainRank ?: 2),
                                      batteryPct = msg.optInt("bat", existed?.batteryPct ?: 100),
                                      isCharging = msg.optBoolean("chg", existed?.isCharging ?: false),
                                      thermalStatus = msg.optInt("thm", existed?.thermalStatus ?: 0),
                                      epoch = msg.optLong("epoch", existed?.epoch ?: 0L),
                                      currentHostId = msg.optLong("host", senderId),
                                      ipAddress = senderIp,
                                      lastSeenMs = System.currentTimeMillis(),
                                      handshakeOk = true
                                  )
                                  peersMap[senderId] = peer
                                  if (selectAllPeers) allowedPeerIds.add(senderId)

                                  val remoteHost = msg.optLong("host", -1L)
                                  val remoteEpoch = msg.optLong("epoch", 0L)
                                  if (remoteHost > 0L && election.acceptHostAnnouncement(remoteHost, remoteEpoch)) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                  }

                                  val gossipArr = msg.optJSONArray("peers")
                                  if (gossipArr != null) {
                                      for (i in 0 until gossipArr.length()) {
                                          val gp = gossipArr.optJSONObject(i) ?: continue
                                          val gId = gp.optLong("id", -1L)
                                          val gIp = gp.optString("ip", "")
                                          if (gId > 0L && gId != selfId && gIp.isNotEmpty() && gIp !in cachedLocalIps) {
                                              if (knownHintIps.add(gIp) || !peersMap.containsKey(gId)) {
                                                  runCatching {
                                                      sendUnicastJson(buildSelfHeartbeatJson("HB"), InetAddress.getByName(gIp))
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  if (type == "HB" || existed == null || !existed.handshakeOk) {
                                      sendUnicastJson(buildSelfHeartbeatJson("DIRECT_ACK"), pkt.address)
                                  }

                                  updateUiCounters()
                              }
                              "STEP_DOWN" -> {
                                  val epoch = msg.optLong("epoch", 0L)
                                  if (epoch >= election.currentEpoch) {
                                      statusText.value = "القائد السابق يتنازل... جارٍ انتخاب قائد جديد"
                                  }
                              }
                              "I_AM_HOST" -> {
                                  val newHost = msg.optLong("id", -1L)
                                  val epoch = msg.optLong("epoch", 0L)
                                  if (newHost > 0L && election.acceptHostAnnouncement(newHost, epoch)) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                      val hostName = if (newHost == selfId) userName else (peersMap[newHost]?.name ?: "راكب")
                                      leaderChangeEvent.value = "القائد الجديد: $hostName"
                                      statusText.value = "متصل • القائد: $hostName"
                                  }
                              }
                          }
                      }.onFailure {
                          debugLastError.value = "Parse: ${it.message}"
                      }
                  }

                  private fun updateUiCounters() {
                      val live = peersMap.values.count { it.handshakeOk }
                      connectedCount.intValue = live
                      peersVersion.intValue += 1
                      if (live > 0) {
                          val hostId = election.currentHostId
                          val hostName = if (hostId == selfId) "أنت" else (peersMap[hostId]?.name ?: "راكب")
                          statusText.value = "متصل ($live) • القائد: $hostName"
                      } else {
                          statusText.value = "جارٍ البحث... (اتصل بنفس الهوتسبوت أو الراوتر)"
                      }
                  }

                  private fun startHeartbeatLoop() {
                      scope.launch {
                          while (isActive) {
                              runCatching {
                                  sendHeartbeatNow()
                                  val now = System.currentTimeMillis()
                                  val dead = peersMap.filterValues { now - it.lastSeenMs > 9000L }.keys
                                  if (dead.isNotEmpty()) {
                                      dead.forEach { peersMap.remove(it) }
                                  }
                                  updateUiCounters()
                              }.onFailure {
                                  debugLastError.value = "HB: ${it.message}"
                              }
                              delay(1400L + Random.nextLong(0L, 400L))
                          }
                      }
                  }

                  private fun startElectionLoop() {
                      scope.launch {
                          var stepDownOriginId = -1L
                          var electionTriggerMs = 0L

                          while (isActive) {
                              val now = System.currentTimeMillis()
                              val currentHost = election.currentHostId
                              val hostMissing = currentHost != selfId && !peersMap.containsKey(currentHost)

                              if (peersMap.isNotEmpty() && election.currentEpoch == 0L && chainRank == 1 && currentHost != selfId) {
                                  val (newHost, newEpoch) = election.declareSelfAsHost()
                                  currentHostIdState.longValue = newHost
                                  currentEpochState.longValue = newEpoch
                                  val announce = JSONObject().apply {
                                      put("t", "I_AM_HOST")
                                      put("id", newHost)
                                      put("epoch", newEpoch)
                                  }
                                  sendToAllDiscoveryTargets(announce)
                              }

                              if (currentHost == selfId && election.shouldStepDown(batteryPct, isCharging, thermalStatus, now)) {
                                  if (electionTriggerMs == 0L) {
                                      val reason = if (thermalStatus >= DeviceHealthMonitor.THERMAL_SEVERE) "حرارة مرتفعة" else "بطارية منخفضة"
                                      val sd = JSONObject().apply {
                                          put("t", "STEP_DOWN")
                                          put("id", selfId)
                                          put("epoch", election.currentEpoch)
                                          put("reason", reason)
                                      }
                                      sendToAllDiscoveryTargets(sd)
                                      stepDownOriginId = selfId
                                      electionTriggerMs = now
                                      statusText.value = "تنازلت عن القيادة ($reason)..."
                                  }
                              } else if (hostMissing && peersMap.isNotEmpty()) {
                                  if (electionTriggerMs == 0L) {
                                      stepDownOriginId = currentHost
                                      electionTriggerMs = now
                                  }
                              }

                              if (electionTriggerMs > 0L && now - electionTriggerMs > 2000L) {
                                  val selfPeer = PeerInfo(
                                      nodeId = selfId, name = userName, chainRank = chainRank,
                                      batteryPct = batteryPct, isCharging = isCharging,
                                      thermalStatus = thermalStatus, epoch = election.currentEpoch,
                                      currentHostId = election.currentHostId, ipAddress = "",
                                      lastSeenMs = now, handshakeOk = true
                                  )
                                  val winner = election.pickBestLeader(selfPeer, peersMap.values, excludeId = stepDownOriginId)
                                  if (winner != null && winner.nodeId == selfId) {
                                      val (newHost, newEpoch) = election.declareSelfAsHost()
                                      currentHostIdState.longValue = newHost
                                      currentEpochState.longValue = newEpoch
                                      val announce = JSONObject().apply {
                                          put("t", "I_AM_HOST")
                                          put("id", newHost)
                                          put("epoch", newEpoch)
                                      }
                                      sendToAllDiscoveryTargets(announce)
                                      leaderChangeEvent.value = "أصبحت أنت قائد السلسلة"
                                  }
                                  electionTriggerMs = 0L
                                  stepDownOriginId = -1L
                              }

                              delay(1000L)
                          }
                      }
                  }

                  private fun getAudioTargets(excludeIp: String? = null): List<InetAddress> {
                      val list = ArrayList<InetAddress>()
                      val activePeers = peersMap.values.filter { it.handshakeOk && it.ipAddress.isNotEmpty() }
                      if (activePeers.isNotEmpty()) {
                          for (p in activePeers) {
                              if (p.ipAddress == excludeIp) continue
                              if (!selectAllPeers && !allowedPeerIds.contains(p.nodeId) && p.chainRank != 1 && excludeIp == null) continue
                              runCatching { list.add(InetAddress.getByName(p.ipAddress)) }
                          }
                      } else {
                          list.addAll(cachedTargetIps)
                      }
                      return list
                  }

                  private fun startAudioEngine() {
                      try {
                          audioSocket = DatagramSocket(null).apply {
                              reuseAddress = true
                              broadcast = true
                              bind(InetSocketAddress(AUDIO_PORT))
                          }
                      } catch (e: Exception) {
                          debugLastError.value = "AudioSocket: ${e.message}"
                          return
                      }

                      scope.launch {
                          val minOut = AudioTrack.getMinBufferSize(
                              SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(1280)
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(SAMPLE_RATE)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(minOut * 2)
                              .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                              .setTransferMode(AudioTrack.MODE_STREAM)
                              .build()
                          track.play()

                          val buf = ByteArray(2048)
                          var lastClearJob: Job? = null

                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  val sock = audioSocket ?: break
                                  sock.receive(pkt)
                                  if (pkt.length <= HEADER_SIZE || pkt.data[0] != MAGIC_AUDIO) continue

                                  val bb = ByteBuffer.wrap(pkt.data, 0, pkt.length)
                                  bb.get()
                                  val senderId = bb.long
                                  if (senderId == selfId) continue
                                  val seq = bb.int
                                  val rank = bb.get().toInt()
                                  val ttl = bb.get().toInt()

                                  val dedupKey = (senderId * 31L) xor seq.toLong()
                                  if (seenAudio.put(dedupKey, true) != null) continue

                                  if (ttl > 0 && peersMap.size > 1) {
                                      val relayCopy = pkt.data.copyOf(pkt.length)
                                      relayCopy[14] = (ttl - 1).toByte()
                                      val fromIp = pkt.address.hostAddress
                                      for (target in getAudioTargets(excludeIp = fromIp)) {
                                          runCatching {
                                              sock.send(DatagramPacket(relayCopy, relayCopy.size, target, AUDIO_PORT))
                                          }
                                      }
                                  }

                                  val allowed = selectAllPeers || allowedPeerIds.contains(senderId) || rank == 1
                                  if (allowed) {
                                      val audioLen = pkt.length - HEADER_SIZE
                                      track.write(pkt.data, HEADER_SIZE, audioLen)
                                      val name = peersMap[senderId]?.name ?: "راكب #$rank"
                                      activeSpeakerName.value = if (rank == 1) "القائد ($name)" else "$name (راكب $rank)"
                                      lastClearJob?.cancel()
                                      lastClearJob = scope.launch {
                                          delay(600L)
                                          activeSpeakerName.value = null
                                      }
                                  }
                              } catch (e: Exception) {
                                  if (isActive) delay(50)
                              }
                          }
                          runCatching { track.stop(); track.release() }
                      }

                      scope.launch {
                          val minBuf = AudioRecord.getMinBufferSize(
                              SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(1280)
                          var recorder: AudioRecord? = null

                          while (isActive) {
                              val active = isPttPressed || isOpenMicOn
                              if (!active) {
                                  if (recorder != null) {
                                      runCatching { recorder?.stop(); recorder?.release() }
                                      recorder = null
                                  }
                                  delay(25L)
                                  continue
                              }
                              if (recorder == null) {
                                  runCatching {
                                      recorder = AudioRecord(
                                          MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                                          SAMPLE_RATE,
                                          AudioFormat.CHANNEL_IN_MONO,
                                          AudioFormat.ENCODING_PCM_16BIT,
                                          minBuf * 2
                                      ).also { rec ->
                                          if (NoiseSuppressor.isAvailable()) {
                                              runCatching { NoiseSuppressor.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          if (AcousticEchoCanceler.isAvailable()) {
                                              runCatching { AcousticEchoCanceler.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          rec.startRecording()
                                      }
                                  }.onFailure { debugLastError.value = "Mic: ${it.message}" }
                              }

                              val pcm = ByteArray(FRAME_BYTES)
                              val read = recorder?.read(pcm, 0, FRAME_BYTES) ?: -1
                              if (read > 0) {
                                  val seq = seqCounter.getAndIncrement()
                                  val pktBytes = ByteArray(HEADER_SIZE + read)
                                  val bb = ByteBuffer.wrap(pktBytes)
                                  bb.put(MAGIC_AUDIO)
                                  bb.putLong(selfId)
                                  bb.putInt(seq)
                                  bb.put(chainRank.toByte())
                                  bb.put(2.toByte())
                                  bb.put(pcm, 0, read)

                                  val sock = audioSocket
                                  if (sock != null) {
                                      for (target in getAudioTargets()) {
                                          runCatching {
                                              sock.send(DatagramPacket(pktBytes, pktBytes.size, target, AUDIO_PORT))
                                          }
                                      }
                                  }
                              }
                          }
                          runCatching { recorder?.stop(); recorder?.release() }
                      }
                  }
              }
          """)

          write("app/src/main/java/com/bikemic/app/MainActivity.kt", """

                                                          selectAll = false; engine.selectAllPeers = false
                                                          if (c) { selected.add(p.nodeId); engine.allowedPeerIds.add(p.nodeId) }
                                                          else { selected.remove(p.nodeId); engine.allowedPeerIds.remove(p.nodeId) }
                                                      })
                                                      Column(Modifier.weight(1f)) {
                                                          Text(
                                                              "راكب ${p.chainRank}: ${p.name}" + if (isHostP) " ⭐" else "",
                                                              color = if (isHostP) Color(0xFFFFD60A) else Color.White,
                                                              fontWeight = FontWeight.Bold, fontSize = 14.sp
                                                          )
                                                          Text(
                                                              "${if (p.handshakeOk) "متصل فعلياً" else "بانتظار التأكيد"} • بطارية ${p.batteryPct}% • ${thermalLabel(p.thermalStatus)}",
                                                              color = if (p.handshakeOk) Color(0xFF32D74B) else Color(0xFFFF9F0A),
                                                              fontSize = 11.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showUsers = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                                  ) { Text("تم", color = Color.White) }
                              }
                          )
                      }

                      if (showRankDlg) {
                          AlertDialog(
                              onDismissRequest = { showRankDlg = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("ترتيبك في السلسلة", color = Color.White) },
                              text = {
                                  LazyColumn(Modifier.height(280.dp)) {
                                      items((1..12).toList()) { num ->
                                          val label = if (num == 1) "1 = قائد السلسلة" else "$num (خلف ${num - 1}، أمام ${num + 1})"
                                          TextButton(
                                              onClick = {
                                                  rank = num; engine.updateUser(name, num); onSave(name, num)
                                                  showRankDlg = false
                                              },
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text(label, color = if (rank == num) Color(0xFFFF453A) else Color.White,
                                                   fontWeight = if (rank == num) FontWeight.Bold else FontWeight.Normal)
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  TextButton(onClick = { showRankDlg = false }) { Text("إغلاق", color = Color.Gray) }
                              }
                          )
                      }

                      if (showInfo) {
                          AlertDialog(
                              onDismissRequest = { showInfo = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("معلومات الشبكة", color = Color.White, fontWeight = FontWeight.Bold) },
                              text = {
                                  Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                                      Text("معرفك: ${engine.selfId}", color = Color.Gray, fontSize = 11.sp)
                                      Text("القائد الحالي: ${if (isHost) "أنت" else (peers.find { it.nodeId == hostId }?.name ?: "غير معروف")}", color = Color.White)
                                      Text("Epoch: $epoch", color = Color.Gray, fontSize = 12.sp)
                                      Text("الدراجون المتصلون فعلياً: ${peers.count { it.handshakeOk }}", color = Color.White)
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("حالتك:", color = Color.Gray, fontSize = 12.sp)
                                      Text("• بطارية: ${engine.batteryPct}%${if (engine.isCharging) " (تشحن)" else ""}", color = Color.White, fontSize = 13.sp)
                                      Text("• حرارة: ${thermalLabel(engine.thermalStatus)}", color = Color.White, fontSize = 13.sp)
                                      Spacer(Modifier.height(6.dp))
                                      Text(
                                          "قواعد التنازل التلقائي: البطارية < 30% بدون شحن، أو الحرارة SEVERE/CRITICAL لمدة 30 ثانية متواصلة.",
                                          color = Color(0xFFFF9F0A), fontSize = 11.sp
                                      )
                                      Spacer(Modifier.height(6.dp))
                                      Text(
                                          "ملاحظة: يجب أن تكون جميع الهواتف على نفس شبكة الواي فاي أو الهوتسبوت. لا حاجة لإنترنت أو راوتر.",
                                          color = Color.Gray, fontSize = 11.sp
                                      )
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showInfo = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF32D74B))
                                  ) { Text("فهمت", color = Color.Black) }
                              }
                          )
                      }
                  }
              }

              fun thermalLabel(t: Int): String = when (t) {
                  DeviceHealthMonitor.THERMAL_NONE -> "طبيعي"
                  DeviceHealthMonitor.THERMAL_LIGHT -> "خفيف"
                  DeviceHealthMonitor.THERMAL_MODERATE -> "متوسط"
                  DeviceHealthMonitor.THERMAL_SEVERE -> "مرتفع ⚠️"
                  else -> "حرج 🚨"
              }
          """)

          print("BikeMic P2P Mesh project generated successfully.")
          PYEOF
          python3 /tmp/gen_bikemic_p2p.py

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMic-P2P-Mesh-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

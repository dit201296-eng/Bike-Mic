                  private val ulawToLinearTable = ShortArray(256) { idx ->
                      val u = idx.inv() and 0xFF
                      val sign = u and 0x80
                      val exponent = (u shr 4) and 0x07
                      val mantissa = u and 0x0F
                      var sample = ((mantissa shl 3) + 0x84) shl exponent
                      sample -= 0x84
                      (if (sign != 0) -sample else sample).coerceIn(-32768, 32767).toShort()
                  }

                  private fun linearToUlaw(sampleIn: Int): Byte {
                      val BIAS = 0x84
                      val CLIP = 32635
                      var sample = sampleIn
                      val sign = if (sample < 0) {
                          sample = -sample
                          0x80
                      } else {
                          0x00
                      }
                      if (sample > CLIP) sample = CLIP
                      sample += BIAS
                      var exponent = 7
                      var expMask = 0x4000
                      while (exponent > 0 && (sample and expMask) == 0) {
                          exponent--
                          expMask = expMask shr 1
                      }
                      val mantissa = (sample shr (exponent + 3)) and 0x0F
                      val ulawByte = (sign or (exponent shl 4) or mantissa).inv()
                      return ulawByte.toByte()
                  }


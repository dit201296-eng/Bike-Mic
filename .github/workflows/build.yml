                  <path android:strokeColor="#FFFFFF" android:strokeWidth="1.8" android:pathData="M49.2,54a4.8,4.8 0,0 0,9.6 0M54,58.8v2.7"/>
                  <path android:strokeColor="#EF5350" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M39,73 Q54,62 69,73"/>
                  <path android:strokeColor="#FFCDD2" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M44.5,78.5 Q54,71 63.5,78.5"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M54,83.5m-2.3,0a2.3,2.3 0,1 1,4.6 0a2.3,2.3 0,1 1,-4.6 0"/>
              </vector>
          """)

          write("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              </adaptive-icon>
          """)

          write("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              </adaptive-icon>
          """)

          # =========================================================
          # 3. AndroidManifest (WiFi + Audio)
          # =========================================================
          write("app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
                  <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"
                      android:usesPermissionFlags="neverForLocation" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />

                  <application
                      android:allowBackup="true"
                      android:icon="@mipmap/ic_launcher"
                      android:label="@string/app_name"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.BikeMic">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:screenOrientation="portrait"
                          android:keepScreenOn="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          # =========================================================
          # 4. Models.kt
          # =========================================================
          write("app/src/main/java/com/bikemic/app/Models.kt", """
              package com.bikemic.app

              data class PeerInfo(
                  val nodeId: Long,
                  val name: String,
                  val chainRank: Int,
                  val batteryPct: Int,
                  val isCharging: Boolean,
                  val thermalStatus: Int,
                  val epoch: Long,
                  val currentHostId: Long,
                  val ipAddress: String,
                  val lastSeenMs: Long,
                  val handshakeOk: Boolean
              )
          """)

          # =========================================================
          # 5. DeviceHealthMonitor.kt
          # =========================================================
          write("app/src/main/java/com/bikemic/app/DeviceHealthMonitor.kt", """
              package com.bikemic.app

              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.os.BatteryManager
              import android.os.Build
              import android.os.PowerManager

              class DeviceHealthMonitor(
                  private val context: Context,
                  private val onUpdate: (batteryPct: Int, isCharging: Boolean, thermal: Int) -> Unit
              ) {
                  companion object {
                      const val THERMAL_NONE = 0
                      const val THERMAL_LIGHT = 1
                      const val THERMAL_MODERATE = 2
                      const val THERMAL_SEVERE = 3
                      const val THERMAL_CRITICAL = 4
                  }

                  @Volatile var batteryPct: Int = 100
                      private set
                  @Volatile var isCharging: Boolean = false
                      private set
                  @Volatile var thermalStatus: Int = THERMAL_NONE
                      private set

                  private var batteryReceiver: BroadcastReceiver? = null
                  private var thermalListener: PowerManager.OnThermalStatusChangedListener? = null
                  private var powerManager: PowerManager? = null

                  fun start() {
                      batteryReceiver = object : BroadcastReceiver() {
                          override fun onReceive(ctx: Context?, intent: Intent?) {
                              intent ?: return
                              val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                              val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                              if (level < 0 || scale <= 0) return
                              batteryPct = (level * 100f / scale).toInt()
                              val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                              isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                           status == BatteryManager.BATTERY_STATUS_FULL
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                      }
                      context.registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                          thermalListener = PowerManager.OnThermalStatusChangedListener { sys ->
                              thermalStatus = mapSysThermal(sys)
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                          powerManager?.addThermalStatusListener(context.mainExecutor, thermalListener!!)
                      }
                  }

                  private fun mapSysThermal(sys: Int): Int = when (sys) {
                      PowerManager.THERMAL_STATUS_NONE -> THERMAL_NONE
                      PowerManager.THERMAL_STATUS_LIGHT -> THERMAL_LIGHT
                      PowerManager.THERMAL_STATUS_MODERATE -> THERMAL_MODERATE
                      PowerManager.THERMAL_STATUS_SEVERE -> THERMAL_SEVERE
                      else -> THERMAL_CRITICAL
                  }

                  fun stop() {
                      runCatching { batteryReceiver?.let { context.unregisterReceiver(it) } }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          runCatching {
                              thermalListener?.let { powerManager?.removeThermalStatusListener(it) }
                          }
                      }
                  }
              }
          """)

          # =========================================================
          # 6. LeaderElection.kt
          # =========================================================
          write("app/src/main/java/com/bikemic/app/LeaderElection.kt", """
              package com.bikemic.app

              class LeaderElection(
                  private val selfId: Long,
                  private val minBattery: Int = 30,
                  private val thermalHoldMs: Long = 30_000L
              ) {
                  @Volatile var currentHostId: Long = selfId
                      private set
                  @Volatile var currentEpoch: Long = 0L
                      private set

                  private var thermalHighSinceMs: Long = 0L
                  private var lowBatSinceMs: Long = 0L

                  fun healthScore(p: PeerInfo): Double {
                      var s = p.batteryPct.toDouble()
                      when (p.thermalStatus) {
                          DeviceHealthMonitor.THERMAL_CRITICAL -> return -1000.0
                          DeviceHealthMonitor.THERMAL_SEVERE -> s -= 60.0
                          DeviceHealthMonitor.THERMAL_MODERATE -> s -= 30.0
                          DeviceHealthMonitor.THERMAL_LIGHT -> s -= 8.0
                      }
                      if (p.isCharging) s += 20.0
                      return s
                  }

                  fun shouldStepDown(bat: Int, chg: Boolean, thermal: Int, nowMs: Long): Boolean {
                      if (currentHostId != selfId) return false
                      if (thermal >= DeviceHealthMonitor.THERMAL_SEVERE) {
                          if (thermalHighSinceMs == 0L) thermalHighSinceMs = nowMs
                          if (nowMs - thermalHighSinceMs >= thermalHoldMs) return true
                      } else {
                          thermalHighSinceMs = 0L
                      }
                      if (bat < minBattery && !chg) {
                          if (lowBatSinceMs == 0L) lowBatSinceMs = nowMs
                          if (nowMs - lowBatSinceMs >= thermalHoldMs) return true
                      } else {
                          lowBatSinceMs = 0L
                      }
                      return false
                  }

                  fun selectNewHost(peers: Collection<PeerInfo>): PeerInfo? {
                      if (peers.isEmpty()) return null
                      return peers
                          .asSequence()
                          .filter { it.nodeId != selfId }
                          .filter { it.thermalStatus < DeviceHealthMonitor.THERMAL_CRITICAL }
                          .sortedWith(
                              compareByDescending<PeerInfo> { healthScore(it) }
                                  .thenByDescending { it.epoch }
                                  .thenBy { it.nodeId }
                          )
                          .firstOrNull()
                  }

                  fun acceptHostAnnouncement(hostId: Long, epoch: Long): Boolean {
                      if (epoch > currentEpoch ||
                          (epoch == currentEpoch && hostId < currentHostId)) {
                          currentHostId = hostId
                          currentEpoch = epoch
                          return true
                      }
                      return false
                  }

                  fun declareSelfAsHost(): Pair<Long, Long> {
                      currentHostId = selfId
                      currentEpoch += 1
                      return selfId to currentEpoch
                  }
              }
          """)

          # =========================================================
          # 7. MeshVoiceEngine.kt
          # =========================================================
          write("app/src/main/java/com/bikemic/app/MeshVoiceEngine.kt", """
              package com.bikemic.app

              import android.content.Context
              import android.media.AudioAttributes
              import android.media.AudioFormat
              import android.media.AudioManager
              import android.media.AudioRecord
              import android.media.AudioTrack
              import android.media.MediaRecorder
              import android.media.audiofx.AcousticEchoCanceler
              import android.media.audiofx.NoiseSuppressor
              import android.net.wifi.WifiManager
              import androidx.compose.runtime.mutableIntStateOf
              import androidx.compose.runtime.mutableLongStateOf
              import androidx.compose.runtime.mutableStateOf
              import kotlinx.coroutines.*
              import org.json.JSONObject
              import java.net.DatagramPacket
              import java.net.DatagramSocket
              import java.net.InetAddress
              import java.net.InetSocketAddress
              import java.net.NetworkInterface
              import java.nio.ByteBuffer
              import java.util.Collections
              import java.util.concurrent.ConcurrentHashMap
              import java.util.concurrent.atomic.AtomicInteger
              import kotlin.random.Random

              class MeshVoiceEngine(private val context: Context) {

                  companion object {
                      private const val DISCOVERY_PORT = 50004
                      private const val AUDIO_PORT = 50005
                      private const val SAMPLE_RATE = 16000
                      private const val FRAME_BYTES = 640
                      private const val MAGIC_AUDIO: Byte = 0x42
                  }

                  val selfId: Long = Random.nextLong(1, Long.MAX_VALUE)
                  @Volatile var userName: String = "أبو ناصر"
                  @Volatile var chainRank: Int = 1
                  @Volatile var isPttPressed: Boolean = false
                  @Volatile var isOpenMicOn: Boolean = false
                  @Volatile var selectAllPeers: Boolean = true
                  val allowedPeerIds: MutableSet<Long> = Collections.newSetFromMap(ConcurrentHashMap())

                  @Volatile var batteryPct: Int = 100
                  @Volatile var isCharging: Boolean = false
                  @Volatile var thermalStatus: Int = 0

                  val peersVersion = mutableIntStateOf(0)
                  val connectedCount = mutableIntStateOf(0)
                  val currentHostIdState = mutableLongStateOf(selfId)
                  val currentEpochState = mutableLongStateOf(0L)
                  val statusText = mutableStateOf("جارٍ البحث عن دراجين آخرين...")
                  val activeSpeakerName = mutableStateOf<String?>(null)
                  val leaderChangeEvent = mutableStateOf<String?>(null)

                  val peersMap = ConcurrentHashMap<Long, PeerInfo>()
                  private val handshakedPeers = Collections.newSetFromMap(ConcurrentHashMap<Long, Boolean>())
                  private val seenAudio = Collections.synchronizedMap(
                      object : LinkedHashMap<Long, Boolean>(512, 0.75f, true) {
                          override fun removeEldestEntry(eldest: MutableMap.MutableEntry<Long, Boolean>?) = size > 600
                      }
                  )

                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val seqCounter = AtomicInteger(1)

                  private val election = LeaderElection(selfId)
                  private var multicastLock: WifiManager.MulticastLock? = null
                  private var discoverySocket: DatagramSocket? = null
                  private var audioSocket: DatagramSocket? = null

                  fun start() {
                      val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      multicastLock = wifi.createMulticastLock("BikeMicP2P").apply {
                          setReferenceCounted(true)
                          acquire()
                      }
                      val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.mode = AudioManager.MODE_IN_COMMUNICATION
                      am.isSpeakerphoneOn = true

                      startDiscovery()
                      startAudioReceiver()
                      startAudioTransmitter()
                      startHeartbeat()
                      startElectionLoop()
                  }

                  fun stop() {
                      scope.cancel()
                      runCatching { discoverySocket?.close() }
                      runCatching { audioSocket?.close() }
                      runCatching { if (multicastLock?.isHeld == true) multicastLock?.release() }
                  }

                  fun updateUser(newName: String, newRank: Int) {
                      userName = newName
                      chainRank = newRank
                      peersVersion.intValue += 1
                  }

                  fun updateHealth(bat: Int, chg: Boolean, thermal: Int) {
                      batteryPct = bat
                      isCharging = chg
                      thermalStatus = thermal
                      peersVersion.intValue += 1
                  }

                  private fun getBroadcastAddresses(): List<InetAddress> {
                      val list = mutableListOf<InetAddress>()
                      runCatching {
                          val ifaces = NetworkInterface.getNetworkInterfaces()
                          while (ifaces.hasMoreElements()) {
                              val nif = ifaces.nextElement()
                              if (!nif.isUp || nif.isLoopback) continue
                              val n = nif.name.lowercase()
                              if (!n.startsWith("wlan") && !n.startsWith("ap") && !n.startsWith("eth")) continue
                              for (ia in nif.interfaceAddresses) ia.broadcast?.let { list.add(it) }
                          }
                      }
                      if (list.isEmpty()) runCatching { list.add(InetAddress.getByName("255.255.255.255")) }
                      return list.distinct()
                  }

                  private fun broadcastJson(obj: JSONObject) {
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      val sock = discoverySocket ?: return
                      for (b in getBroadcastAddresses()) {
                          runCatching {
                              sock.send(DatagramPacket(data, data.size, b, DISCOVERY_PORT))
                          }
                      }
                  }

                  private fun startDiscovery() {
                      scope.launch {
                          runCatching {
                              discoverySocket = DatagramSocket(null).apply {
                                  reuseAddress = true
                                  broadcast = true
                                  bind(InetSocketAddress(DISCOVERY_PORT))
                              }
                              val buf = ByteArray(1024)
                              while (isActive) {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  discoverySocket?.receive(pkt) ?: break
                                  handleDiscoveryPacket(pkt)
                              }
                          }
                      }
                  }

                  private fun handleDiscoveryPacket(pkt: DatagramPacket) {
                      runCatching {
                          val text = String(pkt.data, 0, pkt.length, Charsets.UTF_8)
                          val msg = JSONObject(text)
                          val senderId = msg.optLong("id", -1)
                          if (senderId <= 0 || senderId == selfId) return

                          when (msg.optString("t")) {
                              "HB" -> {
                                  val peer = PeerInfo(
                                      nodeId = senderId,
                                      name = msg.optString("name", "راكب"),
                                      chainRank = msg.optInt("rank", 2),
                                      batteryPct = msg.optInt("bat", 50),
                                      isCharging = msg.optBoolean("chg", false),
                                      thermalStatus = msg.optInt("thm", 0),
                                      epoch = msg.optLong("epoch", 0),
                                      currentHostId = msg.optLong("host", senderId),
                                      ipAddress = pkt.address.hostAddress ?: "",
                                      lastSeenMs = System.currentTimeMillis(),
                                      handshakeOk = handshakedPeers.contains(senderId)
                                  )
                                  peersMap[senderId] = peer

                                  if (!handshakedPeers.contains(senderId)) {
                                      val req = JSONObject().apply {
                                          put("t", "CONNECT_REQ")
                                          put("id", selfId)
                                          put("name", userName)
                                      }
                                      broadcastJson(req)
                                  }
                                  if (selectAllPeers) allowedPeerIds.add(senderId)
                                  peersVersion.intValue += 1
                              }
                              "CONNECT_REQ" -> {
                                  handshakedPeers.add(senderId)
                                  val ack = JSONObject().apply {
                                      put("t", "CONNECT_ACK")
                                      put("id", selfId)
                                  }
                                  broadcastJson(ack)
                              }
                              "CONNECT_ACK" -> {
                                  handshakedPeers.add(senderId)
                                  peersVersion.intValue += 1
                              }
                              "STEP_DOWN" -> {
                                  val epoch = msg.optLong("epoch", 0)
                                  if (epoch >= election.currentEpoch) {
                                      statusText.value = "القائد السابق يتنازل... جارٍ انتخاب قائد جديد"
                                  }
                              }
                              "I_AM_HOST" -> {
                                  val newHost = msg.optLong("id", -1)
                                  val epoch = msg.optLong("epoch", 0)
                                  if (newHost > 0 && election.acceptHostAnnouncement(newHost, epoch)) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                      val hostName = peersMap[newHost]?.name ?: "راكب"
                                      leaderChangeEvent.value = "القائد الجديد: $hostName"
                                      statusText.value = "متصل • القائد: $hostName"
                                  }
                              }
                          }
                      }
                  }

                  private fun startHeartbeat() {
                      scope.launch {
                          while (isActive) {
                              runCatching {
                                  val hb = JSONObject().apply {
                                      put("t", "HB")
                                      put("id", selfId)
                                      put("name", userName)
                                      put("rank", chainRank)
                                      put("bat", batteryPct)
                                      put("chg", isCharging)
                                      put("thm", thermalStatus)
                                      put("epoch", election.currentEpoch)
                                      put("host", election.currentHostId)
                                      put("ts", System.currentTimeMillis())
                                  }
                                  broadcastJson(hb)

                                  val now = System.currentTimeMillis()
                                  val dead = peersMap.filterValues { now - it.lastSeenMs > 8000 }.keys
                                  if (dead.isNotEmpty()) {
                                      dead.forEach { peersMap.remove(it); handshakedPeers.remove(it) }
                                      peersVersion.intValue += 1
                                  }

                                  val live = peersMap.values.count { it.handshakeOk }
                                  connectedCount.intValue = live

                                  if (live > 0) {
                                      statusText.value = "متصل • $live دراج متصل"
                                  } else {
                                      statusText.value = "لا يوجد دراجون متصلون بعد (شارك الواي فاي/الهوتسبوت)"
                                  }
                              }
                              delay(2000)
                          }
                      }
                  }

                  private fun startElectionLoop() {
                      scope.launch {
                          var stepDownSentMs = 0L
                          while (isActive) {
                              val now = System.currentTimeMillis()
                              val isHost = election.currentHostId == selfId

                              if (isHost && election.shouldStepDown(batteryPct, isCharging, thermalStatus, now)) {
                                  if (stepDownSentMs == 0L) {
                                      val reason = if (thermalStatus >= DeviceHealthMonitor.THERMAL_SEVERE) "THERMAL" else "BATTERY_LOW"
                                      val sd = JSONObject().apply {
                                          put("t", "STEP_DOWN")
                                          put("id", selfId)
                                          put("epoch", election.currentEpoch)
                                          put("reason", reason)
                                      }
                                      broadcastJson(sd)
                                      stepDownSentMs = now
                                      statusText.value = "تنازلت عن القيادة ($reason). بانتظار قائد جديد..."
                                  }
                              }

                              if (stepDownSentMs > 0 && now - stepDownSentMs > 3000) {
                                  val candidate = election.selectNewHost(peersMap.values)
                                  if (candidate != null && candidate.nodeId == selfId) {
                                      val (newHost, newEpoch) = election.declareSelfAsHost()
                                      currentHostIdState.longValue = newHost
                                      currentEpochState.longValue = newEpoch
                                      val announce = JSONObject().apply {
                                          put("t", "I_AM_HOST")
                                          put("id", newHost)
                                          put("epoch", newEpoch)
                                          put("bat", batteryPct)
                                          put("chg", isCharging)
                                          put("thm", thermalStatus)
                                      }
                                      broadcastJson(announce)
                                      stepDownSentMs = 0L
                                  }
                              }

                              delay(1000)
                          }
                      }
                  }

                  private fun startAudioTransmitter() {
                      scope.launch {
                          val minBuf = AudioRecord.getMinBufferSize(
                              SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(1280)
                          var recorder: AudioRecord? = null
                          val sendSock = DatagramSocket().apply { broadcast = true }

                          while (isActive) {
                              val active = isPttPressed || isOpenMicOn
                              if (!active) {
                                  if (recorder != null) {
                                      runCatching { recorder?.stop(); recorder?.release() }
                                      recorder = null
                                  }
                                  delay(25)
                                  continue
                              }
                              if (recorder == null) {
                                  runCatching {
                                      recorder = AudioRecord(
                                          MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                                          SAMPLE_RATE,
                                          AudioFormat.CHANNEL_IN_MONO,
                                          AudioFormat.ENCODING_PCM_16BIT,
                                          minBuf * 2
                                      ).also { rec ->
                                          if (NoiseSuppressor.isAvailable()) {
                                              runCatching { NoiseSuppressor.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          if (AcousticEchoCanceler.isAvailable()) {
                                              runCatching { AcousticEchoCanceler.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          rec.startRecording()
                                      }
                                  }
                              }
                              val pcm = ByteArray(FRAME_BYTES)
                              val read = recorder?.read(pcm, 0, FRAME_BYTES) ?: -1
                              if (read > 0) {
                                  val seq = seqCounter.getAndIncrement()
                                  val pktBytes = ByteArray(14 + read)
                                  val bb = ByteBuffer.wrap(pktBytes)
                                  bb.put(MAGIC_AUDIO)
                                  bb.putLong(selfId)
                                  bb.putInt(seq)
                                  bb.put(chainRank.toByte())
                                  bb.put(pcm, 0, read)

                                  for (b in getBroadcastAddresses()) {
                                      runCatching {
                                          sendSock.send(DatagramPacket(pktBytes, pktBytes.size, b, AUDIO_PORT))
                                      }
                                  }
                              }
                          }
                          runCatching { recorder?.stop(); recorder?.release(); sendSock.close() }
                      }
                  }

                  private fun startAudioReceiver() {
                      scope.launch {
                          val minOut = AudioTrack.getMinBufferSize(
                              SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(1280)
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(SAMPLE_RATE)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(minOut * 2)
                              .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                              .setTransferMode(AudioTrack.MODE_STREAM)
                              .build()
                          track.play()

                          audioSocket = DatagramSocket(null).apply {
                              reuseAddress = true
                              broadcast = true
                              bind(InetSocketAddress(AUDIO_PORT))
                          }
                          val buf = ByteArray(2048)
                          var lastClearJob: Job? = null

                          while (isActive) {
                              runCatching {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  audioSocket?.receive(pkt) ?: return@launch
                                  if (pkt.length <= 14 || pkt.data[0] != MAGIC_AUDIO) return@runCatching
                                  val bb = ByteBuffer.wrap(pkt.data, 0, pkt.length)
                                  bb.get()
                                  val senderId = bb.long
                                  if (senderId == selfId) return@runCatching
                                  val seq = bb.int
                                  val rank = bb.get().toInt()

                                  val key = (senderId * 31L) xor seq.toLong()
                                  if (seenAudio.containsKey(key)) return@runCatching
                                  seenAudio[key] = true

                                  val allowed = selectAllPeers || allowedPeerIds.contains(senderId) || rank == 1
                                  if (allowed) {
                                      val len = pkt.length - 14
                                      track.write(pkt.data, 14, len)
                                      val name = peersMap[senderId]?.name ?: "راكب #$rank"
                                      activeSpeakerName.value = if (rank == 1) "القائد ($name)" else "$name (راكب $rank)"
                                      lastClearJob?.cancel()
                                      lastClearJob = scope.launch {
                                          delay(600)
                                          activeSpeakerName.value = null
                                      }
                                  }
                              }
                          }
                          runCatching { track.stop(); track.release() }
                      }
                  }
              }
          """)


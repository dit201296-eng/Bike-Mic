              package com.bikemic.app

              import android.app.*
              import android.content.Context
              import android.content.Intent
              import android.os.Build
              import android.os.IBinder
              import androidx.core.app.NotificationCompat

              class BikeMicService : Service() {
                  override fun onBind(intent: Intent?): IBinder? = null

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                      val channelId = "bikemic_channel"
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val channel = NotificationChannel(channelId, "BikeMic", NotificationManager.IMPORTANCE_LOW)
                          getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                      }

                      val pendingIntent = PendingIntent.getActivity(
                          this, 0, Intent(this, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val notification = NotificationCompat.Builder(this, channelId)
                          .setContentTitle("BikeMic يعمل في الخلفية")
                          .setContentText("اضغط هنا لفتح شاشة البرقية السريعة")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build()

                      startForeground(1, notification)
                      return START_STICKY
                  }
              }
          """)


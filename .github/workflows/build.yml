                                      width = 2.dp,
                                      color = if (isOpenMicOn) Color(0xFFFF8A80) else Color(0xFF8B0000),
                                      shape = CircleShape
                                  )
                                  .clickable {
                                      isOpenMicOn = !isOpenMicOn
                                      engine.isOpenMicOn = isOpenMicOn
                                      engine.updateMicState()
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  imageVector = if (isOpenMicOn) Icons.Default.Mic else Icons.Default.MicOff,
                                  contentDescription = "مايكروفون الاتصال المباشر",
                                  tint = Color.White,
                                  modifier = Modifier.size(42.dp)
                              )
                          }

                          Spacer(modifier = Modifier.height(10.dp))
                          Text(
                              text = if (isOpenMicOn) "اتصال صوتي مباشر مفتوح للمجموعة" else "المايك مطفأ (اضغط للتشغيل المباشر)",
                              color = if (isOpenMicOn) Color(0xFFFF453A) else Color(0xFF636366),
                              fontSize = 13.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                      }

                      // نافذة المستخدمين على LiveKit من أي مكان في العالم
                      if (showUsersDialog) {
                          AlertDialog(
                              onDismissRequest = { showUsersDialog = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = {
                                  Text("دراجو الغرفة المتصلون (${peersList.size})", color = Color.White, fontWeight = FontWeight.Bold)
                              },
                              text = {
                                  Column {
                                      Row(
                                          verticalAlignment = Alignment.CenterVertically,
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clickable {
                                                  selectAll = !selectAll
                                                  engine.selectAllPeers = selectAll
                                                  if (selectAll) {
                                                      selectedIds.clear()
                                                      peersList.forEach {
                                                          selectedIds.add(it.identity)
                                                          engine.allowedPeerIds.add(it.identity)
                                                      }
                                                  }
                                                  engine.applySelectiveAudioRouting()
                                              }
                                              .padding(vertical = 6.dp)
                                      ) {
                                          Checkbox(
                                              checked = selectAll,
                                              onCheckedChange = { checked ->
                                                  selectAll = checked
                                                  engine.selectAllPeers = checked
                                                  if (checked) {
                                                      selectedIds.clear()
                                                      peersList.forEach {
                                                          selectedIds.add(it.identity)
                                                          engine.allowedPeerIds.add(it.identity)
                                                      }
                                                  }
                                                  engine.applySelectiveAudioRouting()
                                              }
                                          )
                                          Text("تحديد الكل وضمهم في نطاق البرقيات والمكالمات", color = Color.White, fontSize = 13.sp)
                                      }

                                      HorizontalDivider(color = Color.DarkGray)
                                      Spacer(modifier = Modifier.height(8.dp))

                                      if (peersList.isEmpty()) {
                                          Text(
                                              text = if (connected)
                                                  "متصل بـ LiveKit بنجاح! بمجرد دخول أي دراج آخر بنفس اسم الغرفة ($lkRoom) سيظهر هنا فوراً من أي مكان."
                                              else
                                                  "غير متصل بالسيرفر بعد. اضغط على أيقونة السحابة لإدخال مفاتيح LiveKit.",
                                              color = Color.Gray,
                                              fontSize = 13.sp
                                          )
                                      } else {
                                          LazyColumn(modifier = Modifier.heightIn(max = 240.dp)) {
                                              items(peersList) { peer ->
                                                  val isChecked = selectAll || selectedIds.contains(peer.identity)
                                                  Row(
                                                      verticalAlignment = Alignment.CenterVertically,
                                                      modifier = Modifier
                                                          .fillMaxWidth()
                                                          .padding(vertical = 4.dp)
                                                  ) {
                                                      Checkbox(
                                                          checked = isChecked,
                                                          onCheckedChange = { chk ->
                                                              selectAll = false
                                                              engine.selectAllPeers = false
                                                              if (chk) {
                                                                  selectedIds.add(peer.identity)
                                                                  engine.allowedPeerIds.add(peer.identity)
                                                              } else {
                                                                  selectedIds.remove(peer.identity)
                                                                  engine.allowedPeerIds.remove(peer.identity)
                                                              }
                                                              engine.applySelectiveAudioRouting()
                                                          }
                                                      )
                                                      Column {
                                                          Text(
                                                              text = "راكب ${peer.chainRank}: ${peer.name}",
                                                              color = if (peer.chainRank == 1) Color(0xFFFFD60A) else Color.White,
                                                              fontWeight = FontWeight.Bold,
                                                              fontSize = 14.sp
                                                          )
                                                          Text(
                                                              text = "متصل عبر LiveKit • PING: ${peer.rttMs}ms",
                                                              color = Color(0xFF32D74B),
                                                              fontSize = 11.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showUsersDialog = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                                  ) {
                                      Text("تم", color = Color.White)
                                  }
                              }
                          )
                      }

                      // نافذة اختيار رقم الراكب في السلسلة
                      if (showRankDialog) {
                          AlertDialog(
                              onDismissRequest = { showRankDialog = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("ترتيبك في السلسلة", color = Color.White) },
                              text = {
                                  LazyColumn(modifier = Modifier.height(260.dp)) {
                                      items((1..12).toList()) { num ->
                                          val label = when (num) {
                                              1 -> "الراكب 1 = قائد السلسلة (أعلى أولوية)"
                                              else -> "الراكب $num (وراء ${num - 1}، وأمامي ${num + 1})"
                                          }
                                          TextButton(
                                              onClick = {
                                                  chainRank = num
                                                  engine.updateIdentityMetadata(userName, num)
                                                  onSaveRider(userName, num)
                                                  showRankDialog = false
                                              },
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text(
                                                  text = label,
                                                  color = if (chainRank == num) Color(0xFFFF453A) else Color.White,
                                                  fontWeight = if (chainRank == num) FontWeight.Bold else FontWeight.Normal
                                              )
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  TextButton(onClick = { showRankDialog = false }) {
                                      Text("إغلاق", color = Color.Gray)
                                  }
                              }
                          )
                      }

                      // نافذة إعداد LiveKit السريعة (تُقرأ تلقائياً من Secrets إن وُجدت، أو تُحفظ محلياً لمرة واحدة)
                      if (showServerDialog) {
                          AlertDialog(
                              onDismissRequest = { showServerDialog = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("إعداد اتصال LiveKit السحابي", color = Color.White, fontWeight = FontWeight.Bold) },
                              text = {
                                  Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                      OutlinedTextField(
                                          value = lkUrl,
                                          onValueChange = { lkUrl = it },
                                          label = { Text("LiveKit WSS URL (wss://...)") },
                                          singleLine = true,
                                          textStyle = TextStyle(color = Color.White, fontSize = 13.sp)
                                      )
                                      OutlinedTextField(
                                          value = lkKey,
                                          onValueChange = { lkKey = it },
                                          label = { Text("API Key") },
                                          singleLine = true,
                                          textStyle = TextStyle(color = Color.White, fontSize = 13.sp)
                                      )
                                      OutlinedTextField(
                                          value = lkSecret,
                                          onValueChange = { lkSecret = it },
                                          label = { Text("API Secret") },
                                          singleLine = true,
                                          textStyle = TextStyle(color = Color.White, fontSize = 13.sp)
                                      )
                                      OutlinedTextField(
                                          value = lkRoom,
                                          onValueChange = { lkRoom = it },
                                          label = { Text("اسم غرفة السلسلة (المشترك)") },
                                          singleLine = true,
                                          textStyle = TextStyle(color = Color.White, fontSize = 13.sp)
                                      )
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = {
                                          showServerDialog = false
                                          onSaveServerAndReconnect(lkUrl, lkKey, lkSecret, lkRoom)
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF32D74B))
                                  ) {
                                      Text("حفظ واتصال فوري", color = Color.Black, fontWeight = FontWeight.Bold)
                                  }
                              },
                              dismissButton = {
                                  TextButton(onClick = { showServerDialog = false }) {
                                      Text("إلغاء", color = Color.Gray)
                                  }
                              }
                          )
                      }
                  }
              }
          """)

          print("3-File LiveKit architecture generated cleanly!")
          PYEOF
          python3 /tmp/gen_bikemic_livekit.py

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK Output
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload BikeMic Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMic-LiveKit-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

              import androidx.compose.ui.platform.LocalLayoutDirection
              import androidx.compose.ui.text.TextStyle
              import androidx.compose.ui.text.font.FontWeight
              import androidx.compose.ui.text.style.TextAlign
              import androidx.compose.ui.unit.LayoutDirection
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.unit.sp
              import androidx.core.content.ContextCompat
              import kotlinx.coroutines.delay

              class MainActivity : ComponentActivity() {
                  private var engine: MeshVoiceEngine? = null
                  private var health: DeviceHealthMonitor? = null
                  private val permissionsGranted = mutableStateOf(false)
                  private val volumeKeyPttActive = mutableStateOf(false)

                  private fun enableLockScreenVisibility() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          setShowWhenLocked(true)
                          setTurnScreenOn(true)
                      }
                      @Suppress("DEPRECATION")
                      window.addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_ALLOW_LOCK_WHILE_SCREEN_ON
                      )
                  }

                  private fun requiredPermissions(): Array<String> {
                      val p = mutableListOf(
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.ACCESS_WIFI_STATE,
                          Manifest.permission.CHANGE_WIFI_STATE,
                          Manifest.permission.CHANGE_WIFI_MULTICAST_STATE,
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION
                      )
                      if (Build.VERSION.SDK_INT >= 33) {
                          p.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                          p.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      return p.toTypedArray()
                  }

                  private val permLauncher = registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { result ->
                      val audio = result[Manifest.permission.RECORD_AUDIO] == true ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                      if (!audio) {
                          Toast.makeText(this, "صلاحية المايك إلزامية. سيتم الإغلاق.", Toast.LENGTH_LONG).show()
                          finishAffinity()
                      } else {
                          permissionsGranted.value = true
                          startAll()
                      }
                  }

                  override fun onCreate(savedInstanceState: Bundle?) {
                      enableLockScreenVisibility()
                      super.onCreate(savedInstanceState)
                      val prefs = getSharedPreferences("bikemic_p2p", Context.MODE_PRIVATE)
                      val defaultName = Build.MODEL?.take(12)?.ifBlank { "دراج" } ?: "دراج"

                      val missing = requiredPermissions().any {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }
                      if (!missing) {
                          permissionsGranted.value = true
                          startAll()
                      } else {
                          permLauncher.launch(requiredPermissions())
                      }

                      setContent {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              MaterialTheme(colorScheme = darkColorScheme(background = Color.Black, surface = Color(0xFF121212))) {
                                  Surface(modifier = Modifier.fillMaxSize(), color = Color.Black) {
                                      if (permissionsGranted.value && engine != null) {
                                          val ctx = LocalContext.current
                                          val volPtt by volumeKeyPttActive
                                          LaunchedEffect(Unit) {
                                              while (true) {
                                                  engine?.leaderChangeEvent?.value?.let { msg ->
                                                      Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show()
                                                      engine?.leaderChangeEvent?.value = null
                                                  }
                                                  delay(500L)
                                              }
                                          }
                                          BikeMicScreen(
                                              engine = engine!!,
                                              externalPttActive = volPtt,
                                              initialName = prefs.getString("name", defaultName) ?: defaultName,
                                              initialRank = prefs.getInt("rank", 1),
                                              onSave = { n, r ->
                                                  prefs.edit().putString("name", n).putInt("rank", r).apply()
                                              }
                                          )
                                      } else {
                                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                                  CircularProgressIndicator(color = Color.Red)
                                                  Spacer(Modifier.height(16.dp))
                                                  Text("الرجاء منح الصلاحيات للربط التلقائي...", color = Color.White)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  override fun onResume() {
                      super.onResume()
                      enableLockScreenVisibility()
                  }

                  override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                      if (keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                          if (!volumeKeyPttActive.value) {
                              volumeKeyPttActive.value = true
                              engine?.setPttPressed(true)
                          }
                          return true
                      }
                      return super.onKeyDown(keyCode, event)
                  }

                  override fun onKeyUp(keyCode: Int, event: KeyEvent?): Boolean {
                      if (keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
                          if (volumeKeyPttActive.value) {
                              volumeKeyPttActive.value = false
                              engine?.setPttPressed(false)
                          }
                          return true
                      }
                      return super.onKeyUp(keyCode, event)
                  }

                  private fun startAll() {
                      if (engine == null) {
                          val prefs = getSharedPreferences("bikemic_p2p", Context.MODE_PRIVATE)
                          val defaultName = Build.MODEL?.take(12)?.ifBlank { "دراج" } ?: "دراج"
                          val e = MeshVoiceEngine(this).apply {
                              userName = prefs.getString("name", defaultName) ?: defaultName
                              chainRank = prefs.getInt("rank", 1)
                          }
                          engine = e
                          health = DeviceHealthMonitor(this) { bat, chg, thm ->
                              e.updateHealth(bat, chg, thm)
                          }.also { it.start() }
                          e.start()
                      }
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      if (isFinishing) {
                          engine?.stop()
                          health?.stop()
                      }
                  }
              }

              @Composable
              fun BikeMicScreen(
                  engine: MeshVoiceEngine,
                  externalPttActive: Boolean,
                  initialName: String,
                  initialRank: Int,
                  onSave: (String, Int) -> Unit
              ) {
                  var name by remember { mutableStateOf(initialName) }
                  var rank by remember { mutableIntStateOf(initialRank) }
                  var editing by remember { mutableStateOf(false) }
                  var touchPtt by remember { mutableStateOf(false) }
                  val ptt = touchPtt || externalPttActive
                  var micOn by remember { mutableStateOf(false) }
                  var showUsers by remember { mutableStateOf(false) }
                  var showRankDlg by remember { mutableStateOf(false) }
                  var showInfo by remember { mutableStateOf(false) }
                  var selectAll by remember { mutableStateOf(true) }
                  val selected = remember { mutableStateListOf<Long>() }

                  val peers = engine.peersListState
                  val ver by engine.peersVersion
                  val connected by engine.connectedCount
                  val status by engine.statusText
                  val autoBanner by engine.autoNetBanner
                  val speaker by engine.activeSpeakerName
                  val ackSummary by engine.lastAckSummary
                  val ackedNames = engine.ackedPeerNames
                  val hostId by engine.currentHostIdState
                  val epoch by engine.currentEpochState
                  val sent by engine.debugSentCount
                  val received by engine.debugReceivedCount
                  val lastErr by engine.debugLastError

                  val isHost = hostId == engine.selfId
                  val pttColor by animateColorAsState(
                      if (ptt) Color(0xFFFFD60A) else Color(0xFF242426), label = "p"
                  )
                  val micColor by animateColorAsState(
                      if (micOn) Color(0xFFFF3B30) else Color(0xFF4A0E0E), label = "m"
                  )

                  Box(
                      Modifier.fillMaxSize().background(Color.Black)
                          .padding(horizontal = 16.dp, vertical = 12.dp)
                  ) {
                      // Top Bar
                      Row(
                          Modifier.fillMaxWidth().align(Alignment.TopCenter),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Button(
                              onClick = { showUsers = true },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1C1C1E)),
                              shape = RoundedCornerShape(12.dp),
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp)
                          ) {
                              Icon(
                                  Icons.Default.Groups, null,
                                  tint = if (connected > 0) Color(0xFF32D74B) else Color(0xFFFF453A)
                              )
                              Spacer(Modifier.width(6.dp))
                              Text("متصلون ($connected)", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                          }

                          Row(verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = { showInfo = true }) {
                                  Icon(
                                      Icons.Default.Info,
                                      contentDescription = "معلومات وتشخيص",
                                      tint = if (isHost) Color(0xFFFFD60A) else Color(0xFF8E8E93)
                                  )
                              }
                              OutlinedButton(
                                  onClick = { showRankDlg = true },
                                  shape = RoundedCornerShape(12.dp),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 8.dp)
                              ) {
                                  Text(
                                      "راكب #$rank",
                                      color = if (isHost) Color(0xFFFFD60A) else Color.LightGray,
                                      fontWeight = FontWeight.Bold, fontSize = 13.sp
                                  )
                              }
                          }
                      }

                      // Header + Anti-Collision Auto-Network Banner + Live Connected Rider Chips
                      Column(
                          Modifier.fillMaxWidth().align(Alignment.TopCenter).padding(top = 50.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.Center
                          ) {
                              Icon(
                                  Icons.Default.WifiTethering,
                                  contentDescription = null,
                                  tint = Color(0xFF32D74B),
                                  modifier = Modifier.size(14.dp)
                              )
                              Spacer(Modifier.width(4.dp))
                              Text(
                                  autoBanner,
                                  color = Color(0xFF32D74B),
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.SemiBold
                              )
                          }

                          if (editing) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  OutlinedTextField(
                                      value = name, onValueChange = { name = it },
                                      singleLine = true,
                                      textStyle = TextStyle(color = Color.White, fontSize = 16.sp, textAlign = TextAlign.Center),
                                      modifier = Modifier.width(220.dp)
                                  )
                                  IconButton(onClick = {
                                      editing = false
                                      engine.updateUser(name, rank)
                                      onSave(name, rank)
                                  }) {
                                      Icon(Icons.Default.Check, null, tint = Color(0xFF32D74B))
                                  }
                              }
                          } else {
                              Row(
                                  Modifier.clip(RoundedCornerShape(8.dp))
                                      .clickable { editing = true }
                                      .padding(horizontal = 12.dp, vertical = 2.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(name, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.width(6.dp))
                                  Icon(Icons.Default.Edit, null, tint = Color.Gray, modifier = Modifier.size(16.dp))
                              }
                          }

                          Text(
                              if (isHost) {
                                  "⭐ أنت القائد (الأقوى: ${engine.getSelfPowerScoreInt()} نقطة • بطارية ${engine.batteryPct}% • حرارة ${thermalLabel(engine.thermalStatus)})"
                              } else {
                                  "متصل بالقائد • قوتك ${engine.getSelfPowerScoreInt()} • بطارية ${engine.batteryPct}% • ${thermalLabel(engine.thermalStatus)}"
                              },
                              color = if (isHost) Color(0xFFFFD60A) else Color(0xFF8E8E93),
                              fontSize = 11.sp,
                              textAlign = TextAlign.Center
                          )

                          if (peers.isNotEmpty()) {
                              Spacer(Modifier.height(5.dp))
                              LazyRow(
                                  horizontalArrangement = Arrangement.spacedBy(6.dp),
                                  contentPadding = PaddingValues(horizontal = 8.dp)
                              ) {
                                  items(peers, key = { it.nodeId }) { p ->
                                      val isPeerHost = p.nodeId == hostId
                                      val didAck = ackedNames.contains("${p.name} (#${p.chainRank})")
                                      Row(
                                          Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (didAck) Color(0xFF143D1B) else Color(0xFF1C1C1E))
                                              .border(
                                                  1.dp,
                                                  if (didAck) Color(0xFF32D74B) else if (isPeerHost) Color(0xFFFFD60A) else Color(0xFF3A3A3C),
                                                  RoundedCornerShape(16.dp)
                                              )
                                              .padding(horizontal = 10.dp, vertical = 4.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              text = (if (isPeerHost) "⭐ " else "🏍️ ") + "${p.name} (${p.batteryPct}%)" + (if (didAck) " ✓" else ""),
                                              color = Color.White,
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                      }
                                  }
                              }
                          }

                          Spacer(Modifier.height(5.dp))
                          if (speaker != null) {
                              Text(speaker!!, color = Color(0xFF32D74B), fontSize = 15.sp, fontWeight = FontWeight.Bold)
                          } else {
                              Text(status, color = if (connected > 0) Color(0xFF32D74B) else Color(0xFFFF9F0A), fontSize = 12.sp)
                          }

                          if (ackSummary != null) {
                              Spacer(Modifier.height(5.dp))
                              Box(
                                  Modifier
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(if (ackedNames.isNotEmpty()) Color(0xFF103818) else Color(0xFF2C2C2E))
                                      .border(
                                          1.dp,
                                          if (ackedNames.isNotEmpty()) Color(0xFF32D74B) else Color(0xFFFFD60A),
                                          RoundedCornerShape(10.dp)
                                      )
                                      .padding(horizontal = 12.dp, vertical = 5.dp)
                              ) {
                                  Text(
                                      text = ackSummary!!,
                                      color = if (ackedNames.isNotEmpty()) Color(0xFF32D74B) else Color(0xFFFFD60A),
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold,
                                      textAlign = TextAlign.Center
                                  )
                              }
                          }
                      }

                      // Giant Lock-Screen Ready PTT Button + Instant Red Open Mic Button
                      Column(
                          Modifier.align(Alignment.Center).padding(top = 92.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Box(
                              Modifier.size(235.dp).clip(CircleShape)
                                  .background(pttColor)
                                  .border(4.dp, if (ptt) Color.White else Color(0xFFFFD60A), CircleShape)
                                  .pointerInput(Unit) {
                                      detectTapGestures(
                                          onPress = {
                                              touchPtt = true
                                              engine.setPttPressed(true)
                                              tryAwaitRelease()
                                              touchPtt = false
                                              engine.setPttPressed(false)
                                          }
                                      )
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Icon(
                                      Icons.Default.Bolt, null,
                                      tint = if (ptt) Color.Black else Color(0xFFFFD60A),
                                      modifier = Modifier.size(68.dp)
                                  )
                                  Text(
                                      if (ptt) "جاري إرسال البرقية..." else "اضغط مطولاً للبرقية",
                                      color = if (ptt) Color.Black else Color.White,
                                      fontSize = 16.sp, fontWeight = FontWeight.Bold
                                  )
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      if (ptt) "تصل فوراً مع تأكيد الاستلام" else "يعمل على شاشة القفل وبزر الصوت",
                                      color = if (ptt) Color(0xFF222222) else Color(0xFFAEAEB2),
                                      fontSize = 11.sp
                                  )
                              }
                          }
                          Spacer(Modifier.height(26.dp))
                          Box(
                              Modifier.size(88.dp).clip(CircleShape)
                                  .background(micColor)
                                  .border(2.dp, if (micOn) Color(0xFFFF8A80) else Color(0xFF8B0000), CircleShape)
                                  .clickable { micOn = !micOn; engine.isOpenMicOn = micOn },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  if (micOn) Icons.Default.Mic else Icons.Default.MicOff,
                                  null, tint = Color.White, modifier = Modifier.size(40.dp)
                              )
                          }
                          Spacer(Modifier.height(8.dp))
                          Text(
                              if (micOn) "المايك الأحمر مفتوح (صوت نقي وسريع)" else "المايك الأحمر مطفأ",
                              color = if (micOn) Color(0xFFFF453A) else Color(0xFF8E8E93),
                              fontSize = 13.sp, fontWeight = FontWeight.SemiBold
                          )
                      }

                      if (showUsers) {
                          AlertDialog(
                              onDismissRequest = { showUsers = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = {
                                  Text(
                                      "الدراجون المتصلون (${peers.size + 1})",
                                      color = Color.White,
                                      fontWeight = FontWeight.Bold
                                  )
                              },
                              text = {
                                  Column {
                                      Row(
                                          Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(Color(0xFF2C2C2E))
                                              .padding(horizontal = 10.dp, vertical = 6.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "أنت: $name • قوة ${engine.getSelfPowerScoreInt()} • بطارية ${engine.batteryPct}%" +
                                                  if (isHost) " ⭐ القائد" else "",
                                              color = Color(0xFFFFD60A),
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 12.sp
                                          )
                                      }
                                      Spacer(Modifier.height(6.dp))
                                      Row(
                                          Modifier.fillMaxWidth().clickable {
                                              selectAll = !selectAll
                                              engine.selectAllPeers = selectAll
                                              if (selectAll) peers.forEach {
                                                  if (!selected.contains(it.nodeId)) selected.add(it.nodeId)
                                                  engine.allowedPeerIds.add(it.nodeId)
                                              }
                                          }.padding(vertical = 4.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Checkbox(checked = selectAll, onCheckedChange = { c ->
                                              selectAll = c; engine.selectAllPeers = c
                                              if (c) peers.forEach {
                                                  if (!selected.contains(it.nodeId)) selected.add(it.nodeId)
                                                  engine.allowedPeerIds.add(it.nodeId)
                                              }
                                          })
                                          Text("ضم الكل في البرقيات والمكالمات", color = Color.White, fontSize = 13.sp)
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Spacer(Modifier.height(8.dp))
                                      if (peers.isEmpty()) {
                                          Text(
                                              "جاري الفحص التلقائي... الهاتف الأقوى فقط ينشئ الشبكة، وبقية الهواتف ترتبط به تلقائياً بدون تضارب.",
                                              color = Color.Gray, fontSize = 13.sp
                                          )
                                      } else {
                                          LazyColumn(Modifier.heightIn(max = 280.dp)) {
                                              items(peers, key = { it.nodeId }) { p ->
                                                  val isHostP = p.nodeId == hostId
                                                  val checked = selectAll || selected.contains(p.nodeId)
                                                  val acked = ackedNames.contains("${p.name} (#${p.chainRank})")
                                                  Row(
                                                      Modifier.fillMaxWidth().padding(vertical = 5.dp),
                                                      verticalAlignment = Alignment.CenterVertically
                                                  ) {
                                                      Checkbox(checked = checked, onCheckedChange = { c ->
                                                          selectAll = false; engine.selectAllPeers = false
                                                          if (c) {
                                                              if (!selected.contains(p.nodeId)) selected.add(p.nodeId)
                                                              engine.allowedPeerIds.add(p.nodeId)
                                                          } else {
                                                              selected.remove(p.nodeId)
                                                              engine.allowedPeerIds.remove(p.nodeId)
                                                          }
                                                      })
                                                      Column(Modifier.weight(1f)) {
                                                          Text(
                                                              "${p.name} (#${p.chainRank})" +
                                                                  (if (isHostP) " ⭐ (القائد الأقوى)" else "") +
                                                                  (if (acked) " • ✓ استلم البرقية" else ""),
                                                              color = if (isHostP) Color(0xFFFFD60A) else Color.White,
                                                              fontWeight = FontWeight.Bold, fontSize = 14.sp
                                                          )
                                                          Text(
                                                              "قوة الهاتف: ${engine.getPeerPowerScoreInt(p)} • بطارية ${p.batteryPct}% • ${thermalLabel(p.thermalStatus)}",
                                                              color = Color(0xFF32D74B),
                                                              fontSize = 11.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showUsers = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                                  ) { Text("تم", color = Color.White) }
                              }
                          )
                      }

                      if (showRankDlg) {
                          AlertDialog(
                              onDismissRequest = { showRankDlg = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("رقمك في مجموعة الدراجين", color = Color.White) },
                              text = {
                                  LazyColumn(Modifier.height(280.dp)) {
                                      items((1..12).toList()) { num ->
                                          val label = "راكب #$num"
                                          TextButton(
                                              onClick = {
                                                  rank = num; engine.updateUser(name, num); onSave(name, num)
                                                  showRankDlg = false
                                              },
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text(label, color = if (rank == num) Color(0xFFFF453A) else Color.White,
                                                   fontWeight = if (rank == num) FontWeight.Bold else FontWeight.Normal)
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  TextButton(onClick = { showRankDlg = false }) { Text("إغلاق", color = Color.Gray) }
                              }
                          )
                      }

                      if (showInfo) {
                          val ifaces = remember(sent, ver) { engine.getDebugInterfaces() }
                          val bcasts = remember(sent, ver) { engine.getDebugBroadcasts() }
                          val (gSsid, gPass) = remember(sent, ver) { engine.getAutoHotspotCredentials() }
                          AlertDialog(
                              onDismissRequest = { showInfo = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("تشخيص القائد الذكي والشبكة", color = Color.White, fontWeight = FontWeight.Bold) },
                              text = {
                                  Column(
                                      modifier = Modifier.heightIn(max = 360.dp).verticalScroll(rememberScrollState()),
                                      verticalArrangement = Arrangement.spacedBy(5.dp)
                                  ) {
                                      Text("قوة هاتفك الإجمالية: ${engine.getSelfPowerScoreInt()} نقطة (مواصفات الجهاز: ${engine.hardwareSpecScore})", color = Color(0xFFFFD60A), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                      Text("القائد الحالي: ${if (isHost) "أنت ($name)" else (peers.find { it.nodeId == hostId }?.name ?: "غير معروف")}", color = Color.White, fontSize = 12.sp)
                                      Text("قواعد القيادة الذكية:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      Text("• الأولوية للهاتف الأقوى (بطارية ≥ 30% + برودة الجهاز + رام ومعالج).", color = Color.White, fontSize = 11.sp)
                                      Text("• إذا نزلت بطارية القائد تحت 30% ينتقل لهاتف فوق 30% تلقائياً.", color = Color.White, fontSize = 11.sp)
                                      Text("• إذا كان الجميع تحت 30% يظل القائد كما هو بدون تذبذب.", color = Color.White, fontSize = 11.sp)

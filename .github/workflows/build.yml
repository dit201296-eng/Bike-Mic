                                  Icons.Default.LockOpen,
                                  contentDescription = null,
                                  tint = Color(0xFF32D74B),
                                  modifier = Modifier.size(13.dp)
                              )
                              Spacer(Modifier.width(4.dp))
                              Text(
                                  "يعمل على شاشة القفل + أزرار الصوت للبرقية السريعة",
                                  color = Color(0xFF32D74B),
                                  fontSize = 11.sp
                              )
                          }

                          if (editing) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  OutlinedTextField(
                                      value = name, onValueChange = { name = it },
                                      singleLine = true,
                                      textStyle = TextStyle(color = Color.White, fontSize = 16.sp, textAlign = TextAlign.Center),
                                      modifier = Modifier.width(220.dp)
                                  )
                                  IconButton(onClick = {
                                      editing = false
                                      engine.updateUser(name, rank)
                                      onSave(name, rank)
                                  }) {
                                      Icon(Icons.Default.Check, null, tint = Color(0xFF32D74B))
                                  }
                              }
                          } else {
                              Row(
                                  Modifier.clip(RoundedCornerShape(8.dp))
                                      .clickable { editing = true }
                                      .padding(horizontal = 12.dp, vertical = 2.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(name, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.width(6.dp))
                                  Icon(Icons.Default.Edit, null, tint = Color.Gray, modifier = Modifier.size(16.dp))
                              }
                          }

                          Text(
                              if (isHost) "أنت القائد • Epoch $epoch" else "خلف القائد • Epoch $epoch",
                              color = if (isHost) Color(0xFFFFD60A) else Color(0xFF8E8E93),
                              fontSize = 12.sp
                          )

                          // Live strip of connected riders visible to everyone without opening any dialog
                          if (peers.isNotEmpty()) {
                              Spacer(Modifier.height(6.dp))
                              LazyRow(
                                  horizontalArrangement = Arrangement.spacedBy(6.dp),
                                  contentPadding = PaddingValues(horizontal = 8.dp)
                              ) {
                                  items(peers, key = { it.nodeId }) { p ->
                                      val isPeerHost = p.nodeId == hostId
                                      val didAck = ackedNames.contains("${p.name} (#${p.chainRank})")
                                      Row(
                                          Modifier
                                              .clip(RoundedCornerShape(16.dp))
                                              .background(if (didAck) Color(0xFF143D1B) else Color(0xFF1C1C1E))
                                              .border(
                                                  1.dp,
                                                  if (didAck) Color(0xFF32D74B) else if (isPeerHost) Color(0xFFFFD60A) else Color(0xFF3A3A3C),
                                                  RoundedCornerShape(16.dp)
                                              )
                                              .padding(horizontal = 10.dp, vertical = 4.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              text = (if (isPeerHost) "⭐ " else "🏍️ ") + "${p.name} (#${p.chainRank})" + (if (didAck) " ✓" else ""),
                                              color = Color.White,
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                      }
                                  }
                              }
                          }

                          Spacer(Modifier.height(6.dp))
                          if (speaker != null) {
                              Text(speaker!!, color = Color(0xFF32D74B), fontSize = 15.sp, fontWeight = FontWeight.Bold)
                          } else {
                              Text(status, color = if (connected > 0) Color(0xFF32D74B) else Color(0xFFFF9F0A), fontSize = 12.sp)
                          }

                          // Delivery Confirmation Banner (تأكيد وصول البرقية)
                          if (ackSummary != null) {
                              Spacer(Modifier.height(6.dp))
                              Box(
                                  Modifier
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(if (ackedNames.isNotEmpty()) Color(0xFF103818) else Color(0xFF2C2C2E))
                                      .border(
                                          1.dp,
                                          if (ackedNames.isNotEmpty()) Color(0xFF32D74B) else Color(0xFFFFD60A),
                                          RoundedCornerShape(10.dp)
                                      )
                                      .padding(horizontal = 12.dp, vertical = 5.dp)
                              ) {
                                  Text(
                                      text = ackSummary!!,
                                      color = if (ackedNames.isNotEmpty()) Color(0xFF32D74B) else Color(0xFFFFD60A),
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold,
                                      textAlign = TextAlign.Center
                                  )
                              }
                          }
                      }

                      // Giant Lock-Screen Ready PTT Button + Instant Red Open Mic Button
                      Column(
                          Modifier.align(Alignment.Center).padding(top = 90.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Box(
                              Modifier.size(235.dp).clip(CircleShape)
                                  .background(pttColor)
                                  .border(4.dp, if (ptt) Color.White else Color(0xFFFFD60A), CircleShape)
                                  .pointerInput(Unit) {
                                      detectTapGestures(
                                          onPress = {
                                              touchPtt = true
                                              engine.setPttPressed(true)
                                              tryAwaitRelease()
                                              touchPtt = false
                                              engine.setPttPressed(false)
                                          }
                                      )
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Icon(
                                      Icons.Default.Bolt, null,
                                      tint = if (ptt) Color.Black else Color(0xFFFFD60A),
                                      modifier = Modifier.size(68.dp)
                                  )
                                  Text(
                                      if (ptt) "جاري إرسال البرقية..." else "اضغط مطولاً للبرقية",
                                      color = if (ptt) Color.Black else Color.White,
                                      fontSize = 16.sp, fontWeight = FontWeight.Bold
                                  )
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      if (ptt) "تصل فوراً مع تأكيد الاستلام" else "أو اضغط زر الصوت في الهاتف",
                                      color = if (ptt) Color(0xFF222222) else Color(0xFFAEAEB2),
                                      fontSize = 11.sp
                                  )
                              }
                          }
                          Spacer(Modifier.height(26.dp))
                          Box(
                              Modifier.size(88.dp).clip(CircleShape)
                                  .background(micColor)
                                  .border(2.dp, if (micOn) Color(0xFFFF8A80) else Color(0xFF8B0000), CircleShape)
                                  .clickable { micOn = !micOn; engine.isOpenMicOn = micOn },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  if (micOn) Icons.Default.Mic else Icons.Default.MicOff,
                                  null, tint = Color.White, modifier = Modifier.size(40.dp)
                              )
                          }
                          Spacer(Modifier.height(8.dp))
                          Text(
                              if (micOn) "المايك الأحمر مفتوح (صوت نقي وسريع)" else "المايك الأحمر مطفأ",
                              color = if (micOn) Color(0xFFFF453A) else Color(0xFF8E8E93),
                              fontSize = 13.sp, fontWeight = FontWeight.SemiBold
                          )
                      }

                      if (showUsers) {
                          AlertDialog(
                              onDismissRequest = { showUsers = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = {
                                  Text(
                                      "الدراجون المتصلون (${peers.size + 1})",
                                      color = Color.White,
                                      fontWeight = FontWeight.Bold
                                  )
                              },
                              text = {
                                  Column {
                                      // Always show Self at the top of the list so the user sees their own status too
                                      Row(
                                          Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(8.dp))
                                              .background(Color(0xFF2C2C2E))
                                              .padding(horizontal = 10.dp, vertical = 6.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "أنت: $name (راكب #$rank)" + if (isHost) " ⭐ القائد" else "",
                                              color = Color(0xFFFFD60A),
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 13.sp
                                          )
                                      }
                                      Spacer(Modifier.height(6.dp))
                                      Row(
                                          Modifier.fillMaxWidth().clickable {
                                              selectAll = !selectAll
                                              engine.selectAllPeers = selectAll
                                              if (selectAll) peers.forEach {
                                                  if (!selected.contains(it.nodeId)) selected.add(it.nodeId)
                                                  engine.allowedPeerIds.add(it.nodeId)
                                              }
                                          }.padding(vertical = 4.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Checkbox(checked = selectAll, onCheckedChange = { c ->
                                              selectAll = c; engine.selectAllPeers = c
                                              if (c) peers.forEach {
                                                  if (!selected.contains(it.nodeId)) selected.add(it.nodeId)
                                                  engine.allowedPeerIds.add(it.nodeId)
                                              }
                                          })
                                          Text("ضم الكل في البرقيات والمكالمات", color = Color.White, fontSize = 13.sp)
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Spacer(Modifier.height(8.dp))
                                      if (peers.isEmpty()) {
                                          Text(
                                              "لا يوجد دراجون آخرون بعد. افتح نقطة اتصال (Hotspot) في هاتف واحد واتصل بها من بقية الهواتف.",
                                              color = Color.Gray, fontSize = 13.sp
                                          )
                                      } else {
                                          LazyColumn(Modifier.heightIn(max = 280.dp)) {
                                              items(peers, key = { it.nodeId }) { p ->
                                                  val isHostP = p.nodeId == hostId
                                                  val checked = selectAll || selected.contains(p.nodeId)
                                                  val acked = ackedNames.contains("${p.name} (#${p.chainRank})")
                                                  Row(
                                                      Modifier.fillMaxWidth().padding(vertical = 5.dp),
                                                      verticalAlignment = Alignment.CenterVertically
                                                  ) {
                                                      Checkbox(checked = checked, onCheckedChange = { c ->
                                                          selectAll = false; engine.selectAllPeers = false
                                                          if (c) {
                                                              if (!selected.contains(p.nodeId)) selected.add(p.nodeId)
                                                              engine.allowedPeerIds.add(p.nodeId)
                                                          } else {
                                                              selected.remove(p.nodeId)
                                                              engine.allowedPeerIds.remove(p.nodeId)
                                                          }
                                                      })
                                                      Column(Modifier.weight(1f)) {
                                                          Text(
                                                              "راكب #${p.chainRank}: ${p.name}" +
                                                                  (if (isHostP) " ⭐ (القائد)" else "") +
                                                                  (if (acked) " • ✓ استلم البرقية" else ""),
                                                              color = if (isHostP) Color(0xFFFFD60A) else Color.White,
                                                              fontWeight = FontWeight.Bold, fontSize = 14.sp
                                                          )
                                                          Text(
                                                              "IP: ${p.ipAddress} • بطارية ${p.batteryPct}% • ${thermalLabel(p.thermalStatus)}",
                                                              color = Color(0xFF32D74B),
                                                              fontSize = 11.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showUsers = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                                  ) { Text("تم", color = Color.White) }
                              }
                          )
                      }

                      if (showRankDlg) {
                          AlertDialog(
                              onDismissRequest = { showRankDlg = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("ترتيبك في السلسلة", color = Color.White) },
                              text = {
                                  LazyColumn(Modifier.height(280.dp)) {
                                      items((1..12).toList()) { num ->
                                          val label = if (num == 1) "1 = قائد السلسلة" else "$num (خلف ${num - 1}، أمام ${num + 1})"
                                          TextButton(
                                              onClick = {
                                                  rank = num; engine.updateUser(name, num); onSave(name, num)
                                                  showRankDlg = false
                                              },
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text(label, color = if (rank == num) Color(0xFFFF453A) else Color.White,
                                                   fontWeight = if (rank == num) FontWeight.Bold else FontWeight.Normal)
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  TextButton(onClick = { showRankDlg = false }) { Text("إغلاق", color = Color.Gray) }
                              }
                          )
                      }

                      if (showInfo) {
                          val ifaces = remember(sent, ver) { engine.getDebugInterfaces() }
                          val bcasts = remember(sent, ver) { engine.getDebugBroadcasts() }
                          AlertDialog(
                              onDismissRequest = { showInfo = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("تشخيص الشبكة والصوت", color = Color.White, fontWeight = FontWeight.Bold) },
                              text = {
                                  Column(
                                      modifier = Modifier.heightIn(max = 360.dp).verticalScroll(rememberScrollState()),
                                      verticalArrangement = Arrangement.spacedBy(5.dp)
                                  ) {
                                      Text("معرفك: ${engine.selfId}", color = Color.Gray, fontSize = 11.sp)
                                      Text("القائد: ${if (isHost) "أنت ($name)" else (peers.find { it.nodeId == hostId }?.name ?: "غير معروف")}", color = Color.White, fontSize = 12.sp)
                                      Text("ترميز الصوت: G.711 u-law 16kHz Little-Endian (320B/20ms)", color = Color(0xFF32D74B), fontSize = 11.sp)
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("واجهات شبكتك:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      if (ifaces.isEmpty()) {
                                          Text("لا توجد واجهات نشطة!", color = Color.Red, fontSize = 12.sp)
                                      } else {
                                          ifaces.forEach { (ifName, ip) ->
                                              Text("• $ifName: $ip", color = Color.White, fontSize = 12.sp)
                                          }
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("الأهداف النشطة (Unicast / Gateway / Broadcast):", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      bcasts.forEach { b ->
                                          Text("• $b", color = Color.White, fontSize = 11.sp)
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("إحصائيات:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      Text("• حزم أُرسلت: $sent", color = Color.White, fontSize = 12.sp)
                                      Text("• حزم مستلمة من أقران: $received", color = Color.White, fontSize = 12.sp)
                                      Text("• أقران متصلون: ${peers.size}", color = Color.White, fontSize = 12.sp)
                                      Text("• حالة النظام: $lastErr", color = Color(0xFFFF9F0A), fontSize = 11.sp)
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showInfo = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF32D74B))
                                  ) { Text("فهمت", color = Color.Black) }
                              }
                          )
                      }
                  }
              }

              fun thermalLabel(t: Int): String = when (t) {
                  DeviceHealthMonitor.THERMAL_NONE -> "طبيعي"
                  DeviceHealthMonitor.THERMAL_LIGHT -> "خفيف"
                  DeviceHealthMonitor.THERMAL_MODERATE -> "متوسط"
                  DeviceHealthMonitor.THERMAL_SEVERE -> "مرتفع ⚠️"
                  else -> "حرج 🚨"
              }
          """)

          print("BikeMic P2P Mesh project (HD Audio + LockScreen + ACK) generated successfully.")
          PYEOF
          python3 /tmp/gen_bikemic_p2p.py

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMic-P2P-Mesh-Diagnostics-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30


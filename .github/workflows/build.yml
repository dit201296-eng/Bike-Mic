                  @Volatile private var discoverySocket: DatagramSocket? = null
                  @Volatile private var multicastSocket: MulticastSocket? = null
                  @Volatile private var audioSocket: DatagramSocket? = null

                  private val ulawToLinearTable = ShortArray(256) { idx ->
                      val u = idx.inv() and 0xFF
                      val sign = u and 0x80
                      val exponent = (u shr 4) and 0x07
                      val mantissa = u and 0x0F
                      var sample = ((mantissa shl 3) + 0x84) shl exponent
                      sample -= 0x84
                      (if (sign != 0) -sample else sample).coerceIn(-32768, 32767).toShort()
                  }

                  private fun linearToUlaw(sampleIn: Int): Byte {
                      val BIAS = 0x84
                      val CLIP = 32635
                      var sample = sampleIn
                      val sign = if (sample < 0) {
                          sample = -sample
                          0x80
                      } else {
                          0x00
                      }
                      if (sample > CLIP) sample = CLIP
                      sample += BIAS
                      var exponent = 7
                      var expMask = 0x4000
                      while (exponent > 0 && (sample and expMask) == 0) {
                          exponent--
                          expMask = expMask shr 1
                      }
                      val mantissa = (sample shr (exponent + 3)) and 0x0F
                      val ulawByte = (sign or (exponent shl 4) or mantissa).inv()
                      return ulawByte.toByte()
                  }

                  fun setPttPressed(pressed: Boolean) {
                      if (pressed && !pttActiveInternal) {
                          val bId = burstCounter.incrementAndGet()
                          currentBurstId = bId
                          ackedPeerIdsForBurst.clear()
                          mainScope.launch {
                              ackedPeerNames.clear()
                              lastAckSummary.value = "جاري إرسال البرقية..."
                          }
                          pttActiveInternal = true
                          playShortBeep(ToneGenerator.TONE_PROP_BEEP, 45)
                      } else if (!pressed && pttActiveInternal) {
                          val finishedBurstId = currentBurstId
                          pttActiveInternal = false
                          scope.launch {
                              sendBurstEndSignal(finishedBurstId)
                          }
                      }
                  }

                  private fun playShortBeep(tone: Int, durationMs: Int) {
                      runCatching {
                          if (toneGen == null) {
                              toneGen = ToneGenerator(AudioManager.STREAM_VOICE_CALL, 75)
                          }
                          toneGen?.startTone(tone, durationMs)
                      }
                  }

                  private fun vibrateConfirmation() {
                      runCatching {
                          val vib = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vib.vibrate(VibrationEffect.createOneShot(65L, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              vib.vibrate(65L)
                          }
                      }
                  }

                  fun start() {
                      runCatching {
                          val pm = context.applicationContext.getSystemService(Context.POWER_SERVICE) as PowerManager
                          cpuWakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BikeMic::CpuWakeLock").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }
                      runCatching {
                          val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          multicastLock = wifi.createMulticastLock("BikeMicMulticast").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                          wifiLock = wifi.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "BikeMicWifi").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }.onFailure { debugLastError.value = "WifiLock: ${it.message}" }

                      runCatching {
                          val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.mode = AudioManager.MODE_IN_COMMUNICATION
                          am.isSpeakerphoneOn = true
                      }

                      // Always include standard Wi-Fi Direct Group Owner IP (192.168.49.1) in hint targets
                      knownHintIps.add("192.168.49.1")

                      // Start Zero-Touch Auto-Hotspot / Auto-Discovery Manager
                      val shouldStartAsHost = (chainRank == 1) && (batteryPct > 3 || isCharging)
                      if (shouldStartAsHost) {
                          val (h, ep) = election.declareSelfAsHost()
                          currentHostIdState.longValue = h
                          currentEpochState.longValue = ep
                      }
                      autoHotspot = AutoMeshHotspotManager(
                          context = context,
                          onStatusChange = { msg ->
                              mainScope.launch { autoNetBanner.value = msg }
                          },
                          onTopologyChanged = { goIp ->
                              if (!goIp.isNullOrEmpty()) knownHintIps.add(goIp)
                              scope.launch { sendHeartbeatNow() }
                          }
                      ).also {
                          it.start(initialShouldHost = shouldStartAsHost)
                      }

                      scope.launch {
                          refreshNetworkTopology()
                          val sockReady = initDiscoverySockets()
                          if (sockReady) {
                              startDiscoveryReceiver()
                              startMulticastReceiver()
                              startHeartbeatLoop()
                              startElectionLoop()
                          }
                          startAudioEngine()
                      }
                  }

                  fun stop() {
                      scope.cancel()
                      mainScope.cancel()
                      runCatching { autoHotspot?.stop() }
                      runCatching { discoverySocket?.close() }
                      runCatching { multicastSocket?.close() }
                      runCatching { audioSocket?.close() }
                      runCatching { toneGen?.release() }
                      runCatching { if (multicastLock?.isHeld == true) multicastLock?.release() }
                      runCatching { if (wifiLock?.isHeld == true) wifiLock?.release() }
                      runCatching { if (cpuWakeLock?.isHeld == true) cpuWakeLock?.release() }
                  }

                  fun updateUser(newName: String, newRank: Int) {
                      val oldRank = chainRank
                      userName = newName
                      chainRank = newRank
                      if (oldRank != newRank) {
                          val shouldBeHost = (newRank == 1 && (batteryPct > 3 || isCharging))
                          if (shouldBeHost) {
                              val (h, ep) = election.declareSelfAsHost()
                              currentHostIdState.longValue = h
                              currentEpochState.longValue = ep
                          }
                          autoHotspot?.setRole(shouldBeHost)
                      }
                      syncPeersToCompose()
                      scope.launch { sendHeartbeatNow() }
                  }

                  fun updateHealth(bat: Int, chg: Boolean, thermal: Int) {
                      batteryPct = bat
                      isCharging = chg
                      thermalStatus = thermal
                      syncPeersToCompose()
                  }

                  fun getDebugInterfaces(): List<Pair<String, String>> = cachedIfacesInfo

                  fun getDebugBroadcasts(): List<String> = cachedTargetIps.mapNotNull { it.hostAddress }.sorted()

                  fun getAutoHotspotCredentials(): Pair<String, String> =
                      (autoHotspot?.groupSsid ?: "") to (autoHotspot?.groupPass ?: "")

                  private fun isIgnoredInterface(name: String): Boolean {
                      val n = name.lowercase()
                      return n.startsWith("rmnet") || n.startsWith("ccmni") ||
                             n.startsWith("pdp") || n.startsWith("dummy") ||
                             n.startsWith("tun") || n.startsWith("ppp") ||
                             n.startsWith("clat") || n.startsWith("v4-") || n.startsWith("lo")
                  }

                  private fun isValidIpv4Literal(s: String): Boolean {
                      val parts = s.split('.')
                      if (parts.size != 4) return false
                      for (p in parts) {
                          val v = p.toIntOrNull() ?: return false
                          if (v !in 0..255) return false
                      }
                      return s != "0.0.0.0"
                  }

                  private fun refreshNetworkTopology() {
                      val targets = LinkedHashSet<InetAddress>()
                      val localIps = HashSet<String>()
                      val ifaceList = ArrayList<Pair<String, String>>()

                      runCatching {
                          val ifaces = NetworkInterface.getNetworkInterfaces()
                          while (ifaces != null && ifaces.hasMoreElements()) {
                              val nif = ifaces.nextElement()
                              if (!nif.isUp || nif.isLoopback || isIgnoredInterface(nif.name)) continue

                              for (ia in nif.interfaceAddresses) {
                                  val addr = ia.address
                                  if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                      val ipStr = addr.hostAddress ?: continue
                                      localIps.add(ipStr)
                                      ifaceList.add(nif.name to ipStr)

                                      ia.broadcast?.let { targets.add(it) }

                                      val prefix = ia.networkPrefixLength.toInt()
                                      if (prefix in 8..30) {
                                          val b = addr.address
                                          val ipInt = ((b[0].toInt() and 0xFF) shl 24) or
                                                      ((b[1].toInt() and 0xFF) shl 16) or
                                                      ((b[2].toInt() and 0xFF) shl 8) or
                                                      (b[3].toInt() and 0xFF)
                                          val mask = -1 shl (32 - prefix)
                                          val bcastInt = (ipInt and mask) or mask.inv()
                                          val bcastBytes = byteArrayOf(
                                              (bcastInt ushr 24).toByte(),
                                              (bcastInt ushr 16).toByte(),
                                              (bcastInt ushr 8).toByte(),
                                              bcastInt.toByte()
                                          )
                                          runCatching { targets.add(InetAddress.getByAddress(bcastBytes)) }

                                          val gwBytes = byteArrayOf(b[0], b[1], b[2], 1)
                                          val gwAddr = InetAddress.getByAddress(gwBytes)
                                          if (gwAddr.hostAddress != ipStr) targets.add(gwAddr)
                                      }
                                  }
                              }
                          }
                      }

                      // Always add standard Wi-Fi Direct Group Owner IP & Broadcast (192.168.49.1 / 192.168.49.255)
                      if ("192.168.49.1" !in localIps) {
                          runCatching { targets.add(InetAddress.getByName("192.168.49.1")) }
                      }
                      runCatching { targets.add(InetAddress.getByName("192.168.49.255")) }

                      // Read Hotspot/Router Gateway IP from ConnectivityManager
                      runCatching {
                          val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          for (net in cm.allNetworks) {
                              val lp = cm.getLinkProperties(net) ?: continue
                              val ifName = lp.interfaceName ?: ""
                              if (ifName.isNotEmpty() && isIgnoredInterface(ifName)) continue
                              for (route in lp.routes) {
                                  val gw = route.gateway
                                  if (gw is Inet4Address && !gw.isLoopbackAddress && !gw.isAnyLocalAddress) {
                                      val gwStr = gw.hostAddress ?: ""
                                      if (gwStr !in localIps) targets.add(gw)
                                  }
                              }
                          }
                      }

                      // Read WiFi DHCP Gateway fallback
                      runCatching {
                          val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          @Suppress("DEPRECATION")
                          val dhcp = wifi.dhcpInfo
                          if (dhcp != null && dhcp.gateway != 0) {
                              val g = dhcp.gateway
                              val gwBytes = byteArrayOf(
                                  (g and 0xFF).toByte(),
                                  ((g shr 8) and 0xFF).toByte(),
                                  ((g shr 16) and 0xFF).toByte(),
                                  ((g shr 24) and 0xFF).toByte()
                              )
                              val gwAddr = InetAddress.getByAddress(gwBytes)
                              if (gwAddr.hostAddress !in localIps) targets.add(gwAddr)
                          }
                      }

                      // Read ARP neighbors
                      runCatching {
                          val arpFile = File("/proc/net/arp")
                          if (arpFile.canRead()) {
                              arpFile.forEachLine { line ->
                                  val tokens = line.trim().split(' ', '\t').filter { it.isNotEmpty() }
                                  if (tokens.size >= 6) {
                                      val ip = tokens[0]
                                      val dev = tokens[5]
                                      if (isValidIpv4Literal(ip) && ip !in localIps && !isIgnoredInterface(dev)) {
                                          runCatching { targets.add(InetAddress.getByName(ip)) }
                                      }
                                  }
                              }
                          }
                      }

                      peersMap.values.forEach { p ->
                          if (p.ipAddress.isNotEmpty() && p.ipAddress !in localIps) {
                              runCatching { targets.add(InetAddress.getByName(p.ipAddress)) }
                          }
                      }
                      knownHintIps.forEach { ip ->
                          if (ip !in localIps) {
                              runCatching { targets.add(InetAddress.getByName(ip)) }
                          }
                      }

                      runCatching { targets.add(InetAddress.getByName(MULTICAST_GROUP)) }
                      runCatching { targets.add(InetAddress.getByName("255.255.255.255")) }

                      cachedLocalIps = localIps
                      cachedIfacesInfo = ifaceList
                      cachedTargetIps = targets
                  }

                  private fun initDiscoverySockets(): Boolean {
                      return try {
                          discoverySocket = DatagramSocket(null).apply {
                              reuseAddress = true
                              broadcast = true
                              bind(InetSocketAddress(DISCOVERY_PORT))
                          }
                          runCatching {
                              val group = InetAddress.getByName(MULTICAST_GROUP)
                              val ms = MulticastSocket(DISCOVERY_PORT).apply {
                                  reuseAddress = true
                                  timeToLive = 4
                              }
                              var joinedAny = false
                              val ifaces = NetworkInterface.getNetworkInterfaces()
                              while (ifaces != null && ifaces.hasMoreElements()) {
                                  val nif = ifaces.nextElement()
                                  if (nif.isUp && !nif.isLoopback && nif.supportsMulticast() && !isIgnoredInterface(nif.name)) {
                                      runCatching {
                                          ms.joinGroup(InetSocketAddress(group, DISCOVERY_PORT), nif)
                                          joinedAny = true
                                      }
                                  }
                              }
                              if (!joinedAny) {
                                  @Suppress("DEPRECATION")
                                  runCatching { ms.joinGroup(group) }
                              }
                              multicastSocket = ms
                          }
                          true
                      } catch (e: Exception) {
                          debugLastError.value = "فشل فتح منفذ الشبكة: ${e.message}"
                          false
                      }
                  }

                  private fun sendUnicastJson(obj: JSONObject, targetAddr: InetAddress) {
                      val sock = discoverySocket ?: return
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      runCatching {
                          sock.send(DatagramPacket(data, data.size, targetAddr, DISCOVERY_PORT))
                          debugSentCount.intValue += 1
                      }
                  }

                  private fun sendToAllDiscoveryTargets(obj: JSONObject, excludeIp: String? = null) {
                      val sock = discoverySocket ?: return
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      for (target in cachedTargetIps) {
                          if (excludeIp != null && target.hostAddress == excludeIp) continue
                          runCatching {
                              sock.send(DatagramPacket(data, data.size, target, DISCOVERY_PORT))
                              debugSentCount.intValue += 1
                          }
                      }
                  }

                  private fun buildSelfHeartbeatJson(type: String = "HB"): JSONObject {
                      val now = System.currentTimeMillis()
                      val peersArr = JSONArray()
                      peersMap.values.forEach { p ->
                          if (now - p.lastSeenMs < 9000L && p.ipAddress.isNotEmpty()) {
                              peersArr.put(JSONObject().apply {
                                  put("id", p.nodeId)
                                  put("ip", p.ipAddress)
                                  put("name", p.name)
                                  put("rank", p.chainRank)
                                  put("bat", p.batteryPct)
                                  put("chg", p.isCharging)
                                  put("thm", p.thermalStatus)
                                  put("epoch", p.epoch)
                                  put("host", p.currentHostId)
                                  put("age", (now - p.lastSeenMs).coerceAtLeast(0L))
                              })
                          }
                      }
                      return JSONObject().apply {
                          put("t", type)
                          put("id", selfId)
                          put("name", userName)
                          put("rank", chainRank)
                          put("bat", batteryPct)
                          put("chg", isCharging)
                          put("thm", thermalStatus)
                          put("epoch", election.currentEpoch)
                          put("host", election.currentHostId)
                          put("peers", peersArr)
                      }
                  }

                  private fun sendHeartbeatNow() {
                      refreshNetworkTopology()
                      sendToAllDiscoveryTargets(buildSelfHeartbeatJson("HB"))
                  }

                  private fun sendBurstEndSignal(burstId: Int) {
                      if (burstId <= 0) return
                      val pkt = JSONObject().apply {
                          put("t", "BURST_END")
                          put("id", selfId)
                          put("name", userName)
                          put("rank", chainRank)
                          put("burstId", burstId)
                          put("msgId", Random.nextLong(1L, Long.MAX_VALUE))
                          put("ttl", 2)
                      }
                      repeat(2) {
                          sendToAllDiscoveryTargets(pkt)
                      }
                  }

                  private fun sendBurstAck(targetSenderId: Long, burstId: Int, replyAddr: InetAddress?) {
                      val ackObj = JSONObject().apply {
                          put("t", "BURST_ACK")
                          put("id", selfId)
                          put("name", userName)
                          put("rank", chainRank)
                          put("targetId", targetSenderId)
                          put("burstId", burstId)
                          put("msgId", Random.nextLong(1L, Long.MAX_VALUE))
                          put("ttl", 2)
                      }
                      if (replyAddr != null) {
                          sendUnicastJson(ackObj, replyAddr)
                      }
                      sendToAllDiscoveryTargets(ackObj)
                  }

                  private fun startDiscoveryReceiver() {
                      scope.launch {
                          val buf = ByteArray(8192)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  discoverySocket?.receive(pkt) ?: break
                                  handleDiscoveryPacket(pkt)
                              } catch (e: Exception) {
                                  if (isActive) delay(150)
                              }
                          }
                      }
                  }

                  private fun startMulticastReceiver() {
                      val ms = multicastSocket ?: return
                      scope.launch {
                          val buf = ByteArray(8192)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  ms.receive(pkt)
                                  handleDiscoveryPacket(pkt)
                              } catch (e: Exception) {
                                  if (isActive) delay(250)
                              }
                          }
                      }
                  }

                  private fun handleDiscoveryPacket(pkt: DatagramPacket) {
                      runCatching {
                          val text = String(pkt.data, 0, pkt.length, Charsets.UTF_8)
                          val msg = JSONObject(text)
                          val senderId = msg.optLong("id", -1L)
                          if (senderId <= 0L || senderId == selfId) return

                          debugReceivedCount.intValue += 1
                          val now = System.currentTimeMillis()

                          val senderIp = pkt.address.hostAddress ?: ""
                          if (senderIp.isNotEmpty() && senderIp !in cachedLocalIps) {
                              knownHintIps.add(senderIp)
                          }

                          val type = msg.optString("t")
                          when (type) {
                              "HB", "DIRECT_ACK" -> {
                                  val existed = peersMap[senderId]
                                  val peer = PeerInfo(
                                      nodeId = senderId,
                                      name = msg.optString("name", existed?.name ?: "راكب").ifBlank { "راكب" },
                                      chainRank = msg.optInt("rank", existed?.chainRank ?: 2),
                                      batteryPct = msg.optInt("bat", existed?.batteryPct ?: 100),
                                      isCharging = msg.optBoolean("chg", existed?.isCharging ?: false),
                                      thermalStatus = msg.optInt("thm", existed?.thermalStatus ?: 0),
                                      epoch = msg.optLong("epoch", existed?.epoch ?: 0L),
                                      currentHostId = msg.optLong("host", senderId),
                                      ipAddress = senderIp.ifEmpty { existed?.ipAddress ?: "" },
                                      lastSeenMs = now,
                                      handshakeOk = true,
                                      isDirect = true
                                  )
                                  peersMap[senderId] = peer
                                  if (selectAllPeers) allowedPeerIds.add(senderId)

                                  val remoteHost = msg.optLong("host", -1L)
                                  val remoteEpoch = msg.optLong("epoch", 0L)
                                  if (remoteHost > 0L && election.acceptHostAnnouncement(remoteHost, remoteEpoch)) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                      autoHotspot?.setRole(election.currentHostId == selfId)
                                  }

                                  // Full Mesh Gossip table
                                  val gossipArr = msg.optJSONArray("peers")
                                  if (gossipArr != null) {
                                      for (i in 0 until gossipArr.length()) {
                                          val gp = gossipArr.optJSONObject(i) ?: continue
                                          val gId = gp.optLong("id", -1L)
                                          if (gId <= 0L || gId == selfId) continue
                                          val gIp = gp.optString("ip", "")
                                          val gName = gp.optString("name", "راكب").ifBlank { "راكب" }
                                          val gRank = gp.optInt("rank", 2)
                                          val gBat = gp.optInt("bat", 100)
                                          val gChg = gp.optBoolean("chg", false)
                                          val gThm = gp.optInt("thm", 0)
                                          val gEpoch = gp.optLong("epoch", 0L)
                                          val gHost = gp.optLong("host", gId)
                                          val gAge = gp.optLong("age", 0L).coerceIn(0L, 8000L)
                                          val inferredSeen = now - gAge

                                          val currentEntry = peersMap[gId]
                                          if (currentEntry == null || (inferredSeen > currentEntry.lastSeenMs + 1500L)) {
                                              val resolvedIp = if (gIp.isNotEmpty() && gIp !in cachedLocalIps) gIp else (currentEntry?.ipAddress ?: senderIp)
                                              peersMap[gId] = PeerInfo(
                                                  nodeId = gId,
                                                  name = gName,
                                                  chainRank = gRank,
                                                  batteryPct = gBat,
                                                  isCharging = gChg,
                                                  thermalStatus = gThm,
                                                  epoch = gEpoch,
                                                  currentHostId = gHost,
                                                  ipAddress = resolvedIp,
                                                  lastSeenMs = maxOf(currentEntry?.lastSeenMs ?: 0L, inferredSeen),
                                                  handshakeOk = true,
                                                  isDirect = currentEntry?.isDirect ?: false
                                              )
                                              if (selectAllPeers) allowedPeerIds.add(gId)
                                          }

                                          if (gIp.isNotEmpty() && gIp !in cachedLocalIps) {
                                              if (knownHintIps.add(gIp) || currentEntry == null) {
                                                  runCatching {
                                                      sendUnicastJson(buildSelfHeartbeatJson("HB"), InetAddress.getByName(gIp))
                                                  }
                                              }
                                          }
                                      }
                                  }

                                  if (type == "HB" || existed == null || !existed.handshakeOk) {
                                      sendUnicastJson(buildSelfHeartbeatJson("DIRECT_ACK"), pkt.address)
                                  }

                                  syncPeersToCompose()
                              }
                              "BURST_END" -> {
                                  val msgId = msg.optLong("msgId", 0L)
                                  if (msgId != 0L && seenCtrlMsg.put(msgId, true) != null) return
                                  val burstId = msg.optInt("burstId", 0)
                                  if (burstId > 0) {
                                      val key = (senderId shl 20) xor burstId.toLong()
                                      if (receivedBurstsAcked.put(key, now) == null) {
                                          sendBurstAck(senderId, burstId, pkt.address)
                                      }
                                  }
                                  val ttl = msg.optInt("ttl", 0)
                                  if (ttl > 0 && peersMap.size > 1) {
                                      msg.put("ttl", ttl - 1)
                                      sendToAllDiscoveryTargets(msg, excludeIp = senderIp)
                                  }
                              }
                              "BURST_ACK" -> {
                                  val msgId = msg.optLong("msgId", 0L)
                                  if (msgId != 0L && seenCtrlMsg.put(msgId, true) != null) return
                                  val targetId = msg.optLong("targetId", -1L)
                                  val burstId = msg.optInt("burstId", 0)
                                  val ackerName = msg.optString("name", peersMap[senderId]?.name ?: "راكب")
                                  val ackerRank = msg.optInt("rank", peersMap[senderId]?.chainRank ?: 2)

                                  if (targetId == selfId && burstId == currentBurstId && burstId > 0) {
                                      if (ackedPeerIdsForBurst.add(senderId)) {
                                          val label = "$ackerName (#$ackerRank)"
                                          mainScope.launch {
                                              if (!ackedPeerNames.contains(label)) {
                                                  ackedPeerNames.add(label)
                                              }
                                              lastAckSummary.value = "✓ وصلت البرقية إلى (${ackedPeerNames.size}): ${ackedPeerNames.joinToString("، ")}"
                                          }
                                          playShortBeep(ToneGenerator.TONE_PROP_ACK, 70)
                                          vibrateConfirmation()
                                      }
                                  } else {
                                      val ttl = msg.optInt("ttl", 0)
                                      if (ttl > 0 && peersMap.size > 1) {
                                          msg.put("ttl", ttl - 1)
                                          sendToAllDiscoveryTargets(msg, excludeIp = senderIp)
                                      }
                                  }
                              }
                              "STEP_DOWN" -> {
                                  val epoch = msg.optLong("epoch", 0L)
                                  val nextHostId = msg.optLong("nextHostId", -1L)
                                  if (epoch >= election.currentEpoch) {
                                      statusText.value = "بطارية القائد أقل من 3%... جاري استلام القيادة تلقائياً"
                                      if (nextHostId == selfId) {
                                          promoteSelfToLeaderAndHost(minEpoch = epoch)
                                      }
                                  }
                              }
                              "I_AM_HOST" -> {
                                  val newHost = msg.optLong("id", -1L)
                                  val epoch = msg.optLong("epoch", 0L)
                                  if (newHost > 0L && election.acceptHostAnnouncement(newHost, epoch)) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                      autoHotspot?.setRole(newHost == selfId)
                                      val hostName = if (newHost == selfId) userName else (peersMap[newHost]?.name ?: "راكب")
                                      leaderChangeEvent.value = "القائد الجديد: $hostName"
                                      statusText.value = "متصل • القائد: $hostName"
                                  }
                              }
                          }
                      }.onFailure {
                          debugLastError.value = "Parse: ${it.message}"
                      }
                  }

                  private fun promoteSelfToLeaderAndHost(minEpoch: Long = election.currentEpoch) {
                      val (newHost, newEpoch) = election.declareSelfAsHost(minEpoch)
                      currentHostIdState.longValue = newHost
                      currentEpochState.longValue = newEpoch
                      autoHotspot?.setRole(true)
                      val announce = JSONObject().apply {
                          put("t", "I_AM_HOST")
                          put("id", newHost)
                          put("epoch", newEpoch)
                      }
                      repeat(3) {
                          sendToAllDiscoveryTargets(announce)
                      }
                      leaderChangeEvent.value = "أصبحت أنت قائد السلسلة (تم تفعيل نقطة الاتصال تلقائياً)"
                  }

                  private fun syncPeersToCompose() {
                      val sorted = peersMap.values.filter { it.handshakeOk }
                          .sortedWith(compareBy<PeerInfo> { it.chainRank }.thenBy { it.name })
                      val live = sorted.size
                      connectedCount.intValue = live
                      peersVersion.intValue += 1

                      mainScope.launch {
                          peersListState.clear()
                          peersListState.addAll(sorted)
                      }

                      if (live > 0) {
                          val hostId = election.currentHostId
                          val hostName = if (hostId == selfId) "أنت ($userName)" else (peersMap[hostId]?.name ?: "راكب")
                          statusText.value = "متصل تلقائياً ($live) • القائد: $hostName"
                      } else {
                          statusText.value = "الربط التلقائي يعمل... افتح التطبيق في الهواتف الأخرى"
                      }
                  }

                  private fun startHeartbeatLoop() {
                      scope.launch {
                          while (isActive) {
                              runCatching {
                                  sendHeartbeatNow()
                                  val now = System.currentTimeMillis()
                                  val dead = peersMap.filterValues { now - it.lastSeenMs > 9500L }.keys
                                  if (dead.isNotEmpty()) {
                                      dead.forEach { peersMap.remove(it) }
                                  }
                                  syncPeersToCompose()
                              }.onFailure {
                                  debugLastError.value = "HB: ${it.message}"
                              }
                              delay(1200L + Random.nextLong(0L, 300L))
                          }
                      }
                  }

                  private fun startElectionLoop() {
                      scope.launch {
                          var stepDownOriginId = -1L
                          var electionTriggerMs = 0L

                          while (isActive) {
                              val now = System.currentTimeMillis()
                              val currentHost = election.currentHostId
                              val hostMissing = currentHost != selfId && !peersMap.containsKey(currentHost)

                              if (peersMap.isNotEmpty() && election.currentEpoch == 0L && chainRank == 1 && (batteryPct > 3 || isCharging) && currentHost != selfId) {
                                  promoteSelfToLeaderAndHost()
                              }

                              // Check if Leader battery is <= 3% (or severe thermal) -> Hand over to next rider immediately!
                              if (currentHost == selfId && election.shouldStepDown(batteryPct, isCharging, thermalStatus, now)) {
                                  if (electionTriggerMs == 0L && peersMap.isNotEmpty()) {
                                      val selfPeer = PeerInfo(
                                          nodeId = selfId, name = userName, chainRank = chainRank,
                                          batteryPct = batteryPct, isCharging = isCharging,
                                          thermalStatus = thermalStatus, epoch = election.currentEpoch,
                                          currentHostId = election.currentHostId, ipAddress = "",
                                          lastSeenMs = now, handshakeOk = true
                                      )
                                      val nextWinner = election.pickBestLeader(selfPeer, peersMap.values, excludeId = selfId)
                                      val reason = if (batteryPct <= 3) "البطارية أقل من 3%" else "حرارة مرتفعة"
                                      val sd = JSONObject().apply {
                                          put("t", "STEP_DOWN")
                                          put("id", selfId)
                                          put("epoch", election.currentEpoch)
                                          put("nextHostId", nextWinner?.nodeId ?: -1L)
                                          put("reason", reason)
                                      }
                                      repeat(3) {
                                          sendToAllDiscoveryTargets(sd)
                                      }
                                      if (nextWinner != null) {
                                          election.acceptHostAnnouncement(nextWinner.nodeId, election.currentEpoch + 1L)
                                          currentHostIdState.longValue = election.currentHostId
                                          currentEpochState.longValue = election.currentEpoch
                                      }
                                      // Shut down our Hotspot Group so the new Leader takes over seamlessly
                                      autoHotspot?.stepDownHostGroupNow()
                                      stepDownOriginId = selfId
                                      electionTriggerMs = now
                                      leaderChangeEvent.value = "انتقلت القيادة إلى ${nextWinner?.name ?: "الدراج التالي"} لأن بطاريتك ≤ 3%"
                                      statusText.value = "تم تسليم القيادة ($reason)"
                                  }
                              } else if (hostMissing && peersMap.isNotEmpty()) {
                                  if (electionTriggerMs == 0L) {
                                      stepDownOriginId = currentHost
                                      electionTriggerMs = now
                                  }
                              }

                              if (electionTriggerMs > 0L && now - electionTriggerMs > 1500L) {
                                  val selfPeer = PeerInfo(
                                      nodeId = selfId, name = userName, chainRank = chainRank,
                                      batteryPct = batteryPct, isCharging = isCharging,
                                      thermalStatus = thermalStatus, epoch = election.currentEpoch,
                                      currentHostId = election.currentHostId, ipAddress = "",
                                      lastSeenMs = now, handshakeOk = true
                                  )
                                  val winner = election.pickBestLeader(selfPeer, peersMap.values, excludeId = stepDownOriginId)
                                  if (winner != null && winner.nodeId == selfId) {
                                      promoteSelfToLeaderAndHost()
                                  }
                                  electionTriggerMs = 0L
                                  stepDownOriginId = -1L
                              }

                              delay(1000L)
                          }
                      }
                  }

                  private fun getAudioTargets(excludeIp: String? = null): List<InetAddress> {
                      val set = LinkedHashSet<InetAddress>()
                      val activePeers = peersMap.values.filter { it.handshakeOk && it.ipAddress.isNotEmpty() }
                      for (p in activePeers) {
                          if (p.ipAddress == excludeIp) continue
                          if (!selectAllPeers && !allowedPeerIds.contains(p.nodeId) && p.chainRank != 1 && excludeIp == null) continue
                          runCatching { set.add(InetAddress.getByName(p.ipAddress)) }
                      }
                      if (set.isEmpty() || activePeers.any { !it.isDirect }) {
                          for (t in cachedTargetIps) {
                              if (t.hostAddress != excludeIp) set.add(t)
                          }
                      }
                      return set.toList()
                  }

                  private fun startAudioEngine() {
                      try {
                          audioSocket = DatagramSocket(null).apply {
                              reuseAddress = true
                              broadcast = true
                              sendBufferSize = 65536
                              receiveBufferSize = 65536
                              trafficClass = 0xB8
                              bind(InetSocketAddress(AUDIO_PORT))
                          }
                      } catch (e: Exception) {
                          debugLastError.value = "AudioSocket: ${e.message}"
                          return
                      }

                      // RECEIVER & LOW-LATENCY JITTER-FREE PLAYER
                      scope.launch {
                          android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO)
                          val minOut = AudioTrack.getMinBufferSize(
                              SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(SAMPLES_PER_FRAME * 4)

                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(SAMPLE_RATE)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(minOut * 3)
                              .setTransferMode(AudioTrack.MODE_STREAM)
                              .build()
                          track.play()

                          val buf = ByteArray(1024)
                          val decodedShorts = ShortArray(SAMPLES_PER_FRAME)
                          var lastSample: Int = 0
                          var lastClearJob: Job? = null

                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  val sock = audioSocket ?: break
                                  sock.receive(pkt)
                                  if (pkt.length <= HEADER_SIZE || pkt.data[0] != MAGIC_AUDIO_ULAW) continue

                                  val bb = ByteBuffer.wrap(pkt.data, 0, pkt.length).order(ByteOrder.LITTLE_ENDIAN)
                                  bb.get()
                                  val senderId = bb.long
                                  if (senderId == selfId) continue
                                  val seq = bb.int
                                  val burstId = bb.int
                                  val rank = bb.get().toInt()
                                  val ttl = bb.get().toInt()
                                  val modeFlags = bb.get().toInt()

                                  val dedupKey = (senderId * 31L) xor seq.toLong()
                                  if (seenAudio.put(dedupKey, true) != null) continue

                                  val isPttTelegram = (modeFlags and 1) != 0 && burstId > 0
                                  if (isPttTelegram) {
                                      val bKey = (senderId shl 20) xor burstId.toLong()
                                      if (receivedBurstsAcked.put(bKey, System.currentTimeMillis()) == null) {
                                          sendBurstAck(senderId, burstId, pkt.address)
                                      }
                                  }

                                  if (ttl > 0 && peersMap.size > 1) {
                                      val relayCopy = pkt.data.copyOf(pkt.length)
                                      relayCopy[18] = (ttl - 1).toByte()
                                      val fromIp = pkt.address.hostAddress
                                      for (target in getAudioTargets(excludeIp = fromIp)) {
                                          runCatching {
                                              sock.send(DatagramPacket(relayCopy, relayCopy.size, target, AUDIO_PORT))
                                          }
                                      }
                                  }

                                  val allowed = selectAllPeers || allowedPeerIds.contains(senderId) || rank == 1
                                  if (allowed) {
                                      val payloadLen = (pkt.length - HEADER_SIZE).coerceAtMost(SAMPLES_PER_FRAME)
                                      for (i in 0 until payloadLen) {
                                          val uByte = pkt.data[HEADER_SIZE + i].toInt() and 0xFF
                                          val raw = ulawToLinearTable[uByte].toInt()
                                          val smoothed = ((raw * 7 + lastSample) shr 3).coerceIn(-32768, 32767)
                                          lastSample = smoothed
                                          decodedShorts[i] = smoothed.toShort()
                                      }
                                      track.write(decodedShorts, 0, payloadLen, AudioTrack.WRITE_NON_BLOCKING)

                                      val name = peersMap[senderId]?.name ?: "راكب #$rank"
                                      val modeTag = if (isPttTelegram) "⚡ برقية من" else "🎙️ يتحدث"
                                      activeSpeakerName.value = "$modeTag: $name (#$rank)"
                                      lastClearJob?.cancel()
                                      lastClearJob = scope.launch {
                                          delay(550L)
                                          activeSpeakerName.value = null
                                      }
                                  }
                              } catch (e: Exception) {
                                  if (isActive) delay(20)
                              }
                          }
                          runCatching { track.stop(); track.release() }
                      }

                      // TRANSMITTER (PTT Telegram + Red Open Mic with DC-Block & Clean u-law Compression)
                      scope.launch {
                          android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_URGENT_AUDIO)
                          val minBuf = AudioRecord.getMinBufferSize(
                              SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(SAMPLES_PER_FRAME * 4)
                          var recorder: AudioRecord? = null
                          val pcmShorts = ShortArray(SAMPLES_PER_FRAME)
                          val pktBytes = ByteArray(HEADER_SIZE + SAMPLES_PER_FRAME)

                          var prevX = 0
                          var prevY = 0

                          while (isActive) {
                              val pttNow = pttActiveInternal
                              val openMicNow = isOpenMicOn
                              val active = pttNow || openMicNow
                              if (!active) {
                                  if (recorder != null) {
                                      runCatching { recorder?.stop(); recorder?.release() }
                                      recorder = null
                                  }
                                  delay(15L)
                                  continue
                              }
                              if (recorder == null) {
                                  runCatching {
                                      recorder = AudioRecord(
                                          MediaRecorder.AudioSource.VOICE_COMMUNICATION,
                                          SAMPLE_RATE,
                                          AudioFormat.CHANNEL_IN_MONO,
                                          AudioFormat.ENCODING_PCM_16BIT,
                                          minBuf * 2
                                      ).also { rec ->
                                          if (NoiseSuppressor.isAvailable()) {
                                              runCatching { NoiseSuppressor.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          if (AcousticEchoCanceler.isAvailable()) {
                                              runCatching { AcousticEchoCanceler.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          if (AutomaticGainControl.isAvailable()) {
                                              runCatching { AutomaticGainControl.create(rec.audioSessionId)?.enabled = true }
                                          }
                                          rec.startRecording()
                                      }
                                      prevX = 0
                                      prevY = 0
                                  }.onFailure { debugLastError.value = "Mic: ${it.message}" }
                              }

                              val readSamples = recorder?.read(pcmShorts, 0, SAMPLES_PER_FRAME) ?: -1
                              if (readSamples > 0) {
                                  val seq = seqCounter.getAndIncrement()
                                  val bId = if (pttNow) currentBurstId else 0
                                  val flags: Byte = if (pttNow) 1 else 0

                                  val bb = ByteBuffer.wrap(pktBytes).order(ByteOrder.LITTLE_ENDIAN)
                                  bb.put(MAGIC_AUDIO_ULAW)
                                  bb.putLong(selfId)
                                  bb.putInt(seq)
                                  bb.putInt(bId)
                                  bb.put(chainRank.toByte())
                                  bb.put(2.toByte())
                                  bb.put(flags)

                                  for (i in 0 until readSamples) {
                                      val x = pcmShorts[i].toInt()
                                      val y = x - prevX + ((prevY * 251) shr 8)
                                      prevX = x
                                      prevY = y
                                      val boosted = ((y * 11) shr 3).coerceIn(-32600, 32600)
                                      pktBytes[HEADER_SIZE + i] = linearToUlaw(boosted)
                                  }

                                  val totalLen = HEADER_SIZE + readSamples
                                  val sock = audioSocket
                                  if (sock != null) {
                                      for (target in getAudioTargets()) {
                                          runCatching {
                                              sock.send(DatagramPacket(pktBytes, totalLen, target, AUDIO_PORT))
                                          }
                                      }
                                  }
                              }
                          }
                          runCatching { recorder?.stop(); recorder?.release() }
                      }
                  }
              }
          """)


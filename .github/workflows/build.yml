name: Build BikeMic P2P Mesh APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate temporary keystore (123456)
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bikemic \
            -storepass 123456 -keypass 123456 \
            -dname "CN=BikeMic, OU=Riders, O=BikeMic, L=Muscat, ST=Muscat, C=OM"
          test -s app/release.keystore
          echo "Temporary keystore generated."

      - name: Generate P2P Mesh project
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          cat << 'PYEOF' > /tmp/gen_bikemic_p2p.py
          import os
          import textwrap

          def write(path, content):
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          run_num = int(os.environ.get("RUN_NUM", "1") or "1")

          # =========================================================
          # 1. Gradle configuration
          # =========================================================
          write("gradle.properties", """
              org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              android.nonTransitiveRClass=true
              org.gradle.parallel=true
              org.gradle.caching=true
          """)

          write("settings.gradle", """
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "BikeMic"
              include ':app'
          """)

          write("build.gradle", """
              plugins {
                  id 'com.android.application' version '8.3.2' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              }
          """)

          write("app/build.gradle", """
              plugins {
                  id 'com.android.application'
                  id 'org.jetbrains.kotlin.android'
              }

              android {
                  namespace 'com.bikemic.app'
                  compileSdk 34

                  signingConfigs {
                      release {
                          storeFile file('release.keystore')
                          storePassword '123456'
                          keyAlias 'bikemic'
                          keyPassword '123456'
                      }
                  }

                  defaultConfig {
                      applicationId "com.bikemic.app"
                      minSdk 26
                      targetSdk 34
                      versionCode VERSION_CODE
                      versionName "VERSION_NAME"
                  }

                  buildTypes {
                      debug {
                          signingConfig signingConfigs.release
                      }
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions { jvmTarget = '17' }
                  buildFeatures { compose true }
                  composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
                  packaging {
                      resources {
                          excludes += '/META-INF/{AL2.0,LGPL2.1}'
                      }
                  }
              }

              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
                  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
                  implementation 'androidx.activity:activity-compose:1.8.2'
                  implementation platform('androidx.compose:compose-bom:2024.02.02')
                  implementation 'androidx.compose.ui:ui'
                  implementation 'androidx.compose.ui:ui-graphics'
                  implementation 'androidx.compose.material3:material3'
                  implementation 'androidx.compose.material:material-icons-extended'
                  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              }
          """.replace("VERSION_CODE", str(500 + run_num)).replace("VERSION_NAME", f"3.{run_num}"))

          write("app/proguard-rules.pro", """
              -keep class com.bikemic.app.** { *; }
          """)

          # =========================================================
          # 2. Resources & Icon
          # =========================================================
          write("app/src/main/res/values/strings.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <string name="app_name">BikeMic</string>
              </resources>
          """)

          write("app/src/main/res/values/styles.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <style name="Theme.BikeMic" parent="android:Theme.Material.NoActionBar">
                      <item name="android:statusBarColor">#000000</item>
                      <item name="android:navigationBarColor">#000000</item>
                      <item name="android:windowBackground">#000000</item>
                  </style>
              </resources>
          """)

          write("app/src/main/res/drawable/ic_launcher_background.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp"
                  android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#0B0B0B" android:pathData="M0,0h108v108h-108z"/>
                  <path android:fillColor="#181818" android:pathData="M54,54m-46,0a46,46 0,1 1,92 0a46,46 0,1 1,-92 0"/>
              </vector>
          """)

          write("app/src/main/res/drawable/ic_launcher_foreground.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp"
                  android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#FFFFFF" android:pathData="M51,21h6l2,5h-10z"/>
                  <path android:strokeColor="#E0E0E0" android:strokeWidth="2.2" android:pathData="M44,24.5 L64,24.5"/>
                  <path android:fillColor="#FFEB3B" android:pathData="M54,28m-3.2,0a3.2,3.2 0,1 1,6.4 0a3.2,3.2 0,1 1,-6.4 0"/>
                  <path android:fillColor="#BDBDBD" android:pathData="M52.3,31.2h3.4v9.5h-3.4z"/>
                  <path android:fillColor="#BDBDBD" android:pathData="M35,25h4l1.5,4h-7z"/>
                  <path android:strokeColor="#9E9E9E" android:strokeWidth="1.7" android:pathData="M31,27.5 L43,27.5"/>
                  <path android:fillColor="#FFC107" android:pathData="M37,30m-2.2,0a2.2,2.2 0,1 1,4.4 0a2.2,2.2 0,1 1,-4.4 0"/>
                  <path android:fillColor="#757575" android:pathData="M35.8,32.5h2.4v7h-2.4z"/>

                  // minBattery = 3 -> Leader hands over leadership & Hotspot automatically if battery <= 3%
                  private val election = LeaderElection(selfId, minBattery = 3)
                  private var autoHotspot: AutoMeshHotspotManager? = null
                  private var multicastLock: WifiManager.MulticastLock? = null

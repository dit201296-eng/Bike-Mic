                          Manifest.permission.ACCESS_COARSE_LOCATION
                      )
                      if (Build.VERSION.SDK_INT >= 33) p.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                      return p.toTypedArray()
                  }

                  private val permLauncher = registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { result ->
                      val audio = result[Manifest.permission.RECORD_AUDIO] == true ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                      if (!audio) {
                          Toast.makeText(this, "صلاحية المايك إلزامية للتشغيل.", Toast.LENGTH_LONG).show()
                          finishAffinity()
                      } else {
                          permissionsGranted.value = true
                          startAll()
                      }
                  }

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      val prefs = getSharedPreferences("bikemic_p2p", Context.MODE_PRIVATE)

                      val missing = requiredPermissions().any {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }
                      if (!missing) {
                          permissionsGranted.value = true
                          startAll()
                      } else {
                          permLauncher.launch(requiredPermissions())
                      }

                      setContent {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              MaterialTheme(colorScheme = darkColorScheme(background = Color.Black, surface = Color(0xFF121212))) {
                                  Surface(modifier = Modifier.fillMaxSize(), color = Color.Black) {
                                      if (permissionsGranted.value && engine != null) {
                                          val ctx = LocalContext.current
                                          LaunchedEffect(Unit) {
                                              while (true) {
                                                  engine?.leaderChangeEvent?.value?.let { msg ->
                                                      Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show()
                                                      engine?.leaderChangeEvent?.value = null
                                                  }
                                                  delay(500L)
                                              }
                                          }
                                          BikeMicScreen(
                                              engine = engine!!,
                                              initialName = prefs.getString("name", "أبو ناصر") ?: "أبو ناصر",
                                              initialRank = prefs.getInt("rank", 1),
                                              onSave = { n, r ->
                                                  prefs.edit().putString("name", n).putInt("rank", r).apply()
                                              }
                                          )
                                      } else {
                                          Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                                  CircularProgressIndicator(color = Color.Red)
                                                  Spacer(Modifier.height(16.dp))
                                                  Text("الرجاء منح الصلاحيات للبدء...", color = Color.White)
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  private fun startAll() {
                      if (engine == null) {
                          val prefs = getSharedPreferences("bikemic_p2p", Context.MODE_PRIVATE)
                          val e = MeshVoiceEngine(this).apply {
                              userName = prefs.getString("name", "أبو ناصر") ?: "أبو ناصر"
                              chainRank = prefs.getInt("rank", 1)
                          }
                          engine = e
                          health = DeviceHealthMonitor(this) { bat, chg, thm ->
                              e.updateHealth(bat, chg, thm)
                          }.also { it.start() }
                          e.start()
                      }
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      if (isFinishing) {
                          engine?.stop()
                          health?.stop()
                      }
                  }
              }

              @Composable
              fun BikeMicScreen(
                  engine: MeshVoiceEngine,
                  initialName: String,
                  initialRank: Int,
                  onSave: (String, Int) -> Unit
              ) {
                  var name by remember { mutableStateOf(initialName) }
                  var rank by remember { mutableIntStateOf(initialRank) }
                  var editing by remember { mutableStateOf(false) }
                  var ptt by remember { mutableStateOf(false) }
                  var micOn by remember { mutableStateOf(false) }
                  var showUsers by remember { mutableStateOf(false) }
                  var showRankDlg by remember { mutableStateOf(false) }
                  var showInfo by remember { mutableStateOf(false) }
                  var selectAll by remember { mutableStateOf(true) }
                  val selected = remember { mutableStateListOf<Long>() }

                  val peers = remember { mutableStateListOf<PeerInfo>() }
                  val ver by engine.peersVersion
                  val connected by engine.connectedCount
                  val status by engine.statusText
                  val speaker by engine.activeSpeakerName
                  val hostId by engine.currentHostIdState
                  val epoch by engine.currentEpochState
                  val sent by engine.debugSentCount
                  val received by engine.debugReceivedCount
                  val lastErr by engine.debugLastError

                  LaunchedEffect(ver) {
                      val list = engine.peersMap.values.sortedBy { it.chainRank }
                      peers.clear()
                      peers.addAll(list)
                  }

                  val isHost = hostId == engine.selfId
                  val pttColor by animateColorAsState(
                      if (ptt) Color(0xFFBDBDBD) else Color(0xFF222222), label = "p"
                  )
                  val micColor by animateColorAsState(
                      if (micOn) Color(0xFFFF3B30) else Color(0xFF5C0A0A), label = "m"
                  )

                  Box(
                      Modifier.fillMaxSize().background(Color.Black)
                          .padding(horizontal = 16.dp, vertical = 14.dp)
                  ) {
                      Row(
                          Modifier.fillMaxWidth().align(Alignment.TopCenter),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Button(
                              onClick = { showUsers = true },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1C1C1E)),
                              shape = RoundedCornerShape(12.dp),
                              contentPadding = PaddingValues(horizontal = 12.dp, vertical = 8.dp)
                          ) {
                              Icon(
                                  Icons.Default.Groups, null,
                                  tint = if (connected > 0) Color(0xFF32D74B) else Color(0xFFFF453A)
                              )
                              Spacer(Modifier.width(6.dp))
                              Text("متصلون ($connected)", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                          }

                          Row(verticalAlignment = Alignment.CenterVertically) {
                              IconButton(onClick = { showInfo = true }) {
                                  Icon(
                                      Icons.Default.Info,
                                      contentDescription = "معلومات وتشخيص",
                                      tint = if (isHost) Color(0xFFFFD60A) else Color(0xFF8E8E93)
                                  )
                              }
                              OutlinedButton(
                                  onClick = { showRankDlg = true },
                                  shape = RoundedCornerShape(12.dp),
                                  contentPadding = PaddingValues(horizontal = 10.dp, vertical = 8.dp)
                              ) {
                                  Text(
                                      "راكب #$rank",
                                      color = if (rank == 1) Color(0xFFFFD60A) else Color.LightGray,
                                      fontWeight = FontWeight.Bold, fontSize = 13.sp
                                  )
                              }
                          }
                      }

                      Column(
                          Modifier.fillMaxWidth().align(Alignment.TopCenter).padding(top = 56.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          if (editing) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  OutlinedTextField(
                                      value = name, onValueChange = { name = it },
                                      singleLine = true,
                                      textStyle = TextStyle(color = Color.White, fontSize = 16.sp, textAlign = TextAlign.Center),
                                      modifier = Modifier.width(220.dp)
                                  )
                                  IconButton(onClick = {
                                      editing = false
                                      engine.updateUser(name, rank)
                                      onSave(name, rank)
                                  }) {
                                      Icon(Icons.Default.Check, null, tint = Color(0xFF32D74B))
                                  }
                              }
                          } else {
                              Row(
                                  Modifier.clip(RoundedCornerShape(8.dp))
                                      .clickable { editing = true }
                                      .padding(horizontal = 12.dp, vertical = 4.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(name, color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.width(6.dp))
                                  Icon(Icons.Default.Edit, null, tint = Color.Gray, modifier = Modifier.size(16.dp))
                              }
                          }

                          Text(
                              if (isHost) "أنت القائد • Epoch $epoch" else "خلف القائد (Epoch $epoch)",
                              color = if (isHost) Color(0xFFFFD60A) else Color(0xFF8E8E93),
                              fontSize = 12.sp
                          )
                          Text(
                              "بطارية: ${engine.batteryPct}%${if (engine.isCharging) " ⚡" else ""} • حرارة: ${thermalLabel(engine.thermalStatus)}",
                              color = Color(0xFF636366), fontSize = 11.sp
                          )

                          Spacer(Modifier.height(6.dp))
                          if (speaker != null) {
                              Text("يتحدث: $speaker", color = Color(0xFF32D74B), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                          } else {
                              Text(status, color = if (connected > 0) Color(0xFF32D74B) else Color(0xFFFF9F0A), fontSize = 12.sp)
                          }
                      }

                      Column(
                          Modifier.align(Alignment.Center).padding(top = 60.dp),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Box(
                              Modifier.size(230.dp).clip(CircleShape)
                                  .background(pttColor)
                                  .border(3.dp, if (ptt) Color.White else Color(0xFF3A3A3C), CircleShape)
                                  .pointerInput(Unit) {
                                      detectTapGestures(
                                          onPress = {
                                              ptt = true
                                              engine.isPttPressed = true
                                              tryAwaitRelease()
                                              ptt = false
                                              engine.isPttPressed = false
                                          }
                                      )
                                  },
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Icon(
                                      Icons.Default.Bolt, null,
                                      tint = if (ptt) Color.Black else Color(0xFF9E9E9E),
                                      modifier = Modifier.size(64.dp)
                                  )
                                  Text(
                                      if (ptt) "جاري إرسال البرقية..." else "اضغط مطولاً للبرقية",
                                      color = if (ptt) Color.Black else Color(0xFFB0B0B0),
                                      fontSize = 15.sp, fontWeight = FontWeight.Bold
                                  )
                              }
                          }
                          Spacer(Modifier.height(34.dp))
                          Box(
                              Modifier.size(92.dp).clip(CircleShape)
                                  .background(micColor)
                                  .border(2.dp, if (micOn) Color(0xFFFF8A80) else Color(0xFF8B0000), CircleShape)
                                  .clickable { micOn = !micOn; engine.isOpenMicOn = micOn },
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  if (micOn) Icons.Default.Mic else Icons.Default.MicOff,
                                  null, tint = Color.White, modifier = Modifier.size(42.dp)
                              )
                          }
                          Spacer(Modifier.height(10.dp))
                          Text(
                              if (micOn) "اتصال صوتي مباشر مفتوح" else "المايك مطفأ",
                              color = if (micOn) Color(0xFFFF453A) else Color(0xFF636366),
                              fontSize = 13.sp, fontWeight = FontWeight.SemiBold
                          )
                      }

                      if (showUsers) {
                          AlertDialog(
                              onDismissRequest = { showUsers = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("الدراجون المتصلون (${peers.count { it.handshakeOk }})", color = Color.White, fontWeight = FontWeight.Bold) },
                              text = {
                                  Column {
                                      Row(
                                          Modifier.fillMaxWidth().clickable {
                                              selectAll = !selectAll
                                              engine.selectAllPeers = selectAll
                                              if (selectAll) peers.forEach { selected.add(it.nodeId); engine.allowedPeerIds.add(it.nodeId) }
                                          }.padding(vertical = 6.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Checkbox(checked = selectAll, onCheckedChange = { c ->
                                              selectAll = c; engine.selectAllPeers = c
                                              if (c) peers.forEach { selected.add(it.nodeId); engine.allowedPeerIds.add(it.nodeId) }
                                          })
                                          Text("ضم الكل في البرقيات والمكالمات", color = Color.White, fontSize = 13.sp)
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Spacer(Modifier.height(8.dp))
                                      if (peers.isEmpty()) {
                                          Text(
                                              "لا يوجد دراجون بعد. افتح نقطة اتصال (Hotspot) في هاتف واحد واتصل بها من بقية الهواتف.",
                                              color = Color.Gray, fontSize = 13.sp
                                          )
                                      } else {
                                          LazyColumn(Modifier.heightIn(max = 280.dp)) {
                                              items(peers) { p ->
                                                  val isHostP = p.nodeId == hostId
                                                  val checked = selectAll || selected.contains(p.nodeId)
                                                  Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                                                      Checkbox(checked = checked, onCheckedChange = { c ->
                                                          selectAll = false; engine.selectAllPeers = false
                                                          if (c) { selected.add(p.nodeId); engine.allowedPeerIds.add(p.nodeId) }
                                                          else { selected.remove(p.nodeId); engine.allowedPeerIds.remove(p.nodeId) }
                                                      })
                                                      Column(Modifier.weight(1f)) {
                                                          Text(
                                                              "راكب ${p.chainRank}: ${p.name}" + if (isHostP) " ⭐" else "",
                                                              color = if (isHostP) Color(0xFFFFD60A) else Color.White,
                                                              fontWeight = FontWeight.Bold, fontSize = 14.sp
                                                          )
                                                          Text(
                                                              "IP: ${p.ipAddress} • بطارية ${p.batteryPct}% • ${thermalLabel(p.thermalStatus)}",
                                                              color = Color(0xFF32D74B),
                                                              fontSize = 11.sp
                                                          )
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showUsers = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))
                                  ) { Text("تم", color = Color.White) }
                              }
                          )
                      }

                      if (showRankDlg) {
                          AlertDialog(
                              onDismissRequest = { showRankDlg = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("ترتيبك في السلسلة", color = Color.White) },
                              text = {
                                  LazyColumn(Modifier.height(280.dp)) {
                                      items((1..12).toList()) { num ->
                                          val label = if (num == 1) "1 = قائد السلسلة" else "$num (خلف ${num - 1}، أمام ${num + 1})"
                                          TextButton(
                                              onClick = {
                                                  rank = num; engine.updateUser(name, num); onSave(name, num)
                                                  showRankDlg = false
                                              },
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text(label, color = if (rank == num) Color(0xFFFF453A) else Color.White,
                                                   fontWeight = if (rank == num) FontWeight.Bold else FontWeight.Normal)
                                          }
                                      }
                                  }
                              },
                              confirmButton = {
                                  TextButton(onClick = { showRankDlg = false }) { Text("إغلاق", color = Color.Gray) }
                              }
                          )
                      }

                      if (showInfo) {
                          val ifaces = remember(sent, ver) { engine.getDebugInterfaces() }
                          val bcasts = remember(sent, ver) { engine.getDebugBroadcasts() }
                          AlertDialog(
                              onDismissRequest = { showInfo = false },
                              containerColor = Color(0xFF1C1C1E),
                              title = { Text("تشخيص الشبكة الحي", color = Color.White, fontWeight = FontWeight.Bold) },
                              text = {
                                  Column(
                                      modifier = Modifier.heightIn(max = 360.dp).verticalScroll(rememberScrollState()),
                                      verticalArrangement = Arrangement.spacedBy(5.dp)
                                  ) {
                                      Text("معرفك: ${engine.selfId}", color = Color.Gray, fontSize = 11.sp)
                                      Text("القائد: ${if (isHost) "أنت" else (peers.find { it.nodeId == hostId }?.name ?: "غير معروف")} (Epoch $epoch)", color = Color.White, fontSize = 12.sp)
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("واجهات الشبكة النشطة:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      if (ifaces.isEmpty()) {
                                          Text("لا توجد واجهة واي فاي/هوتسبوت نشطة!", color = Color.Red, fontSize = 12.sp)
                                      } else {
                                          ifaces.forEach { (ifName, ip) ->
                                              Text("• $ifName: $ip", color = Color.White, fontSize = 12.sp)
                                          }
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("الأهداف النشطة (Unicast / Gateway / Broadcast):", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      bcasts.forEach { b ->
                                          Text("• $b", color = Color.LightGray, fontSize = 11.sp)
                                      }
                                      HorizontalDivider(color = Color.DarkGray)
                                      Text("إحصائيات حقيقية (بدون صدى جهازك):", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                      Text("• حزم أُرسلت: $sent", color = Color.White, fontSize = 12.sp)
                                      Text("• حزم مستلمة من أقران آخرين: $received", color = Color.White, fontSize = 12.sp)
                                      Text("• دراجون متصلون الآن: ${peers.size}", color = Color.White, fontSize = 12.sp)
                                      Text("• آخر حالة نظام: $lastErr", color = Color(0xFFFF9F0A), fontSize = 11.sp)
                                  }
                              },
                              confirmButton = {
                                  Button(
                                      onClick = { showInfo = false },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF32D74B))
                                  ) { Text("إغلاق", color = Color.Black) }
                              }
                          )
                      }
                  }
              }

              fun thermalLabel(t: Int): String = when (t) {
                  DeviceHealthMonitor.THERMAL_NONE -> "طبيعي"
                  DeviceHealthMonitor.THERMAL_LIGHT -> "خفيف"
                  DeviceHealthMonitor.THERMAL_MODERATE -> "متوسط"
                  DeviceHealthMonitor.THERMAL_SEVERE -> "مرتفع ⚠️"
                  else -> "حرج 🚨"
              }
          """)

          print("BikeMic P2P Mesh project generated successfully.")
          PYEOF
          python3 /tmp/gen_bikemic_p2p.py

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          echo "APK size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMic-P2P-Mesh-Fixed-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

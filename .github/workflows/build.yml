                  <path android:strokeColor="#9E9E9E" android:strokeWidth="1.7" android:pathData="M65,27.5 L77,27.5"/>
                  <path android:fillColor="#FFC107" android:pathData="M71,30m-2.2,0a2.2,2.2 0,1 1,4.4 0a2.2,2.2 0,1 1,-4.4 0"/>
                  <path android:fillColor="#757575" android:pathData="M69.8,32.5h2.4v7h-2.4z"/>
                  <path android:fillColor="#D32F2F" android:pathData="M54,54m-12,0a12,12 0,1 1,24 0a12,12 0,1 1,-24 0"/>

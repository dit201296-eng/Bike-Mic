                                      if (peers.isEmpty()) Text("لا يوجد أحد بعد. اتصل بنفس الهوتسبوت.", color = Color.Gray, fontSize = 13.sp)
                                      else LazyColumn(Modifier.heightIn(max = 280.dp)) {
                                          items(peers) { p ->
                                              val checked = selectAll || selected.contains(p.nodeId)
                                              Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                                                  Checkbox(checked = checked, onCheckedChange = { c -> selectAll = false; engine.selectAllPeers = false; if (c) { selected.add(p.nodeId); engine.allowedPeerIds.add(p.nodeId) } else { selected.remove(p.nodeId); engine.allowedPeerIds.remove(p.nodeId) } })
                                                  Column(Modifier.weight(1f)) {
                                                      Text("راكب ${p.chainRank}: ${p.name}" + if (p.nodeId == hostId) " ⭐" else "", color = if (p.nodeId == hostId) Color(0xFFFFD60A) else Color.White, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                                      Text("IP: ${p.ipAddress} • بطارية ${p.batteryPct}%", color = Color(0xFF32D74B), fontSize = 11.sp)
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }, confirmButton = { Button(onClick = { showUsers = false }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD32F2F))) { Text("تم", color = Color.White) } })
                      }

                      if (showRankDlg) {
                          AlertDialog(onDismissRequest = { showRankDlg = false }, containerColor = Color(0xFF1C1C1E),
                              title = { Text("ترتيبك", color = Color.White) },
                              text = { LazyColumn(Modifier.height(280.dp)) { items((1..12).toList()) { num -> TextButton(onClick = { rank = num; engine.updateUser(name, num); onSave(name, num); showRankDlg = false }, modifier = Modifier.fillMaxWidth()) { Text(if (num == 1) "1 = قائد السلسلة" else "$num (خلف ${num - 1})", color = if (rank == num) Color(0xFFFF453A) else Color.White, fontWeight = if (rank == num) FontWeight.Bold else FontWeight.Normal) } } } },
                              confirmButton = { TextButton(onClick = { showRankDlg = false }) { Text("إغلاق", color = Color.Gray) } })
                      }

                      if (showInfo) {
                          val ifaces = remember(sent, ver) { engine.getDebugInterfaces() }
                          val bcasts = remember(sent, ver) { engine.getDebugBroadcasts() }
                          AlertDialog(onDismissRequest = { showInfo = false }, containerColor = Color(0xFF1C1C1E),
                              title = { Text("تشخيص الشبكة", color = Color.White) },
                              text = { Column(Modifier.heightIn(max = 360.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(5.dp)) {
                                  Text("معرفك: ${engine.selfId}", color = Color.Gray, fontSize = 11.sp)
                                  HorizontalDivider(color = Color.DarkGray)
                                  Text("واجهات الشبكة:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                  if (ifaces.isEmpty()) Text("لا توجد واجهات!", color = Color.Red, fontSize = 12.sp) else ifaces.forEach { (n, ip) -> Text("• $n: $ip", color = Color.White, fontSize = 12.sp) }
                                  HorizontalDivider(color = Color.DarkGray)
                                  Text("أهداف البث:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                  bcasts.forEach { b -> Text("• $b", color = Color.White, fontSize = 11.sp) }
                                  HorizontalDivider(color = Color.DarkGray)
                                  Text("إحصائيات:", color = Color(0xFF32D74B), fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                  Text("• حزم أُرسلت: $sent", color = Color.White, fontSize = 12.sp)
                                  Text("• حزم مستلمة: $received", color = Color.White, fontSize = 12.sp)
                                  Text("• أقران: ${peers.size}", color = Color.White, fontSize = 12.sp)
                                  Text("• الخطأ: $lastErr", color = Color(0xFFFF9F0A), fontSize = 11.sp)
                              } },
                              confirmButton = { Button(onClick = { showInfo = false }, colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF32D74B))) { Text("فهمت", color = Color.Black) } })
                      }
                  }
              }

              fun thermalLabel(t: Int): String = when (t) {
                  DeviceHealthMonitor.THERMAL_NONE -> "طبيعي"
                  DeviceHealthMonitor.THERMAL_LIGHT -> "خفيف"
                  DeviceHealthMonitor.THERMAL_MODERATE -> "متوسط"
                  DeviceHealthMonitor.THERMAL_SEVERE -> "مرتفع ⚠️"
                  else -> "حرج 🚨"
              }
          """)
          PYEOF
          python3 /tmp/gen_bikemic_full.py

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeMic-Full-Pro-APK
          path: app/build/outputs/apk/release/app-release.apk

                          Manifest.permission.ACCESS_WIFI_STATE,
                          Manifest.permission.CHANGE_WIFI_STATE,
                          Manifest.permission.CHANGE_WIFI_MULTICAST_STATE,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      )
                      if (Build.VERSION.SDK_INT >= 33) p.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                      return p.toTypedArray()
                  }

                  private val permLauncher = registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { result ->
                      val audio = result[Manifest.permission.RECORD_AUDIO] == true
                      if (!audio) {
                          Toast.makeText(this, "صلاحية المايك إلزامية. سيتم الإغلاق.", Toast.LENGTH_LONG).show()
                          finishAffinity()
                      } else {
                          permissionsGranted.value = true
                          startAll()
                      }
                  }

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      val prefs = getSharedPreferences("bikemic_p2p", Context.MODE_PRIVATE)

                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                          permissionsGranted.value = true
                          startAll()
                      } else {
                          permLauncher.launch(requiredPermissions())
                      }

                      setContent {
                          CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                              MaterialTheme(colorScheme = darkColorScheme(background = Color.Black, surface = Color(0xFF121212))) {

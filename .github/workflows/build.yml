                      private const val SAMPLES_PER_FRAME = 320
                      private const val MAGIC_AUDIO_ULAW: Byte = 0x43
                      private const val HEADER_SIZE = 20
                  }

                  val selfId: Long = Random.nextLong(100_000L, Long.MAX_VALUE)
                  @Volatile var userName: String = "أبو ناصر"
                  @Volatile var chainRank: Int = 1
                  @Volatile var isOpenMicOn: Boolean = false
                  @Volatile var selectAllPeers: Boolean = true
                  val allowedPeerIds: MutableSet<Long> = Collections.newSetFromMap(ConcurrentHashMap())


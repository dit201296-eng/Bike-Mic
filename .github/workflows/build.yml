Name: Build BikeMic Live Audio APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Prepare Android SDK & Local Properties
      run: |
        export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        mkdir -p "$ANDROID_SDK_ROOT/licenses"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license" || true
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Generate Complete BikeMic Live App Structure
      run: |
        mkdir -p app/src/main/java/com/bikemic/app app/src/main/res/values app/src/main/res/layout
        
        # 1. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.bikemic.app">

            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="BikeMic"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. build.gradle (Module: app)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.bikemic.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.bikemic.app"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.ui:ui-graphics'
            implementation 'androidx.compose.ui:ui-tooling-preview'
            implementation 'androidx.compose.material:material'
            implementation 'androidx.compose.material:material-icons-extended'
        }
        EOF

        # 3. build.gradle (Project level)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # 4. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "BikeMic"
        include ':app'
        EOF

        # 5. MainActivity.kt (التحكم المباشر بالصوت وزر البرقية ونظام الـ UDP المباشر)
        cat << 'EOF' > app/src/main/java/com/bikemic/app/MainActivity.kt
        package com.bikemic.app

        import android.Manifest
        import android.content.pm.PackageManager
        import android.media.AudioAttributes
        import android.media.AudioFormat
        import android.media.AudioRecord
        import android.media.AudioTrack
        import android.media.MediaRecorder
        import android.os.Bundle
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.animation.animateColorAsState
        import androidx.compose.foundation.background
        import androidx.compose.foundation.gestures.detectTapGestures
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material.*
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.Group
        import androidx.compose.material.icons.filled.Mic
        import androidx.compose.material.icons.filled.Settings
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.input.pointer.pointerInput
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.core.content.ContextCompat
        import kotlinx.coroutines.*
        import java.net.DatagramPacket
        import java.net.DatagramSocket
        import java.net.InetAddress

        class MainActivity : ComponentActivity() {

            private val requiredPermissions = arrayOf(
                Manifest.permission.ACCESS_FINE_LOCATION,
                Manifest.permission.RECORD_AUDIO,
                Manifest.permission.NEARBY_WIFI_DEVICES,
                Manifest.permission.MODIFY_AUDIO_SETTINGS
            )

            private val permissionLauncher = registerForActivityResult(
                ActivityResultContracts.RequestMultiplePermissions()
            ) { permissions ->
                val allGranted = permissions.entries.all { it.value }
                if (!allGranted) {
                    Toast.makeText(this, "عذراً، رفض الصلاحيات ينهي البرنامج فوراً", Toast.LENGTH_LONG).show()
                    finish()
                }
            }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                if (!hasPermissions()) {
                    permissionLauncher.launch(requiredPermissions)
                }
                setContent {
                    Surface(modifier = Modifier.fillMaxSize(), color = Color.Black) {
                        MainScreen()
                    }
                }
            }

            private fun hasPermissions(): Boolean {
                return requiredPermissions.all {
                    ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
                }
            }
        }

        @Composable
        fun MainScreen() {
            var username by remember { mutableStateOf("قائد السلسلة (أبو ناصر)") }
            var isTransmitting by remember { mutableStateOf(false) }
            var micActive by remember { mutableStateOf(false) }
            var showUsersDialog by remember { mutableStateOf(false) }
            
            val connectedPeers = remember { mutableStateOf(listOf("الراكب 2", "الراكب 3", "مؤخرة السلسلة")) }

            val buttonColor by animateColorAsState(
                targetValue = if (isTransmitting) Color.LightGray else Color.DarkGray,
                label = "PTTColor"
            )

            // إعداد دفق الصوت الحي والمباشر عبر UDP (منخفض التأخير Low-Latency)
            LaunchedEffect(isTransmitting) {
                if (isTransmitting) {
                    withContext(Dispatchers.IO) {
                        val sampleRate = 8000
                        val channelConfig = AudioFormat.CHANNEL_IN_MONO
                        val audioFormat = AudioFormat.ENCODING_PCM_16BIT
                        val bufferSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioFormat)
                        
                        try {
                            val audioRecord = AudioRecord(
                                MediaRecorder.AudioSource.MIC,
                                sampleRate,
                                channelConfig,
                                audioFormat,
                                bufferSize
                            )
                            val socket = DatagramSocket()
                            val broadcastInetAddress = InetAddress.getByName("255.255.255.255")
                            val buffer = ByteArray(bufferSize)
                            
                            audioRecord.startRecording()
                            while (isActive && isTransmitting) {
                                val read = audioRecord.read(buffer, 0, buffer.size)
                                if (read > 0) {
                                    val packet = DatagramPacket(buffer, read, broadcastInetAddress, 50005)
                                    socket.send(packet)
                                }
                            }
                            audioRecord.stop()
                            audioRecord.release()
                            socket.close()
                        } catch (e: Exception) {
                            e.printStackTrace()
                        }
                    }
                }
            }

            // استقبال الصوت الحي بشكل دائم ومستمر بدون تقطيع
            DisposableEffect(Unit) {
                val sampleRate = 8000
                val channelConfig = AudioFormat.CHANNEL_OUT_MONO
                val audioFormat = AudioFormat.ENCODING_PCM_16BIT
                val bufferSize = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, audioFormat)

                val receiveJob = CoroutineScope(Dispatchers.IO).launch {
                    try {
                        val socket = DatagramSocket(50005)
                        socket.broadcast = true
                        val buffer = ByteArray(bufferSize)
                        val audioTrack = AudioTrack.Builder()
                            .setAudioAttributes(
                                AudioAttributes.Builder()
                                    .setUsage(AudioAttributes.USAGE_MEDIA)
                                    .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                    .build()
                            )
                            .setAudioFormat(
                                AudioFormat.Builder()
                                    .setEncoding(audioFormat)
                                    .setSampleRate(sampleRate)
                                    .setChannelMask(channelConfig)
                                    .build()
                            )
                            .setBufferSizeInBytes(bufferSize)
                            .setTransferMode(AudioTrack.MODE_STREAM)
                            .build()
                        
                        audioTrack.play()

                        while (isActive) {
                            val packet = DatagramPacket(buffer, buffer.size)
                            socket.receive(packet)
                            audioTrack.write(packet.data, 0, packet.length)
                        }
                    } catch (e: Exception) {
                        e.printStackTrace()
                    }
                }

                onDispose {
                    receiveJob.cancel()
                }
            }

            Box(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                Row(
                    modifier = Modifier.fillMaxWidth().align(Alignment.TopCenter),
                    horizontalArrangement = Arrangement.SpaceBetween,
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    IconButton(onClick = { showUsersDialog = true }) {
                        Icon(Icons.Default.Group, contentDescription = "المستخدمين", tint = Color.Red)
                    }

                    OutlinedTextField(
                        value = username,
                        onValueChange = { username = it },
                        modifier = Modifier.width(180.dp).height(50.dp),
                        textStyle = LocalTextStyle.current.copy(color = Color.White, fontSize = 13.sp),
                        shape = RoundedCornerShape(8.dp)
                    )

                    IconButton(onClick = {}) {
                        Icon(Icons.Default.Settings, contentDescription = "إعدادات", tint = Color.LightGray)
                    }
                }

                Column(
                    modifier = Modifier.align(Alignment.Center),
                    horizontalAlignment = Alignment.CenterHorizontally
                ) {
                    Text("BIKE MIC - MESH", color = Color.Red, fontWeight = FontWeight.Bold, fontSize = 22.sp)
                    Spacer(modifier = Modifier.height(6.dp))
                    Text("اتصال مباشر ونقي بين الدراجات", color = Color.Gray, fontSize = 12.sp)

                    Spacer(modifier = Modifier.height(50.dp))

                    // زر البرقية (PTT) - اضغط باستمرار للتحدث بشكل مباشر
                    Box(
                        modifier = Modifier
                            .size(230.dp)
                            .clip(CircleShape)
                            .background(buttonColor)
                            .pointerInput(Unit) {
                                detectTapGestures(
                                    onPress = {
                                        isTransmitting = true
                                        micActive = true
                                        tryAwaitRelease()
                                        isTransmitting = false
                                        micActive = false
                                    }
                                )
                            },
                        contentAlignment = Alignment.Center
                    ) {
                        Column(horizontalAlignment = Alignment.CenterHorizontally) {
                            Icon(
                                imageVector = Icons.Default.Mic,
                                contentDescription = "الميكروفون",
                                tint = if (micActive) Color(0xFFFF5252) else Color(0xFF8B0000),
                                modifier = Modifier.size(75.dp)
                            )
                            Spacer(modifier = Modifier.height(8.dp))
                            Text(
                                text = if (isTransmitting) "جاري البث المباشر..." else "اضغط باستمرار للتحدث",
                                color = if (isTransmitting) Color.Black else Color.LightGray,
                                fontWeight = FontWeight.Bold,
                                fontSize = 13.sp
                            )
                        }
                    }
                }

                Text(
                    text = "الحالة: جاهز للإرسال والاستقبال المباشر",
                    color = Color.DarkGray,
                    fontSize = 11.sp,
                    modifier = Modifier.align(Alignment.BottomCenter).padding(bottom = 16.dp)
                )

                if (showUsersDialog) {
                    AlertDialog(
                        onDismissRequest = { showUsersDialog = false },
                        title = { Text("أعضاء سلسلة الدراجات", color = Color.White) },
                        text = {
                            Column {
                                connectedPeers.value.forEach { peer ->
                                    Text("• $peer (متصل وجاهز للحديث)", color = Color.White, modifier = Modifier.padding(vertical = 4.dp))
                                }
                            }
                        },
                        confirmButton = {
                            Button(onClick = { showUsersDialog = false }) { Text("تم") }
                        },
                        backgroundColor = Color.DarkGray
                    )
                }
            }
        }
        EOF

        # ملفات مساعدة للتهيئة
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        echo '<resources></resources>' > app/src/main/res/values/strings.xml
        echo '<resources></resources>' > app/src/main/res/values/styles.xml
        echo 'gradle.version=8.7' > gradle.properties
        EOF

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Verify APK Output
      run: |
        ls -la app/build/outputs/apk/debug/
        test -f app/build/outputs/apk/debug/app-debug.apk
        echo "APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BikeMic-Live-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

name: Build BikeMic P2P Mesh APK (Auto-Connect + HD Audio + LockScreen + ACK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean workspace from old files
        run: |
          rm -rf app build gradle settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate temporary keystore (123456)
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bikemic \
            -storepass 123456 -keypass 123456 \
            -dname "CN=BikeMic, OU=Riders, O=BikeMic, L=Muscat, ST=Muscat, C=OM"
          test -s app/release.keystore
          echo "Temporary keystore generated."

      - name: Generate P2P Mesh project with Zero-Touch Auto-Hotspot, 3% Handover, LockScreen & ACK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          cat << 'PYEOF' > /tmp/gen_bikemic_p2p.py
          import os
          import textwrap

          def write(path, content):
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          run_num = int(os.environ.get("RUN_NUM", "1") or "1")

          # =========================================================
          # 1. Gradle configuration
          # =========================================================
          write("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              android.nonTransitiveRClass=true
              org.gradle.parallel=true
              org.gradle.caching=true
          """)

          write("settings.gradle", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "BikeMic"
              include ':app'
          """)

          write("build.gradle", r"""
              plugins {
                  id 'com.android.application' version '8.3.2' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              }
          """)

          write("app/build.gradle", r"""
              plugins {
                  id 'com.android.application'
                  id 'org.jetbrains.kotlin.android'
              }

              android {
                  namespace 'com.bikemic.app'
                  compileSdk 34

                  signingConfigs {
                      release {
                          storeFile file('release.keystore')
                          storePassword '123456'
                          keyAlias 'bikemic'
                          keyPassword '123456'
                      }
                  }

                  defaultConfig {
                      applicationId "com.bikemic.app"
                      minSdk 26
                      targetSdk 34
                      versionCode VERSION_CODE
                      versionName "VERSION_NAME"
                  }

                  buildTypes {
                      debug {
                          signingConfig signingConfigs.release
                      }
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                          shrinkResources false
                      }
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions { jvmTarget = '17' }
                  buildFeatures { compose true }
                  composeOptions { kotlinCompilerExtensionVersion = '1.5.8' }
                  packaging {
                      resources {
                          excludes += '/META-INF/{AL2.0,LGPL2.1}'
                      }
                  }
              }

              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
                  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
                  implementation 'androidx.activity:activity-compose:1.8.2'
                  implementation platform('androidx.compose:compose-bom:2024.02.02')
                  implementation 'androidx.compose.ui:ui'
                  implementation 'androidx.compose.ui:ui-graphics'
                  implementation 'androidx.compose.material3:material3'
                  implementation 'androidx.compose.material:material-icons-extended'
                  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              }
          """.replace("VERSION_CODE", str(1000 + run_num)).replace("VERSION_NAME", f"7.{run_num}"))

          write("app/proguard-rules.pro", r"""
              -keep class com.bikemic.app.** { *; }
          """)

          # =========================================================
          # 2. Resources & Icon
          # =========================================================
          write("app/src/main/res/values/strings.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <string name="app_name">BikeMic</string>
              </resources>
          """)

          write("app/src/main/res/values/styles.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <style name="Theme.BikeMic" parent="android:Theme.Material.NoActionBar">
                      <item name="android:statusBarColor">#000000</item>
                      <item name="android:navigationBarColor">#000000</item>
                      <item name="android:windowBackground">#000000</item>
                  </style>
              </resources>
          """)

          write("app/src/main/res/drawable/ic_launcher_background.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp"
                  android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#0B0B0B" android:pathData="M0,0h108v108h-108z"/>
                  <path android:fillColor="#181818" android:pathData="M54,54m-46,0a46,46 0,1 1,92 0a46,46 0,1 1,-92 0"/>
              </vector>
          """)

          write("app/src/main/res/drawable/ic_launcher_foreground.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp" android:height="108dp"
                  android:viewportWidth="108" android:viewportHeight="108">
                  <path android:fillColor="#FFFFFF" android:pathData="M51,21h6l2,5h-10z"/>
                  <path android:strokeColor="#E0E0E0" android:strokeWidth="2.2" android:pathData="M44,24.5 L64,24.5"/>
                  <path android:fillColor="#FFEB3B" android:pathData="M54,28m-3.2,0a3.2,3.2 0,1 1,6.4 0a3.2,3.2 0,1 1,-6.4 0"/>
                  <path android:fillColor="#BDBDBD" android:pathData="M52.3,31.2h3.4v9.5h-3.4z"/>
                  <path android:fillColor="#BDBDBD" android:pathData="M35,25h4l1.5,4h-7z"/>
                  <path android:strokeColor="#9E9E9E" android:strokeWidth="1.7" android:pathData="M31,27.5 L43,27.5"/>
                  <path android:fillColor="#FFC107" android:pathData="M37,30m-2.2,0a2.2,2.2 0,1 1,4.4 0a2.2,2.2 0,1 1,-4.4 0"/>
                  <path android:fillColor="#757575" android:pathData="M35.8,32.5h2.4v7h-2.4z"/>
                  <path android:fillColor="#BDBDBD" android:pathData="M69,25h4l1.5,4h-7z"/>
                  <path android:strokeColor="#9E9E9E" android:strokeWidth="1.7" android:pathData="M65,27.5 L77,27.5"/>
                  <path android:fillColor="#FFC107" android:pathData="M71,30m-2.2,0a2.2,2.2 0,1 1,4.4 0a2.2,2.2 0,1 1,-4.4 0"/>
                  <path android:fillColor="#757575" android:pathData="M69.8,32.5h2.4v7h-2.4z"/>
                  <path android:fillColor="#D32F2F" android:pathData="M54,54m-12,0a12,12 0,1 1,24 0a12,12 0,1 1,-24 0"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M54,47.5a2.6,2.6 0,0 1,2.6 2.6v4.2a2.6,2.6 0,0 1,-5.2 0v-4.2A2.6,2.6 0,0 1,54 47.5z"/>
                  <path android:strokeColor="#FFFFFF" android:strokeWidth="1.8" android:pathData="M49.2,54a4.8,4.8 0,0 0,9.6 0M54,58.8v2.7"/>
                  <path android:strokeColor="#EF5350" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M39,73 Q54,62 69,73"/>
                  <path android:strokeColor="#FFCDD2" android:strokeWidth="2.5" android:strokeLineCap="round" android:pathData="M44.5,78.5 Q54,71 63.5,78.5"/>
                  <path android:fillColor="#FFFFFF" android:pathData="M54,83.5m-2.3,0a2.3,2.3 0,1 1,4.6 0a2.3,2.3 0,1 1,-4.6 0"/>
              </vector>
          """)

          write("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              </adaptive-icon>
          """)

          write("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@drawable/ic_launcher_background"/>
                  <foreground android:drawable="@drawable/ic_launcher_foreground"/>
              </adaptive-icon>
          """)

          # =========================================================
          # 3. AndroidManifest (Auto P2P Hotspot + LockScreen + Audio)
          # =========================================================
          write("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
                  <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES"
                      android:usesPermissionFlags="neverForLocation" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />
                  <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                  <application
                      android:allowBackup="true"
                      android:icon="@mipmap/ic_launcher"
                      android:label="@string/app_name"
                      android:roundIcon="@mipmap/ic_launcher_round"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.BikeMic">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:launchMode="singleTop"
                          android:screenOrientation="portrait"
                          android:showWhenLocked="true"
                          android:turnScreenOn="true"
                          android:showOnLockScreen="true"
                          android:keepScreenOn="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          """)

          # =========================================================
          # 4. Models.kt
          # =========================================================
          write("app/src/main/java/com/bikemic/app/Models.kt", r"""
              package com.bikemic.app

              data class PeerInfo(
                  val nodeId: Long,
                  val name: String,
                  val chainRank: Int,
                  val batteryPct: Int,
                  val isCharging: Boolean,
                  val thermalStatus: Int,
                  val epoch: Long,
                  val currentHostId: Long,
                  val ipAddress: String,
                  val lastSeenMs: Long,
                  val handshakeOk: Boolean,
                  val isDirect: Boolean = true
              )
          """)

          # =========================================================
          # 5. DeviceHealthMonitor.kt
          # =========================================================
          write("app/src/main/java/com/bikemic/app/DeviceHealthMonitor.kt", r"""
              package com.bikemic.app

              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.os.BatteryManager
              import android.os.Build
              import android.os.PowerManager

              class DeviceHealthMonitor(
                  private val context: Context,
                  private val onUpdate: (batteryPct: Int, isCharging: Boolean, thermal: Int) -> Unit
              ) {
                  companion object {
                      const val THERMAL_NONE = 0
                      const val THERMAL_LIGHT = 1
                      const val THERMAL_MODERATE = 2
                      const val THERMAL_SEVERE = 3
                      const val THERMAL_CRITICAL = 4
                  }

                  @Volatile var batteryPct: Int = 100
                      private set
                  @Volatile var isCharging: Boolean = false
                      private set
                  @Volatile var thermalStatus: Int = THERMAL_NONE
                      private set

                  private var batteryReceiver: BroadcastReceiver? = null
                  private var thermalListener: PowerManager.OnThermalStatusChangedListener? = null
                  private var powerManager: PowerManager? = null

                  fun start() {
                      batteryReceiver = object : BroadcastReceiver() {
                          override fun onReceive(ctx: Context?, intent: Intent?) {
                              intent ?: return
                              val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                              val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                              if (level < 0 || scale <= 0) return
                              batteryPct = (level * 100f / scale).toInt()
                              val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                              isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                           status == BatteryManager.BATTERY_STATUS_FULL
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                      }
                      context.registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                          thermalListener = PowerManager.OnThermalStatusChangedListener { sys ->
                              thermalStatus = mapSysThermal(sys)
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                          powerManager?.addThermalStatusListener(context.mainExecutor, thermalListener!!)
                      }
                  }

                  private fun mapSysThermal(sys: Int): Int = when (sys) {
                      PowerManager.THERMAL_STATUS_NONE -> THERMAL_NONE
                      PowerManager.THERMAL_STATUS_LIGHT -> THERMAL_LIGHT
                      PowerManager.THERMAL_STATUS_MODERATE -> THERMAL_MODERATE
                      PowerManager.THERMAL_STATUS_SEVERE -> THERMAL_SEVERE
                      else -> THERMAL_CRITICAL
                  }

                  fun stop() {
                      runCatching { batteryReceiver?.let { context.unregisterReceiver(it) } }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          runCatching {
                              thermalListener?.let { powerManager?.removeThermalStatusListener(it) }
                          }
                      }
                  }
              }
          """)

          # =========================================================
          # 6. LeaderElection.kt
          #    - Battery threshold set to 3% (if <= 3% and not charging, immediately step down!)
          #    - At <= 3% battery, step-down is immediate (no 25s wait so phone doesn't die first!)
          # =========================================================
          write("app/src/main/java/com/bikemic/app/LeaderElection.kt", r"""
              package com.bikemic.app

              class LeaderElection(
                  private val selfId: Long,
                  private val minBattery: Int = 3,
                  private val thermalHoldMs: Long = 25_000L
              ) {
                  @Volatile var currentHostId: Long = selfId
                      private set
                  @Volatile var currentEpoch: Long = 0L
                      private set

                  private var thermalHighSinceMs: Long = 0L

                  fun healthScore(bat: Int, chg: Boolean, thermal: Int): Double {
                      if (bat <= minBattery && !chg) return -900.0
                      var s = bat.toDouble()
                      when (thermal) {
                          DeviceHealthMonitor.THERMAL_CRITICAL -> return -1000.0
                          DeviceHealthMonitor.THERMAL_SEVERE -> s -= 60.0
                          DeviceHealthMonitor.THERMAL_MODERATE -> s -= 30.0
                          DeviceHealthMonitor.THERMAL_LIGHT -> s -= 8.0
                      }
                      if (chg) s += 20.0
                      return s
                  }

                  fun shouldStepDown(bat: Int, chg: Boolean, thermal: Int, nowMs: Long): Boolean {
                      if (currentHostId != selfId) return false
                      // Immediate handover when battery drops to 3% or below (no delay so device doesn't shut off before handover)
                      if (bat <= minBattery && !chg) {
                          return true
                      }
                      if (thermal >= DeviceHealthMonitor.THERMAL_SEVERE) {
                          if (thermalHighSinceMs == 0L) thermalHighSinceMs = nowMs
                          if (nowMs - thermalHighSinceMs >= thermalHoldMs) return true
                      } else {
                          thermalHighSinceMs = 0L
                      }
                      return false
                  }

                  fun pickBestLeader(selfPeer: PeerInfo, peers: Collection<PeerInfo>, excludeId: Long = -1L): PeerInfo? {
                      val all = ArrayList<PeerInfo>(peers.size + 1)
                      all.add(selfPeer)
                      all.addAll(peers.filter { it.handshakeOk })
                      return all
                          .asSequence()
                          .filter { it.nodeId != excludeId }
                          .filter { it.batteryPct > minBattery || it.isCharging }
                          .filter { it.thermalStatus < DeviceHealthMonitor.THERMAL_CRITICAL }
                          .sortedWith(
                              compareBy<PeerInfo> { it.chainRank }
                                  .thenByDescending { healthScore(it.batteryPct, it.isCharging, it.thermalStatus) }
                                  .thenBy { it.nodeId }
                          )
                          .firstOrNull()
                  }

                  fun acceptHostAnnouncement(hostId: Long, epoch: Long): Boolean {
                      if (epoch > currentEpoch ||
                          (epoch == currentEpoch && hostId < currentHostId)) {
                          currentHostId = hostId
                          currentEpoch = epoch
                          return true
                      }
                      return false
                  }

                  fun declareSelfAsHost(minEpoch: Long = currentEpoch): Pair<Long, Long> {
                      currentHostId = selfId
                      currentEpoch = maxOf(currentEpoch, minEpoch) + 1L
                      return selfId to currentEpoch
                  }
              }
          """)

          # =========================================================
          # 7. AutoMeshHotspotManager.kt
          #    - Zero-Touch Automatic Hotspot & Client Connection using Wi-Fi Direct Autonomous Group (P2P GO)
          #    - No manual phone Hotspot toggle needed!
          #    - Leader (Rank 1 or elected Host) automatically creates a Wi-Fi Direct Hotspot Group (192.168.49.1)
          #      and broadcasts SSID + Passphrase via DNS-SD Service Record (Zero-Popups!).
          #    - Other riders automatically discover the DNS-SD record and connect seamlessly via
          #      WifiNetworkSpecifier / WifiConfiguration / WifiP2pManager.
          #    - If Leader battery drops <= 3%, Leader automatically closes its group and the next Rider
          #      automatically starts the group!
          # =========================================================
          write("app/src/main/java/com/bikemic/app/AutoMeshHotspotManager.kt", r"""
              package com.bikemic.app

              import android.annotation.SuppressLint
              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.net.ConnectivityManager
              import android.net.Network
              import android.net.NetworkCapabilities
              import android.net.NetworkRequest
              import android.net.wifi.WifiConfiguration
              import android.net.wifi.WifiManager
              import android.net.wifi.WifiNetworkSpecifier
              import android.net.wifi.WpsInfo
              import android.net.wifi.p2p.WifiP2pConfig
              import android.net.wifi.p2p.WifiP2pDevice
              import android.net.wifi.p2p.WifiP2pInfo
              import android.net.wifi.p2p.WifiP2pManager
              import android.net.wifi.p2p.nsd.WifiP2pDnsSdServiceInfo
              import android.net.wifi.p2p.nsd.WifiP2pDnsSdServiceRequest
              import android.os.Build
              import android.os.Looper
              import kotlinx.coroutines.*

              @SuppressLint("MissingPermission")
              class AutoMeshHotspotManager(
                  private val context: Context,
                  private val onStatusChange: (String) -> Unit,
                  private val onTopologyChanged: (goIp: String?) -> Unit
              ) {
                  private val p2pManager: WifiP2pManager? =
                      context.getSystemService(Context.WIFI_P2P_SERVICE) as? WifiP2pManager
                  private var channel: WifiP2pManager.Channel? = null
                  private var receiver: BroadcastReceiver? = null
                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())

                  @Volatile var isGroupOwnerNow: Boolean = false
                      private set
                  @Volatile var isConnectedNow: Boolean = false
                      private set
                  @Volatile var groupSsid: String = ""
                      private set
                  @Volatile var groupPass: String = ""
                      private set
                  @Volatile var groupOwnerIp: String? = null
                      private set

                  @Volatile private var shouldHostGroup: Boolean = false
                  @Volatile private var lastConnectAttemptMs: Long = 0L
                  @Volatile private var activeNetCallback: ConnectivityManager.NetworkCallback? = null
                  private var localServiceInfo: WifiP2pDnsSdServiceInfo? = null

                  fun start(initialShouldHost: Boolean) {
                      shouldHostGroup = initialShouldHost
                      runCatching {
                          val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          @Suppress("DEPRECATION")
                          if (!wifi.isWifiEnabled) {
                              wifi.isWifiEnabled = true
                          }
                      }

                      val mgr = p2pManager ?: run {
                          onStatusChange("جهازك لا يدعم Wi-Fi Direct التلقائي")
                          return
                      }
                      channel = mgr.initialize(context, Looper.getMainLooper(), null)

                      registerP2pReceiver()
                      setupDnsSdDiscoveryListener()

                      scope.launch {
                          delay(600L)
                          applyRoleNow()
                          while (isActive) {
                              runCatching { maintainAutoConnection() }
                              delay(5000L)
                          }
                      }
                  }

                  fun setRole(shouldBeHost: Boolean) {
                      if (shouldHostGroup == shouldBeHost) return
                      shouldHostGroup = shouldBeHost
                      scope.launch {
                          applyRoleNow()
                      }
                  }

                  fun stepDownHostGroupNow() {
                      shouldHostGroup = false
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return
                      runCatching {
                          localServiceInfo?.let { mgr.removeLocalService(ch, it, null) }
                          localServiceInfo = null
                          mgr.removeGroup(ch, object : WifiP2pManager.ActionListener {
                              override fun onSuccess() {
                                  isGroupOwnerNow = false
                                  isConnectedNow = false
                                  groupSsid = ""
                                  groupPass = ""
                                  onStatusChange("تم نقل قيادة الشبكة تلقائياً وبحث عن القائد الجديد...")
                                  startClientDiscovery()
                              }
                              override fun onFailure(reason: Int) {
                                  startClientDiscovery()
                              }
                          })
                      }
                  }

                  private fun applyRoleNow() {
                      if (shouldHostGroup) {
                          startAutonomousHostGroup()
                      } else {
                          if (isGroupOwnerNow) {
                              stepDownHostGroupNow()
                          } else {
                              startClientDiscovery()
                          }
                      }
                  }

                  private fun maintainAutoConnection() {
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return

                      mgr.requestGroupInfo(ch) { group ->
                          if (group != null) {
                              isConnectedNow = true
                              isGroupOwnerNow = group.isGroupOwner
                              groupSsid = group.networkName ?: ""
                              groupPass = group.passphrase ?: ""
                              if (group.isGroupOwner) {
                                  groupOwnerIp = "192.168.49.1"
                                  advertiseGroupCredentials(groupSsid, groupPass)
                                  onStatusChange("شبكة القائد التلقائية جاهزة ($groupSsid)")
                                  onTopologyChanged("192.168.49.1")
                              } else {
                                  onStatusChange("متصل تلقائياً بشبكة القائد ($groupSsid)")
                                  onTopologyChanged(groupOwnerIp ?: "192.168.49.1")
                              }
                          } else {
                              isConnectedNow = false
                              isGroupOwnerNow = false
                              if (shouldHostGroup) {
                                  startAutonomousHostGroup()
                              } else {
                                  startClientDiscovery()
                              }
                          }
                      }
                  }

                  private fun startAutonomousHostGroup() {
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return

                      mgr.requestGroupInfo(ch) { existing ->
                          if (existing != null && existing.isGroupOwner) {
                              isGroupOwnerNow = true
                              isConnectedNow = true
                              groupSsid = existing.networkName ?: ""
                              groupPass = existing.passphrase ?: ""
                              groupOwnerIp = "192.168.49.1"
                              advertiseGroupCredentials(groupSsid, groupPass)
                              onStatusChange("شبكة القائد التلقائية نشطة ($groupSsid)")
                              onTopologyChanged("192.168.49.1")
                              return@requestGroupInfo
                          }

                          onStatusChange("جاري إنشاء نقطة اتصال تلقائية للقائد...")
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val cfg = WifiP2pConfig.Builder()
                                  .setNetworkName("DIRECT-BM-BIKEMIC")
                                  .setPassphrase("bikemic1234")
                                  .enablePersistentMode(true)
                                  .setGroupOperatingBand(WifiP2pConfig.GROUP_OWNER_BAND_2GHZ)
                                  .build()
                              mgr.createGroup(ch, cfg, object : WifiP2pManager.ActionListener {
                                  override fun onSuccess() {
                                      queryAndAdvertiseGroup()
                                  }
                                  override fun onFailure(reason: Int) {
                                      createStandardGroupFallback()
                                  }
                              })
                          } else {
                              createStandardGroupFallback()
                          }
                      }
                  }

                  private fun createStandardGroupFallback() {
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return
                      mgr.createGroup(ch, object : WifiP2pManager.ActionListener {
                          override fun onSuccess() {
                              queryAndAdvertiseGroup()
                          }
                          override fun onFailure(reason: Int) {
                              // Already in a group or busy; inspect group info
                              queryAndAdvertiseGroup()
                          }
                      })
                  }

                  private fun queryAndAdvertiseGroup() {
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return
                      scope.launch {
                          delay(500L)
                          mgr.requestGroupInfo(ch) { group ->
                              if (group != null) {
                                  isGroupOwnerNow = group.isGroupOwner
                                  isConnectedNow = true
                                  groupSsid = group.networkName ?: "DIRECT-BM-BIKEMIC"
                                  groupPass = group.passphrase ?: "bikemic1234"
                                  groupOwnerIp = "192.168.49.1"
                                  advertiseGroupCredentials(groupSsid, groupPass)
                                  onStatusChange("تم تفعيل شبكة القائد تلقائياً ($groupSsid)")
                                  onTopologyChanged("192.168.49.1")
                              }
                          }
                      }
                  }

                  private fun advertiseGroupCredentials(ssid: String, pass: String) {
                      if (ssid.isEmpty() || pass.isEmpty()) return
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return
                      runCatching {
                          localServiceInfo?.let { mgr.removeLocalService(ch, it, null) }
                          val record = mapOf(
                              "ssid" to ssid,
                              "pass" to pass,
                              "goip" to "192.168.49.1"
                          )
                          val info = WifiP2pDnsSdServiceInfo.newInstance("_bikemic", "_udp", record)
                          localServiceInfo = info
                          mgr.addLocalService(ch, info, null)
                          // Keep peer discovery active so followers can read the DNS-SD broadcast over Wi-Fi P2P
                          mgr.discoverPeers(ch, null)
                      }
                  }

                  private fun setupDnsSdDiscoveryListener() {
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return

                      val txtListener = WifiP2pManager.DnsSdTxtRecordListener { fullDomain, record, device ->
                          if (!fullDomain.contains("_bikemic")) return@DnsSdTxtRecordListener
                          if (shouldHostGroup || isConnectedNow) return@DnsSdTxtRecordListener

                          val ssid = record["ssid"] ?: ""
                          val pass = record["pass"] ?: ""
                          val goIp = record["goip"] ?: "192.168.49.1"
                          groupOwnerIp = goIp

                          val now = System.currentTimeMillis()
                          if (now - lastConnectAttemptMs < 7000L) return@DnsSdTxtRecordListener
                          lastConnectAttemptMs = now

                          onStatusChange("تم العثور على شبكة القائد ($ssid) • جاري الربط التلقائي...")
                          connectToDiscoveredLeader(device, ssid, pass)
                      }

                      val servListener = WifiP2pManager.DnsSdServiceResponseListener { _, _, _ -> }
                      mgr.setDnsSdResponseListeners(ch, servListener, txtListener)
                  }

                  private fun startClientDiscovery() {
                      if (shouldHostGroup || isConnectedNow) return
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return

                      onStatusChange("البحث التلقائي عن شبكة القائد (بدون إعداد يدوي)...")

                      // 1. On Android 10+ (API 29+), also try direct deterministic group connection if Leader uses Android 10+
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val now = System.currentTimeMillis()
                          if (now - lastConnectAttemptMs > 8000L) {
                              runCatching {
                                  val cfg = WifiP2pConfig.Builder()
                                      .setNetworkName("DIRECT-BM-BIKEMIC")
                                      .setPassphrase("bikemic1234")
                                      .build()
                                  mgr.connect(ch, cfg, null)
                              }
                          }
                      }

                      // 2. Discover any DNS-SD service broadcasted by the Leader (works across all Android 8..14 devices)
                      runCatching {
                          mgr.clearServiceRequests(ch, object : WifiP2pManager.ActionListener {
                              override fun onSuccess() {
                                  val req = WifiP2pDnsSdServiceRequest.newInstance()
                                  mgr.addServiceRequest(ch, req, object : WifiP2pManager.ActionListener {
                                      override fun onSuccess() {
                                          mgr.discoverServices(ch, null)
                                      }
                                      override fun onFailure(r: Int) {
                                          mgr.discoverPeers(ch, null)
                                      }
                                  })
                              }
                              override fun onFailure(r: Int) {
                                  mgr.discoverPeers(ch, null)
                              }
                          })
                      }
                  }

                  private fun connectToDiscoveredLeader(device: WifiP2pDevice?, ssid: String, pass: String) {
                      val mgr = p2pManager ?: return
                      val ch = channel ?: return

                      // Method A: Android 10+ seamless P2P group join with exact SSID & Passphrase (zero confirmation dialog!)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q && ssid.startsWith("DIRECT-") && pass.length >= 8) {
                          val cfg = WifiP2pConfig.Builder()
                              .setNetworkName(ssid)
                              .setPassphrase(pass)
                              .build()
                          mgr.connect(ch, cfg, object : WifiP2pManager.ActionListener {
                              override fun onSuccess() {
                                  onStatusChange("تم الربط التلقائي بشبكة القائد ($ssid)")
                                  onTopologyChanged("192.168.49.1")
                              }
                              override fun onFailure(reason: Int) {
                                  connectViaP2pDeviceOrWifi(device, ssid, pass)
                              }
                          })
                          return
                      }

                      connectViaP2pDeviceOrWifi(device, ssid, pass)
                  }

                  private fun connectViaP2pDeviceOrWifi(device: WifiP2pDevice?, ssid: String, pass: String) {
                      val mgr = p2pManager
                      val ch = channel

                      // Method B: Connect via standard Wi-Fi P2P device address (Joining existing Group Owner requires no prompt on GO)
                      if (mgr != null && ch != null && device != null && device.deviceAddress.isNotEmpty()) {
                          val cfg = WifiP2pConfig().apply {
                              deviceAddress = device.deviceAddress
                              wps.setup = WpsInfo.PBC
                              groupOwnerIntent = 0
                          }
                          mgr.connect(ch, cfg, object : WifiP2pManager.ActionListener {
                              override fun onSuccess() {
                                  onStatusChange("تم الاتصال التلقائي بالقائد (${device.deviceName})")
                                  onTopologyChanged("192.168.49.1")
                              }
                              override fun onFailure(reason: Int) {
                                  connectViaLegacyWifiOrSpecifier(ssid, pass)
                              }
                          })
                          return
                      }

                      connectViaLegacyWifiOrSpecifier(ssid, pass)
                  }

                  @Suppress("DEPRECATION")
                  private fun connectViaLegacyWifiOrSpecifier(ssid: String, pass: String) {
                      if (ssid.isEmpty() || pass.isEmpty()) return
                      runCatching {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                              activeNetCallback?.let { runCatching { cm.unregisterNetworkCallback(it) } }
                              val spec = WifiNetworkSpecifier.Builder()
                                  .setSsid(ssid)
                                  .setWpa2Passphrase(pass)
                                  .build()
                              val req = NetworkRequest.Builder()
                                  .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                                  .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                                  .setNetworkSpecifier(spec)
                                  .build()
                              val cb = object : ConnectivityManager.NetworkCallback() {
                                  override fun onAvailable(network: Network) {
                                      cm.bindProcessToNetwork(network)
                                      isConnectedNow = true
                                      groupOwnerIp = "192.168.49.1"
                                      onStatusChange("متصل تلقائياً بشبكة القائد ($ssid)")
                                      onTopologyChanged("192.168.49.1")
                                  }
                              }
                              activeNetCallback = cb
                              cm.requestNetwork(req, cb)
                          } else {
                              val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                              val conf = WifiConfiguration().apply {
                                  SSID = "\"$ssid\""
                                  preSharedKey = "\"$pass\""
                              }
                              val netId = wifi.addNetwork(conf)
                              if (netId != -1) {
                                  wifi.disconnect()
                                  wifi.enableNetwork(netId, true)
                                  wifi.reconnect()
                                  onStatusChange("تم الربط التلقائي بوايفاي القائد ($ssid)")
                                  onTopologyChanged("192.168.49.1")
                              }
                          }
                      }
                  }

                  private fun registerP2pReceiver() {
                      val filter = IntentFilter().apply {
                          addAction(WifiP2pManager.WIFI_P2P_STATE_CHANGED_ACTION)
                          addAction(WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION)
                          addAction(WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION)
                      }
                      receiver = object : BroadcastReceiver() {
                          override fun onReceive(ctx: Context?, intent: Intent?) {
                              val act = intent?.action ?: return
                              val mgr = p2pManager ?: return
                              val ch = channel ?: return

                              when (act) {
                                  WifiP2pManager.WIFI_P2P_CONNECTION_CHANGED_ACTION -> {
                                      mgr.requestConnectionInfo(ch) { info: WifiP2pInfo? ->
                                          if (info != null && info.groupFormed) {
                                              isConnectedNow = true
                                              isGroupOwnerNow = info.isGroupOwner
                                              val goIp = info.groupOwnerAddress?.hostAddress ?: "192.168.49.1"
                                              groupOwnerIp = goIp
                                              onTopologyChanged(goIp)
                                              mgr.requestGroupInfo(ch) { grp ->
                                                  if (grp != null) {
                                                      groupSsid = grp.networkName ?: ""
                                                      groupPass = grp.passphrase ?: ""
                                                      if (grp.isGroupOwner) {
                                                          advertiseGroupCredentials(groupSsid, groupPass)
                                                      }
                                                  }
                                              }
                                          } else {
                                              isConnectedNow = false
                                              isGroupOwnerNow = false
                                          }
                                      }
                                  }
                                  WifiP2pManager.WIFI_P2P_PEERS_CHANGED_ACTION -> {
                                      if (!shouldHostGroup && !isConnectedNow) {
                                          mgr.requestPeers(ch) { peers ->
                                              val goCandidate = peers.deviceList.firstOrNull { dev ->
                                                  dev.isGroupOwner || dev.deviceName.contains("BikeMic", ignoreCase = true)
                                              }
                                              if (goCandidate != null) {
                                                  val now = System.currentTimeMillis()
                                                  if (now - lastConnectAttemptMs > 7000L) {
                                                      lastConnectAttemptMs = now
                                                      connectViaP2pDeviceOrWifi(goCandidate, "", "")
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      context.registerReceiver(receiver, filter)
                  }

                  fun stop() {
                      scope.cancel()
                      val mgr = p2pManager
                      val ch = channel
                      runCatching {
                          if (mgr != null && ch != null) {
                              localServiceInfo?.let { mgr.removeLocalService(ch, it, null) }
                              mgr.clearServiceRequests(ch, null)
                              mgr.removeGroup(ch, null)
                          }
                      }
                      runCatching { receiver?.let { context.unregisterReceiver(it) } }
                      runCatching {
                          val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          activeNetCallback?.let { cm.unregisterNetworkCallback(it) }
                      }
                  }
              }
          """)

          # =========================================================
          # 8. MeshVoiceEngine.kt
          #    - Integrates AutoMeshHotspotManager (zero-touch automatic Hotspot/Wi-Fi Direct connection)
          #    - Automatic Leader & Hotspot Group handover when battery <= 3%
          #    - Little-Endian G.711 u-law 8-bit ultra-lightweight audio (320 bytes/frame = 20ms)
          #    - Full Mesh Gossip so ALL riders see all connected names
          #    - Instant PTT Burst Delivery Confirmation (ACKs with Rider names + Sound/Vibration)
          # =========================================================
          write("app/src/main/java/com/bikemic/app/MeshVoiceEngine.kt", r"""
              package com.bikemic.app


name: Build BikeMic P2P Mesh APK (Full Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean workspace from old files
        run: |
          rm -rf app build gradle settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Generate temporary keystore (123456)
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bikemic \
            -storepass 123456 -keypass 123456 \
            -dname "CN=BikeMic, OU=Riders, O=BikeMic, L=Muscat, ST=Muscat, C=OM"
          test -s app/release.keystore
          echo "Temporary keystore generated."

      - name: Generate Full P2P Mesh Project
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          cat << 'PYEOF' > /tmp/gen_bikemic_full.py
          import os
          import textwrap

          def write(path, content):
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          run_num = int(os.environ.get("RUN_NUM", "1") or "1")

          # =========================================================
          # 1. Gradle Config
          # =========================================================
          write("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              android.nonTransitiveRClass=true
              org.gradle.parallel=true
              org.gradle.caching=true
          """)

          write("settings.gradle", r"""
              pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories { google(); mavenCentral() }
              }
              rootProject.name = "BikeMic"
              include ':app'
          """)

          write("build.gradle", r"""
              plugins {
                  id 'com.android.application' version '8.3.2' apply false
                  id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
              }
          """)

          write("app/build.gradle", r"""
              plugins {
                  id 'com.android.application'
                  id 'org.jetbrains.kotlin.android'
              }

              android {
                  namespace 'com.bikemic.app'
                  compileSdk 34

                  signingConfigs {
                      release {
                          storeFile file('release.keystore')
                          storePassword '123456'
                          keyAlias 'bikemic'
                          keyPassword '123456'
                      }
                  }

                  defaultConfig {
                      applicationId "com.bikemic.app"
                      minSdk 26
                      targetSdk 34
                      versionCode VERSION_CODE
                      versionName "VERSION_NAME"
                  }

                  buildTypes {
                      release {
                          signingConfig signingConfigs.release
                          minifyEnabled false
                      }
                  }

                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
                  kotlinOptions { jvmTarget = '17' }
                  buildFeatures { compose true }
                  composeOptions { kotlinCompilerExtensionVersion = '1.5.8' }
              }

              dependencies {
                  implementation 'androidx.core:core-ktx:1.12.0'
                  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
                  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
                  implementation 'androidx.activity:activity-compose:1.8.2'
                  implementation platform('androidx.compose:compose-bom:2024.02.02')
                  implementation 'androidx.compose.ui:ui'
                  implementation 'androidx.compose.ui:ui-graphics'
                  implementation 'androidx.compose.material3:material3'
                  implementation 'androidx.compose.material:material-icons-extended'
                  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              }
          """.replace("VERSION_CODE", str(1000 + run_num)).replace("VERSION_NAME", f"7.{run_num}"))

          write("app/proguard-rules.pro", r"""
              -keep class com.bikemic.app.** { *; }
          """)

          # =========================================================
          # 2. Resources & Manifest
          # =========================================================
          write("app/src/main/res/values/strings.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <string name="app_name">BikeMic</string>
              </resources>
          """)

          write("app/src/main/res/values/styles.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <style name="Theme.BikeMic" parent="android:Theme.Material.NoActionBar">
                      <item name="android:statusBarColor">#000000</item>
                      <item name="android:navigationBarColor">#000000</item>
                      <item name="android:windowBackground">#000000</item>
                  </style>
              </resources>
          """)

          write("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
                  <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
                  <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                  <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
                  <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />

                  <application
                      android:allowBackup="true"
                      android:icon="@android:drawable/ic_btn_speak_now"
                      android:label="@string/app_name"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.BikeMic">
                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:screenOrientation="portrait"
                          android:keepScreenOn="true"
                          android:showWhenLocked="true"
                          android:turnScreenOn="true"
                          android:launchMode="singleTop">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                      <service
                          android:name=".BikeMicService"
                          android:foregroundServiceType="microphone"
                          android:exported="false" />
                  </application>
              </manifest>
          """)

          # =========================================================
          # 3. Models
          # =========================================================
          write("app/src/main/java/com/bikemic/app/Models.kt", r"""
              package com.bikemic.app

              data class PeerInfo(
                  val nodeId: Long,
                  val name: String,
                  val chainRank: Int,
                  val batteryPct: Int,
                  val isCharging: Boolean,
                  val thermalStatus: Int,
                  val epoch: Long,
                  val currentHostId: Long,
                  val ipAddress: String,
                  val lastSeenMs: Long,
                  val handshakeOk: Boolean
              )
          """)

          # =========================================================
          # 4. DeviceHealthMonitor (Battery + Thermal)
          # =========================================================
          write("app/src/main/java/com/bikemic/app/DeviceHealthMonitor.kt", r"""
              package com.bikemic.app

              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.os.BatteryManager
              import android.os.Build
              import android.os.PowerManager

              class DeviceHealthMonitor(
                  private val context: Context,
                  private val onUpdate: (batteryPct: Int, isCharging: Boolean, thermal: Int) -> Unit
              ) {
                  companion object {
                      const val THERMAL_NONE = 0
                      const val THERMAL_LIGHT = 1
                      const val THERMAL_MODERATE = 2
                      const val THERMAL_SEVERE = 3
                      const val THERMAL_CRITICAL = 4
                  }

                  @Volatile var batteryPct: Int = 100; private set
                  @Volatile var isCharging: Boolean = false; private set
                  @Volatile var thermalStatus: Int = THERMAL_NONE; private set

                  private var batteryReceiver: BroadcastReceiver? = null
                  private var thermalListener: PowerManager.OnThermalStatusChangedListener? = null
                  private var powerManager: PowerManager? = null

                  fun start() {
                      batteryReceiver = object : BroadcastReceiver() {
                          override fun onReceive(ctx: Context?, intent: Intent?) {
                              intent ?: return
                              val level = intent.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                              val scale = intent.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                              if (level < 0 || scale <= 0) return
                              batteryPct = (level * 100f / scale).toInt()
                              val status = intent.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                              isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING || status == BatteryManager.BATTERY_STATUS_FULL
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                      }
                      context.registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager
                          thermalListener = PowerManager.OnThermalStatusChangedListener { sys ->
                              thermalStatus = when (sys) {
                                  PowerManager.THERMAL_STATUS_NONE -> THERMAL_NONE
                                  PowerManager.THERMAL_STATUS_LIGHT -> THERMAL_LIGHT
                                  PowerManager.THERMAL_STATUS_MODERATE -> THERMAL_MODERATE
                                  PowerManager.THERMAL_STATUS_SEVERE -> THERMAL_SEVERE
                                  else -> THERMAL_CRITICAL
                              }
                              onUpdate(batteryPct, isCharging, thermalStatus)
                          }
                          powerManager?.addThermalStatusListener(context.mainExecutor, thermalListener!!)
                      }
                  }

                  fun stop() {
                      runCatching { batteryReceiver?.let { context.unregisterReceiver(it) } }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          runCatching { thermalListener?.let { powerManager?.removeThermalStatusListener(it) } }
                      }
                  }
              }
          """)

          # =========================================================
          # 5. LeaderElection
          # =========================================================
          write("app/src/main/java/com/bikemic/app/LeaderElection.kt", r"""
              package com.bikemic.app

              class LeaderElection(
                  private val selfId: Long,
                  private val minBattery: Int = 25,
                  private val thermalHoldMs: Long = 25_000L
              ) {
                  @Volatile var currentHostId: Long = selfId; private set
                  @Volatile var currentEpoch: Long = 0L; private set

                  private var thermalHighSinceMs: Long = 0L
                  private var lowBatSinceMs: Long = 0L

                  fun healthScore(bat: Int, chg: Boolean, thermal: Int): Double {
                      var s = bat.toDouble()
                      when (thermal) {
                          DeviceHealthMonitor.THERMAL_CRITICAL -> return -1000.0
                          DeviceHealthMonitor.THERMAL_SEVERE -> s -= 60.0
                          DeviceHealthMonitor.THERMAL_MODERATE -> s -= 30.0
                          DeviceHealthMonitor.THERMAL_LIGHT -> s -= 8.0
                      }
                      if (chg) s += 20.0
                      return s
                  }

                  fun shouldStepDown(bat: Int, chg: Boolean, thermal: Int, nowMs: Long): Boolean {
                      if (currentHostId != selfId) return false
                      if (thermal >= DeviceHealthMonitor.THERMAL_SEVERE) {
                          if (thermalHighSinceMs == 0L) thermalHighSinceMs = nowMs
                          if (nowMs - thermalHighSinceMs >= thermalHoldMs) return true
                      } else thermalHighSinceMs = 0L
                      
                      if (bat < minBattery && !chg) {
                          if (lowBatSinceMs == 0L) lowBatSinceMs = nowMs
                          if (nowMs - lowBatSinceMs >= thermalHoldMs) return true
                      } else lowBatSinceMs = 0L
                      return false
                  }

                  fun pickBestLeader(selfPeer: PeerInfo, peers: Collection<PeerInfo>, excludeId: Long = -1L): PeerInfo? {
                      val all = ArrayList<PeerInfo>(peers.size + 1)
                      all.add(selfPeer)
                      all.addAll(peers.filter { it.handshakeOk })
                      return all.asSequence()
                          .filter { it.nodeId != excludeId }
                          .filter { it.thermalStatus < DeviceHealthMonitor.THERMAL_CRITICAL }
                          .sortedWith(
                              compareBy<PeerInfo> { it.chainRank }
                                  .thenByDescending { healthScore(it.batteryPct, it.isCharging, it.thermalStatus) }
                                  .thenBy { it.nodeId }
                          ).firstOrNull()
                  }

                  fun acceptHostAnnouncement(hostId: Long, epoch: Long): Boolean {
                      if (epoch > currentEpoch || (epoch == currentEpoch && hostId < currentHostId)) {
                          currentHostId = hostId
                          currentEpoch = epoch
                          return true
                      }
                      return false
                  }

                  fun declareSelfAsHost(minEpoch: Long = currentEpoch): Pair<Long, Long> {
                      currentHostId = selfId
                      currentEpoch = maxOf(currentEpoch, minEpoch) + 1L
                      return selfId to currentEpoch
                  }
              }
          """)

          # =========================================================
          # 6. MeshVoiceEngine (Jitter Buffer + ACKs + Diagnostics)
          # =========================================================
          write("app/src/main/java/com/bikemic/app/MeshVoiceEngine.kt", r"""
              package com.bikemic.app

              import android.content.Context
              import android.media.AudioAttributes
              import android.media.AudioFormat
              import android.media.AudioManager
              import android.media.AudioRecord
              import android.media.AudioTrack
              import android.media.MediaRecorder
              import android.media.audiofx.AcousticEchoCanceler
              import android.media.audiofx.NoiseSuppressor
              import android.net.ConnectivityManager
              import android.net.wifi.WifiManager
              import androidx.compose.runtime.mutableIntStateOf
              import androidx.compose.runtime.mutableLongStateOf
              import androidx.compose.runtime.mutableStateOf
              import kotlinx.coroutines.*
              import org.json.JSONArray
              import org.json.JSONObject
              import java.io.File
              import java.net.*
              import java.nio.ByteBuffer
              import java.util.Collections
              import java.util.concurrent.ConcurrentHashMap
              import java.util.concurrent.ConcurrentLinkedQueue
              import java.util.concurrent.atomic.AtomicInteger
              import kotlin.random.Random

              class MeshVoiceEngine(private val context: Context) {
                  companion object {
                      private const val DISCOVERY_PORT = 50004
                      private const val AUDIO_PORT = 50005
                      private const val MULTICAST_GROUP = "239.255.42.99"
                      private const val SAMPLE_RATE = 16000
                      private const val FRAME_BYTES = 640
                      private const val MAGIC_AUDIO: Byte = 0x42
                      private const val MAGIC_ACK: Byte = 0x43
                      private const val HEADER_SIZE = 15
                  }

                  val selfId: Long = Random.nextLong(100_000L, Long.MAX_VALUE)
                  @Volatile var userName: String = "راكب"
                  @Volatile var chainRank: Int = 1
                  @Volatile var isPttPressed: Boolean = false
                  @Volatile var isOpenMicOn: Boolean = false
                  @Volatile var selectAllPeers: Boolean = true
                  val allowedPeerIds: MutableSet<Long> = Collections.newSetFromMap(ConcurrentHashMap())

                  @Volatile var batteryPct: Int = 100
                  @Volatile var isCharging: Boolean = false
                  @Volatile var thermalStatus: Int = 0

                  val peersVersion = mutableIntStateOf(0)
                  val connectedCount = mutableIntStateOf(0)
                  val currentHostIdState = mutableLongStateOf(selfId)
                  val currentEpochState = mutableLongStateOf(0L)
                  val statusText = mutableStateOf("جارٍ البحث عن دراجين...")
                  val activeSpeakerName = mutableStateOf<String?>(null)
                  val pttDeliveredCount = mutableIntStateOf(0)

                  val debugSentCount = mutableIntStateOf(0)
                  val debugReceivedCount = mutableIntStateOf(0)
                  val debugLastError = mutableStateOf("لا توجد أخطاء")
                  @Volatile private var cachedIfacesInfo: List<Pair<String, String>> = emptyList()
                  @Volatile private var cachedTargetIps: Set<InetAddress> = emptySet()
                  @Volatile private var cachedLocalIps: Set<String> = emptySet()

                  val peersMap = ConcurrentHashMap<Long, PeerInfo>()
                  private val knownHintIps = Collections.newSetFromMap(ConcurrentHashMap<String, Boolean>())

                  // Jitter Buffer for Audio
                  private val audioQueue = ConcurrentLinkedQueue<ByteArray>()
                  private val seenAudio = Collections.synchronizedMap(object : LinkedHashMap<Long, Boolean>(512, 0.75f, true) {
                      override fun removeEldestEntry(eldest: MutableMap.MutableEntry<Long, Boolean>?) = size > 900
                  })

                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val seqCounter = AtomicInteger(1)
                  private val election = LeaderElection(selfId)

                  private var multicastLock: WifiManager.MulticastLock? = null
                  private var wifiLock: WifiManager.WifiLock? = null
                  @Volatile private var discoverySocket: DatagramSocket? = null
                  @Volatile private var multicastSocket: MulticastSocket? = null
                  @Volatile private var audioSocket: DatagramSocket? = null

                  fun start() {
                      runCatching {
                          val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          multicastLock = wifi.createMulticastLock("BikeMicLock").apply { setReferenceCounted(false); acquire() }
                          wifiLock = wifi.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "BikeMicWifi").apply { setReferenceCounted(false); acquire() }
                          val am = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          am.mode = AudioManager.MODE_IN_COMMUNICATION
                          am.isSpeakerphoneOn = true
                      }.onFailure { debugLastError.value = "Init: ${it.message}" }

                      scope.launch {
                          refreshNetworkTopology()
                          if (initSockets()) {
                              startDiscoveryReceiver()
                              startMulticastReceiver()
                              startHeartbeatLoop()
                              startElectionLoop()
                          }
                          startAudioEngine()
                      }
                  }

                  fun stop() {
                      scope.cancel()
                      runCatching { discoverySocket?.close(); multicastSocket?.close(); audioSocket?.close() }
                      runCatching { if (multicastLock?.isHeld == true) multicastLock?.release() }
                      runCatching { if (wifiLock?.isHeld == true) wifiLock?.release() }
                  }

                  fun updateUser(newName: String, newRank: Int) {
                      userName = newName; chainRank = newRank; peersVersion.intValue += 1
                      scope.launch { sendHeartbeatNow() }
                  }
                  fun updateHealth(bat: Int, chg: Boolean, thm: Int) {
                      batteryPct = bat; isCharging = chg; thermalStatus = thm; peersVersion.intValue += 1
                  }
                  fun resetPttAck() { pttDeliveredCount.intValue = 0 }

                  fun getDebugInterfaces(): List<Pair<String, String>> = cachedIfacesInfo
                  fun getDebugBroadcasts(): List<String> = cachedTargetIps.mapNotNull { it.hostAddress }.sorted()

                  private fun isIgnored(name: String): Boolean {
                      val n = name.lowercase()
                      return n.startsWith("rmnet") || n.startsWith("ccmni") || n.startsWith("pdp") || n.startsWith("dummy") || n.startsWith("tun") || n.startsWith("ppp")
                  }

                  private fun refreshNetworkTopology() {
                      val targets = LinkedHashSet<InetAddress>()
                      val locals = HashSet<String>()
                      val ifacesList = ArrayList<Pair<String, String>>()

                      runCatching {
                          val ifaces = NetworkInterface.getNetworkInterfaces()
                          while (ifaces != null && ifaces.hasMoreElements()) {
                              val nif = ifaces.nextElement()
                              if (!nif.isUp || nif.isLoopback || isIgnored(nif.name)) continue
                              for (ia in nif.interfaceAddresses) {
                                  val addr = ia.address
                                  if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                      val ipStr = addr.hostAddress ?: continue
                                      locals.add(ipStr)
                                      ifacesList.add(nif.name to ipStr)
                                      ia.broadcast?.let { targets.add(it) }
                                      val prefix = ia.networkPrefixLength.toInt()
                                      if (prefix in 8..30) {
                                          val b = addr.address
                                          val ipInt = ((b[0].toInt() and 0xFF) shl 24) or ((b[1].toInt() and 0xFF) shl 16) or ((b[2].toInt() and 0xFF) shl 8) or (b[3].toInt() and 0xFF)
                                          val mask = -1 shl (32 - prefix)
                                          val bcast = byteArrayOf(((ipInt and mask) or mask.inv() ushr 24).toByte(), ((ipInt and mask) or mask.inv() ushr 16).toByte(), ((ipInt and mask) or mask.inv() ushr 8).toByte(), ((ipInt and mask) or mask.inv()).toByte())
                                          runCatching { targets.add(InetAddress.getByAddress(bcast)) }
                                          targets.add(InetAddress.getByAddress(byteArrayOf(b[0], b[1], b[2], 1)))
                                      }
                                  }
                              }
                          }
                      }

                      runCatching {
                          val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          for (net in cm.allNetworks) {
                              val lp = cm.getLinkProperties(net) ?: continue
                              for (route in lp.routes) {
                                  val gw = route.gateway
                                  if (gw is Inet4Address && !gw.isLoopbackAddress && !gw.isAnyLocalAddress && gw.hostAddress !in locals) targets.add(gw)
                              }
                          }
                      }

                      runCatching {
                          val arp = File("/proc/net/arp")
                          if (arp.canRead()) arp.forEachLine { line ->
                              val tokens = line.trim().split(' ', '\t').filter { it.isNotEmpty() }
                              if (tokens.size >= 6 && tokens[0] != "0.0.0.0" && tokens[0] !in locals && !isIgnored(tokens[5])) {
                                  runCatching { targets.add(InetAddress.getByName(tokens[0])) }
                              }
                          }
                      }

                      peersMap.values.forEach { if (it.ipAddress.isNotEmpty() && it.ipAddress !in locals) runCatching { targets.add(InetAddress.getByName(it.ipAddress)) } }
                      knownHintIps.forEach { if (it !in locals) runCatching { targets.add(InetAddress.getByName(it)) } }
                      runCatching { targets.add(InetAddress.getByName(MULTICAST_GROUP)) }
                      runCatching { targets.add(InetAddress.getByName("255.255.255.255")) }

                      cachedLocalIps = locals
                      cachedIfacesInfo = ifacesList
                      cachedTargetIps = targets
                  }

                  private fun initSockets(): Boolean {
                      return try {
                          discoverySocket = DatagramSocket(null).apply { reuseAddress = true; broadcast = true; bind(InetSocketAddress(DISCOVERY_PORT)) }
                          runCatching {
                              val group = InetAddress.getByName(MULTICAST_GROUP)
                              val ms = MulticastSocket(DISCOVERY_PORT).apply { reuseAddress = true; timeToLive = 4 }
                              var joined = false
                              val ifaces = NetworkInterface.getNetworkInterfaces()
                              while (ifaces != null && ifaces.hasMoreElements()) {
                                  val nif = ifaces.nextElement()
                                  if (nif.isUp && !nif.isLoopback && nif.supportsMulticast() && !isIgnored(nif.name)) {
                                      runCatching { ms.joinGroup(InetSocketAddress(group, DISCOVERY_PORT), nif); joined = true }
                                  }
                              }
                              multicastSocket = ms
                          }
                          true
                      } catch (e: Exception) {
                          debugLastError.value = "Socket: ${e.message}"
                          false
                      }
                  }

                  private fun sendUnicast(obj: JSONObject, target: InetAddress) {
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      runCatching { discoverySocket?.send(DatagramPacket(data, data.size, target, DISCOVERY_PORT)); debugSentCount.intValue += 1 }
                  }

                  private fun sendAll(obj: JSONObject) {
                      val data = obj.toString().toByteArray(Charsets.UTF_8)
                      for (target in cachedTargetIps) {
                          runCatching { discoverySocket?.send(DatagramPacket(data, data.size, target, DISCOVERY_PORT)); debugSentCount.intValue += 1 }
                      }
                  }

                  private fun buildHB(type: String = "HB"): JSONObject {
                      val arr = JSONArray()
                      peersMap.values.forEach { p -> if (p.ipAddress.isNotEmpty()) arr.put(JSONObject().apply { put("id", p.nodeId); put("ip", p.ipAddress); put("name", p.name); put("rank", p.chainRank) }) }
                      return JSONObject().apply {
                          put("t", type); put("id", selfId); put("name", userName); put("rank", chainRank)
                          put("bat", batteryPct); put("chg", isCharging); put("thm", thermalStatus)
                          put("epoch", election.currentEpoch); put("host", election.currentHostId); put("peers", arr)
                      }
                  }

                  private fun sendHeartbeatNow() { refreshNetworkTopology(); sendAll(buildHB("HB")) }

                  private fun startDiscoveryReceiver() {
                      scope.launch {
                          val buf = ByteArray(4096)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  discoverySocket?.receive(pkt) ?: break
                                  handlePacket(pkt)
                              } catch (e: Exception) { if (isActive) delay(200) }
                          }
                      }
                  }

                  private fun startMulticastReceiver() {
                      val ms = multicastSocket ?: return
                      scope.launch {
                          val buf = ByteArray(4096)
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  ms.receive(pkt)
                                  handlePacket(pkt)
                              } catch (e: Exception) { if (isActive) delay(300) }
                          }
                      }
                  }

                  private fun handlePacket(pkt: DatagramPacket) {
                      runCatching {
                          val msg = JSONObject(String(pkt.data, 0, pkt.length, Charsets.UTF_8))
                          val senderId = msg.optLong("id", -1L)
                          if (senderId <= 0L || senderId == selfId) return
                          debugReceivedCount.intValue += 1

                          val ip = pkt.address.hostAddress ?: ""
                          if (ip.isNotEmpty() && ip !in cachedLocalIps) knownHintIps.add(ip)

                          when (msg.optString("t")) {
                              "HB", "ACK" -> {
                                  val exists = peersMap[senderId]
                                  peersMap[senderId] = PeerInfo(
                                      senderId, msg.optString("name", exists?.name ?: "راكب"), msg.optInt("rank", exists?.chainRank ?: 2),
                                      msg.optInt("bat", exists?.batteryPct ?: 100), msg.optBoolean("chg", exists?.isCharging ?: false),
                                      msg.optInt("thm", exists?.thermalStatus ?: 0), msg.optLong("epoch", exists?.epoch ?: 0L),
                                      msg.optLong("host", senderId), ip, System.currentTimeMillis(), true
                                  )
                                  if (selectAllPeers) allowedPeerIds.add(senderId)

                                  if (election.acceptHostAnnouncement(msg.optLong("host", -1L), msg.optLong("epoch", 0L))) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                  }

                                  msg.optJSONArray("peers")?.let { arr ->
                                      for (i in 0 until arr.length()) {
                                          val gp = arr.optJSONObject(i) ?: continue
                                          val gId = gp.optLong("id", -1L)
                                          val gIp = gp.optString("ip", "")
                                          if (gId > 0L && gId != selfId && gIp.isNotEmpty() && gIp !in cachedLocalIps && knownHintIps.add(gIp)) {
                                              sendUnicast(buildHB("HB"), InetAddress.getByName(gIp))
                                          }
                                      }
                                  }
                                  if (msg.optString("t") == "HB" || exists == null || !exists.handshakeOk) sendUnicast(buildHB("ACK"), pkt.address)
                                  updateUI()
                              }
                              "I_AM_HOST" -> {
                                  if (election.acceptHostAnnouncement(msg.optLong("id", -1L), msg.optLong("epoch", 0L))) {
                                      currentHostIdState.longValue = election.currentHostId
                                      currentEpochState.longValue = election.currentEpoch
                                  }
                              }
                          }
                      }
                  }

                  private fun updateUI() {
                      val live = peersMap.values.count { it.handshakeOk }
                      connectedCount.intValue = live
                      peersVersion.intValue += 1
                      statusText.value = if (live > 0) "متصل ($live) • القائد: ${if (election.currentHostId == selfId) "أنت" else (peersMap[election.currentHostId]?.name ?: "راكب")}" else "جارٍ البحث..."
                  }

                  private fun startHeartbeatLoop() {
                      scope.launch {
                          while (isActive) {
                              runCatching {
                                  sendHeartbeatNow()
                                  val dead = peersMap.filterValues { System.currentTimeMillis() - it.lastSeenMs > 9000L }.keys
                                  if (dead.isNotEmpty()) { dead.forEach { peersMap.remove(it) }; updateUI() }
                              }
                              delay(1400L + Random.nextLong(0L, 400L))
                          }
                      }
                  }

                  private fun startElectionLoop() {
                      scope.launch {
                          var stepDownId = -1L
                          var triggerMs = 0L
                          while (isActive) {
                              val now = System.currentTimeMillis()
                              val currentHost = election.currentHostId
                              if (currentHost == selfId && election.shouldStepDown(batteryPct, isCharging, thermalStatus, now) && triggerMs == 0L) {
                                  sendAll(JSONObject().apply { put("t", "STEP_DOWN"); put("id", selfId); put("epoch", election.currentEpoch) })
                                  stepDownId = selfId; triggerMs = now
                              } else if (currentHost != selfId && !peersMap.containsKey(currentHost) && peersMap.isNotEmpty() && triggerMs == 0L) {
                                  stepDownId = currentHost; triggerMs = now
                              }

                              if (triggerMs > 0L && now - triggerMs > 2000L) {
                                  val selfPeer = PeerInfo(selfId, userName, chainRank, batteryPct, isCharging, thermalStatus, election.currentEpoch, currentHost, "", now, true)
                                  val winner = election.pickBestLeader(selfPeer, peersMap.values, stepDownId)
                                  if (winner?.nodeId == selfId) {
                                      val (nHost, nEpoch) = election.declareSelfAsHost()
                                      currentHostIdState.longValue = nHost; currentEpochState.longValue = nEpoch
                                      sendAll(JSONObject().apply { put("t", "I_AM_HOST"); put("id", nHost); put("epoch", nEpoch) })
                                  }
                                  triggerMid = 0L; stepDownId = -1L
                              }
                              delay(1000L)
                          }
                      }
                  }

                  private var triggerMid = 0L

                  // --- AUDIO ENGINE (Jitter Buffer) ---
                  private fun startAudioEngine() {
                      try {
                          audioSocket = DatagramSocket(null).apply { reuseAddress = true; broadcast = true; bind(InetSocketAddress(AUDIO_PORT)) }
                      } catch (e: Exception) { debugLastError.value = "Audio Socket: ${e.message}"; return }

                      scope.launch {
                          val minOut = AudioTrack.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT).coerceAtLeast(1280)
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                              .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(SAMPLE_RATE).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                              .setBufferSizeInBytes(minOut * 2).setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY).setTransferMode(AudioTrack.MODE_STREAM).build()
                          track.play()

                          launch {
                              while (isActive) {
                                  val data = audioQueue.poll()
                                  if (data != null) track.write(data, 0, data.size)
                                  else delay(20L)
                              }
                          }

                          val buf = ByteArray(2048)
                          var lastClearJob: Job? = null
                          while (isActive) {
                              try {
                                  val pkt = DatagramPacket(buf, buf.size)
                                  audioSocket?.receive(pkt) ?: break
                                  if (pkt.data[0] == MAGIC_ACK) { pttDeliveredCount.intValue += 1; continue }
                                  if (pkt.length <= HEADER_SIZE || pkt.data[0] != MAGIC_AUDIO) continue

                                  val bb = ByteBuffer.wrap(pkt.data, 0, pkt.length)
                                  bb.get()
                                  val senderId = bb.long
                                  if (senderId == selfId) continue
                                  val seq = bb.int
                                  val rank = bb.get().toInt()

                                  if (seenAudio.put((senderId * 31L) xor seq.toLong(), true) != null) continue

                                  if (audioQueue.size < 50) audioQueue.add(pkt.data.copyOfRange(HEADER_SIZE, pkt.length))
                                  
                                  val name = peersMap[senderId]?.name ?: "راكب #$rank"
                                  activeSpeakerName.value = if (rank == 1) "القائد ($name)" else name
                                  lastClearJob?.cancel()
                                  lastClearJob = scope.launch { delay(600L); activeSpeakerName.value = null }

                                  val ack = byteArrayOf(MAGIC_ACK, 0, 0)
                                  runCatching { audioSocket?.send(DatagramPacket(ack, ack.size, pkt.address, AUDIO_PORT)) }
                              } catch (e: Exception) { if (isActive) delay(50) }
                          }
                          runCatching { track.stop(); track.release() }
                      }

                      scope.launch {
                          val minBuf = AudioRecord.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT).coerceAtLeast(1280)
                          var recorder: AudioRecord? = null
                          while (isActive) {
                              if (!isPttPressed && !isOpenMicOn) {
                                  if (recorder != null) { runCatching { recorder?.stop(); recorder?.release() }; recorder = null }
                                  delay(25L); continue
                              }
                              if (recorder == null) {
                                  runCatching {
                                      recorder = AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minBuf * 2).also {
                                          if (NoiseSuppressor.isAvailable()) NoiseSuppressor.create(it.audioSessionId)?.enabled = true
                                          if (AcousticEchoCanceler.isAvailable()) AcousticEchoCanceler.create(it.audioSessionId)?.enabled = true
                                          it.startRecording()
                                      }
                                  }
                              }
                              val pcm = ByteArray(FRAME_BYTES)
                              val read = recorder?.read(pcm, 0, FRAME_BYTES) ?: -1
                              if (read > 0) {
                                  val pktBytes = ByteArray(HEADER_SIZE + read)
                                  val bb = ByteBuffer.wrap(pktBytes)
                                  bb.put(MAGIC_AUDIO); bb.putLong(selfId); bb.putInt(seqCounter.getAndIncrement()); bb.put(chainRank.toByte()); bb.put(2.toByte()); bb.put(pcm, 0, read)
                                  for (target in cachedTargetIps) { runCatching { audioSocket?.send(DatagramPacket(pktBytes, pktBytes.size, target, AUDIO_PORT)) } }
                              }
                          }
                          runCatching { recorder?.stop(); recorder?.release() }
                      }
                  }
              }
          """)


                          }
                      }
                  }

                  private fun startAll() {
                      if (engine == null) {
                          val prefs = getSharedPreferences("bikemic_p2p", Context.MODE_PRIVATE)
                          val e = MeshVoiceEngine(this).apply {
                              userName = prefs.getString("name", "أبو ناصر") ?: "أبو ناصر"
                              chainRank = prefs.getInt("rank", 1)
                          }
                          engine = e
                          health = DeviceHealthMonitor(this) { bat, chg, thm ->
                              e.updateHealth(bat, chg, thm)
                          }.also { it.start() }
                          e.start()
                      }
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      engine?.stop()
                      health?.stop()
                  }
              }

